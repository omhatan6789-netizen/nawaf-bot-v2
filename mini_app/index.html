<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#570909">
<title>بوت نواف</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--red:#9e1018;--muted:rgba(255,255,255,.58)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#a20e18 0%,#650a10 40%,#16090b 100%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 15px 34px}
.wrap{max-width:620px;margin:auto}.hero{width:100%;height:220px;overflow:hidden;border-radius:0 0 22px 22px;background:linear-gradient(140deg,#b20e1b,#21090d);box-shadow:0 12px 32px #0006}.hero img{width:100%;height:100%;object-fit:cover;display:none}
.brand{text-align:center;margin:17px 0 22px;color:rgba(255,255,255,.48);font-size:13px;letter-spacing:1.5px;font-weight:600}
.section-title{font-size:14px;color:#ffffffb8;margin:20px 4px 10px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{border:1px solid #fff;border-radius:14px;background:#fff;color:#1a1111;min-height:58px;font-size:15px;font-weight:750;box-shadow:0 4px 0 #260609;cursor:pointer}
.menu button:first-child{grid-column:span 2}
.custom{display:grid;gap:12px}.custom-card{position:relative;display:flex;align-items:center;gap:12px;padding:10px 13px;border:1px solid #171010;border-radius:16px;background:#fff;color:#171010;box-shadow:0 5px 0 #160608;min-height:74px;text-decoration:none;overflow:hidden}
.custom-card .thumb{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#eee;flex:none}.custom-card .label{font-weight:750;flex:1;text-align:center;font-size:15px;overflow-wrap:anywhere}.dots{font-size:22px;color:#777;line-height:1}
.custom-card.large{display:block;padding:0 0 13px;text-align:center}.custom-card.large .large-image{width:100%;height:185px;object-fit:cover;display:block;background:#eee}.custom-card.large .label{display:block;padding:12px 12px 0;font-size:17px}
.empty{color:#ffffffbb;text-align:center;font-size:13px;padding:12px}.back-button{width:100%;margin-top:14px;border:1px solid #fff;border-radius:14px;background:#fff;color:#1a1111;min-height:52px;font-size:15px;font-weight:750;box-shadow:0 4px 0 #260609;cursor:pointer}#page-content .custom-card{min-height:58px}
</style></head>
<body><main class="wrap">
<div class="hero"><img id="banner" alt=""></div>
<div class="brand">Dev bot ~ نواف</div>
<div id="home">
<div class="section-title">القوائم</div>
<div class="menu">
<button data-action="points">توب النقاط</button><button data-action="active">توب المتفاعلين العام</button>
<button data-action="robbers">توب الحرامية</button><button data-action="games">الألعاب</button>
<button data-action="help">الأوامر</button>
</div>
<div class="section-title">إضافات</div><div class="custom" id="custom"></div>
</div>
<section id="page" hidden><div class="section-title" id="page-title"></div><div class="custom" id="page-content"></div><button id="back-home" class="back-button">↩ رجوع للقائمة الرئيسية</button></section>
</main>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
let botUsername='';
const home=document.getElementById('home');
const page=document.getElementById('page');
const pageTitle=document.getElementById('page-title');
const pageContent=document.getElementById('page-content');
function showHome(){page.hidden=true;home.hidden=false;}
function openBot(startParam=''){if(!botUsername)return;const link='https://t.me/'+botUsername+(startParam?'?start='+encodeURIComponent(startParam):'');if(tg?.openTelegramLink)tg.openTelegramLink(link);else location.href=link;}
function showTop(kind,title){
 home.hidden=true;page.hidden=false;pageTitle.textContent=title;pageContent.replaceChildren();
 const loading=document.createElement('div');loading.className='empty';loading.textContent='جاري تحميل الترتيب...';pageContent.appendChild(loading);
 fetch('/api/mini-app?top='+encodeURIComponent(kind)).then(async r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(data=>{
  pageContent.replaceChildren();
  if(!Array.isArray(data.leaderboard))throw new Error('No leaderboard data');
  if(!data.leaderboard.length){const e=document.createElement('div');e.className='empty';e.textContent='لا يوجد ترتيب حتى الآن';pageContent.appendChild(e);return;}
  data.leaderboard.forEach((item,i)=>{const row=document.createElement('div');row.className='custom-card';const name=document.createElement('span');name.className='label';name.textContent=(i+1)+'  •  '+item.name+'  —  '+(kind==='active'?'( رسالة '+item.value+' )':item.value+' '+item.unit);row.appendChild(name);pageContent.appendChild(row);});
 }).catch(()=>{pageContent.replaceChildren();const e=document.createElement('div');e.className='empty';e.textContent='تعذر تحميل الترتيب حاليًا، حاول مرة ثانية';pageContent.appendChild(e);});
}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{
 const a=b.dataset.action;
 if(a==='help'){openBot('help');return;}
 if(a==='games'){openBot('games');return;}
 const names={points:'توب النقاط',active:'توب المتفاعلين العام',robbers:'توب الحرامية'};
 showTop(a,names[a]||'التوب');
});
document.getElementById('back-home').onclick=showHome;
(async()=>{
 try{
  const r=await fetch('/api/mini-app');if(!r.ok)throw new Error('API');
  const data=await r.json();botUsername=data.bot_username||'';
  if(data.banner){const im=document.getElementById('banner');im.src=data.banner;im.style.display='block';}
  const root=document.getElementById('custom');
  for(const b of data.buttons||[]){
   const a=document.createElement('a');a.className='custom-card'+(b.type==='large'?' large':'');a.href=b.target;a.target='_blank';a.rel='noopener';a.style.background=b.color||'#fff';
   if(b.type==='large'){if(b.image){const im=document.createElement('img');im.className='large-image';im.src=b.image;a.appendChild(im);}const name=document.createElement('span');name.className='label';name.textContent=b.title;a.appendChild(name);}
   else{if(b.image){const im=document.createElement('img');im.className='thumb';im.src=b.image;a.appendChild(im);}const name=document.createElement('span');name.className='label';name.textContent=b.title;a.appendChild(name);const dots=document.createElement('span');dots.className='dots';dots.textContent='⋮';a.appendChild(dots);}
   root.appendChild(a);
  }
 }catch(e){document.getElementById('custom').innerHTML='<div class="empty">تعذر تحميل الإضافات حاليًا</div>';}
})();
</script></body></html>
