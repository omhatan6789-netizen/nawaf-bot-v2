tent:center;border-radius:22px;background:#050814b8;backdrop-filter:blur(3px);color:#fff;font-size:clamp(58px,18vw,100px);font-weight:1000;text-shadow:0 0 18px #ffffffaa,0 0 42px #ffffff77;pointer-events:none;animation:mg-count-pop .35s ease-out}.mg-countdown.go{font-size:clamp(42px,13vw,76px);color:#fff;letter-spacing:2px}@keyframes mg-count-pop{from{opacity:.25;transform:scale(.72)}to{opacity:1;transform:scale(1)}}.mg-memory-tile{aspect-ratio:1;border:3px solid #ffffff55;border-radius:22px;opacity:.75;transition:transform .12s,opacity .12s,filter .12s}.mg-memory-tile:disabled{opacity:.65}.mg-memory-tile.flash{opacity:1;filter:brightness(1.8);transform:scale(.96);box-shadow:0 0 24px #fff8}.mg-memory-tile:disabled.flash{opacity:1}.mg-memory-tile.pick-flash{opacity:1;filter:brightness(2.2);transform:scale(.94);border-color:#fff;box-shadow:0 0 0 3px #fff9,0 0 28px 10px #fff, inset 0 0 18px #ffffffaa}

<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
let botUsername='';
const home=document.getElementById('home');
const page=document.getElementById('page');
const pageTitle=document.getElementById('page-title');
const pageContent=document.getElementById('page-content');
function showHome(){stopC4Timer();stopMiniGameTimers();document.body.classList.remove('c4-active');page.hidden=true;home.hidden=false;}
function openBot(startParam=''){if(!botUsername)return;const link='https://t.me/'+botUsername+(startParam?'?start='+encodeURIComponent(startParam):'');if(tg?.openTelegramLink)tg.openTelegramLink(link);else location.href=link;}
function showTop(kind,title){
 home.hidden=true;page.hidden=false;pageTitle.textContent=title;pageContent.replaceChildren();
 const loading=document.createElement('div');loading.className='empty';loading.textContent='جاري تحميل الترتيب...';pageContent.appendChild(loading);
 fetch('/api/mini-app?top='+encodeURIComponent(kind)).then(async r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(data=>{
  pageContent.replaceChildren();
  if(!Array.isArray(data.leaderboard))throw new Error('No leaderboard data');
  if(!data.leaderboard.length){const e=document.createElement('div');e.className='empty';e.textContent='لا يوجد ترتيب حتى الآن';pageContent.appendChild(e);return;}
  data.leaderboard.forEach((item,i)=>{const row=document.createElement('div');row.className='custom-card';const name=document.createElement('span');name.className='label';name.textContent=(i+1)+'  •  '+item.name+'  —  '+(kind==='active'?'( رسالة '+item.value+' )':item.value+' '+item.unit);row.appendChild(name);pageContent.appendChild(row);});
 }).catch(()=>{pageContent.replaceChildren();const e=document.createElement('div');e.className='empty';e.textContent='تعذر تحميل الترتيب حاليًا، حاول مرة ثانية';pageContent.appendChild(e);});
}

function showGames(){
 stopC4Timer();stopMiniGameTimers();document.body.classList.remove('c4-active');home.hidden=true;page.hidden=false;pageTitle.textContent='الألعاب 🎮';pageContent.replaceChildren();
 const games=[
  ['🔴','كونكت 4','العب ضد البوت أو تحدَّ لاعبًا','connect'],
  ['🟦','المربعات','ارسم الخطوط واجمع المربعات','dots'],
  ['🧠','اختبر ذاكرتك','احفظ التسلسل وتحدَّ لاعبًا آخر','memory']
 ];
 games.forEach(([emoji,name,hint,type])=>{
  const card=document.createElement('button');card.className='custom-card';card.style.width='100%';card.style.cursor='pointer';
  const icon=document.createElement('span');icon.style.fontSize='28px';icon.textContent=emoji;card.appendChild(icon);
  const label=document.createElement('span');label.className='label';label.textContent=name;card.appendChild(label);
  const sub=document.createElement('span');sub.className='dots';sub.textContent=hint;card.appendChild(sub);
  card.onclick=()=>{if(type==='connect'){showConnect4Setup();return;}showMiniGameInstructions(type);};
  pageContent.appendChild(card);
 });
}
function showMiniGameInstructions(type){
 stopMiniGameTimers();document.body.classList.add('c4-active');

function playMemoryTone(frequency=660,duration=0.11){
  try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;const ctx=window.__mgAudio||(window.__mgAudio=new Ctx());if(ctx.state==='suspended')ctx.resume();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=frequency;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.13,ctx.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+duration+.02);}catch(e){}
 }
 function presentMemorySequence(sequence,key,onDone){
  if(memoryPresentationKey===key)return;
  memoryPresentationKey=key;memoryPlaybackTimers.forEach(clearTimeout);memoryPlaybackTimers=[];
  miniGameInputLocked=true;document.querySelectorAll('.mg-memory-tile').forEach(b=>b.disabled=true);
  const status=document.getElementById('mg-status'),board=document.getElementById('mg-board');let count=1;
  let overlay=board?.querySelector('.mg-countdown');if(!overlay&&board){overlay=document.createElement('div');overlay.className='mg-countdown';board.appendChild(overlay);}
  const showCount=value=>{if(overlay){overlay.textContent=value;overlay.classList.toggle('go',value==='GO!');overlay.style.display='flex';}};
  const countdown=()=>{if(memoryPresentationKey!==key)return;if(count<=3){showCount(String(count));if(status)status.textContent='استعد...';playMemoryTone(520,0.16);count++;memoryPlaybackTimers.push(setTimeout(countdown,850));return;}
   showCount('GO!');if(status)status.textContent='انطلق!';playMemoryTone(880,0.24);
   memoryPlaybackTimers.push(setTimeout(()=>{if(memoryPresentationKey!==key)return;if(overlay)overlay.style.display='none';if(status)status.textContent='احفظ التسلسل...';sequence.forEach((color,i)=>{
    memoryPlaybackTimers.push(setTimeout(()=>{const tile=document.querySelector('.mg-memory-tile[data-color="'+color+'"]');if(tile)tile.classList.add('flash');playMemoryTone([392,494,587,784][color],.2);},i*720+250));
    memoryPlaybackTimers.push(setTimeout(()=>{document.querySelectorAll('.mg-memory-tile').forEach(x=>x.classList.remove('flash'));if(i===sequence.length-1){miniGameInputLocked=false;document.querySelectorAll('.mg-memory-tile').forEach(b=>b.disabled=false);const s=document.getElementById('mg-status');if(s)s.textContent='دورك! كرر التسلسل';if(onDone)onDone();}},i*720+580));
   });},650));
  };countdown();
 }
function updateMiniGameProgress(){
 if(!miniGame)return;
 const game=miniGame,state=game.state;
 const score=document.getElementById('mg-score');
 if(score&&game.game_type==='memory')score.innerHTML='<span>المستوى: '+state.level+'</span><span>التقدم: '+state.progress+'/'+state.level+'</span>';
 const status=document.getElementById('mg-status');
 if(status&&game.game_type==='memory'&&game.your_turn&&!miniGameInputLocked)status.textContent='دورك! كرر التسلسل';
}
function startMiniGameTimer(game,fromNow=false){
 if(miniGameTimer)clearTimeout(miniGameTimer);if(miniGameTick)clearInterval(miniGameTick);
 const started=fromNow?Date.now():(Number(game.turn_started_at)||Date.now()),duration=Number(game.turn_seconds)||15;
 const update=()=>{const left=Math.max(0,duration-(Date.now()-started)/1000),clock=document.getElementById('mg-clock'),bar=document.getElementById('mg-progress-bar');if(clock)clock.textContent=Math.ceil(left)+' ثانية';if(bar)bar.style.width=(left/duration*100)+'%';};
 update();miniGameTick=setInterval(update,200);miniGameTimer=setTimeout(update,duration*1000+100);
}
function scheduleMiniGamePoll(){if(miniGamePollTimer)clearTimeout(miniGamePollTimer);miniGamePollTimer=setTimeout(pollMiniGameState,1100);}
async function pollMiniGameState(){
 miniGamePollTimer=null;
 try{
  const result=await miniGameRequest('/api/minigames/challenge/state',{challenge_id:miniGameChallengeIdFromStart});
  if(result.phase==='playing'){
   const next=result.game,changed=!miniGame||next.status!==miniGame.status||next.turn_player_id!==miniGame.turn_player_id||next.turn_started_at!==miniGame.turn_started_at||(next.game_type==='dots'&&JSON.stringify(next.state)!==JSON.stringify(miniGame.state));
   const progressChanged=miniGame&&next.game_type==='memory'&&next.state.progress!==miniGame.state.progress;
   miniGame=next;if(changed)renderMiniGame();else{if(progressChanged)updateMiniGameProgress();scheduleMiniGamePoll();}
  }else{renderMiniGameRps(result);miniGameChallengePollTimer=setTimeout(pollMiniGameChallenge,1200);}
 }catch(e){scheduleMiniGamePoll();}
}
async function submitMiniGameAction(action){
 if(miniGameBusy||!miniGame?.your_turn||miniGame.status!=='playing'||(miniGame.game_type==='memory'&&miniGameInputLocked))return;
 miniGameBusy=true;document.querySelectorAll('.mg-edge,.mg-memory-tile').forEach(b=>b.disabled=true);
 try{
  const result=await miniGameRequest('/api/minigames/action',{challenge_id:miniGameChallengeIdFromStart,action});
  const next=result.game,changed=next.status!==miniGame.status||next.turn_player_id!==miniGame.turn_player_id||next.turn_started_at!==miniGame.turn_started_at;
  miniGame=next;miniGameBusy=false;if(changed)renderMiniGame();else{updateMiniGameProgress();document.querySelectorAll('.mg-memory-tile').forEach(b=>b.disabled=false);scheduleMiniGamePoll();}
 }catch(e){miniGameBusy=false;const status=document.getElementById('mg-status');if(status)status.textContent=e.message;document.querySelectorAll('.mg-edge,.mg-memory-tile').forEach(b=>b.disabled=false);}
}
function renderC4ChallengeRps(state){
 stopC4Timer();const shell=c4Shell();

 const players=shell.querySelectorAll('.c4-player');players[0].querySelector('strong').textContent=names[0];players[1].querySelector('strong').textContent=names[1];
 const controls=shell.querySelector('#c4-challenge-rps');
 [['r','✊ حجر'],['p','✋ ورقة'],['s','✌️ مقص']].forEach(([value,label])=>{
  const b=document.createElement('button');b.className='c4-level';b.textContent=label;b.disabled=!!state.my_choice;
  if(state.my_choice===value)b.classList.add('active');

 });
 const status=shell.querySelector('#c4-rps-status');
 status.textContent=state.tie?'تعادل! اختاروا من جديد.':state.my_choice
  ?'تم تسجيل اختيارك ('+choiceNames[state.my_choice]+')، ننتظر اختيار اللاعب الآخر...'
  :state.opponent_chosen?'اللاعب الآخر اختار، اختر حركتك الآن.':'بانتظار اختيار اللاعبين...';
 if(state.my_choice)controls.querySelectorAll('button').forEach(b=>b.disabled=true);

async function startConnect4Challenge(){
 const shell=c4Shell();shell.innerHTML='<div class="c4-heading"><h2>جاري فتح التحدي...</h2></div>';
 try{const state=await c4ChallengeRequest('/api/connect4/challenge/state',{challenge_id:c4ChallengeIdFromStart});handleC4ChallengeResult(state);}
 catch(e){shell.innerHTML='<div class="c4-error"></div>';shell.querySelector('.c4-error').textContent=e.message;}
}
function handleC4ChallengeResult(result){
 if(result.phase==='playing'){c4Game=result.game;renderConnect4();return;}
 renderC4ChallengeRps(result);
 if(c4ChallengePollTimer)clearTimeout(c4ChallengePollTimer);
 c4ChallengePollTimer=setTimeout(pollC4ChallengeState,1200);
}
async function pollC4ChallengeState(){
 c4ChallengePollTimer=null;
 try{const state=await c4ChallengeRequest('/api/connect4/challenge/state',{challenge_id:c4ChallengeIdFromStart});handleC4ChallengeResult(state);}
 catch(e){c4ChallengePollTimer=setTimeout(pollC4ChallengeState,1800);}
}
async function submitC4ChallengeChoice(choice){
 document.querySelectorAll('#c4-challenge-rps button').forEach(b=>b.disabled=true);
 try{const result=await c4ChallengeRequest('/api/connect4/challenge/choice',{challenge_id:c4ChallengeIdFromStart,choice});handleC4ChallengeResult(result);}
 catch(e){const status=document.getElementById('c4-rps-status');if(status)status.textContent=e.message;document.querySelectorAll('#c4-challenge-rps button').forEach(b=>b.disabled=false);}
}
async function startConnect4(rpsChoice=null){
 const btn=document.getElementById('c4-start');if(btn){btn.disabled=true;btn.textContent='جاري تجهيز اللوحة...';}
 try{
  c4Game=c4GameIdFromUrl
   ? await c4Request('/api/connect4/state',{game_id:c4GameIdFromUrl})
   : await c4Request('/api/connect4/new',{difficulty:c4Difficulty,rps_choice:rpsChoice||'r'});
  renderConnect4();
 }catch(e){const shell=document.getElementById('c4-shell');if(shell){const error=document.createElement('div');error.className='c4-error';error.textContent=e.message;shell.appendChild(error);if(btn){btn.disabled=false;btn.textContent='ابدأ التحدي ✦';}}}
}
function renderConnect4(previousBoard=null){
 stopC4Timer();const shell=c4Shell();
 const human=c4Game.game_mode==='human';
 const p1=human?(c4Game.player1_name||'اللاعب الأول'):'أنت';
 const p2=human?(c4Game.player2_name||'اللاعب الثاني'):(c4Game.bot_name||'البوت');
 const myPiece=c4Game.my_piece||1;
 shell.innerHTML='<div class="c4-heading"><h2>كونكت 4</h2><p>'+(human?'مباراة بين لاعبين':'المستوى: '+c4Game.difficulty)+'</p></div><div class="c4-players"><div class="c4-player"><i class="c4-disc red"></i><div><strong></strong><small>الأحمر</small></div></div><span class="c4-vs">VS</span><div class="c4-player"><i class="c4-disc blue"></i><div><strong></strong><small>الأزرق</small></div></div></div><div class="c4-status"><div class="c4-statusline"><span id="c4-status">...</span><span class="c4-clock" id="c4-clock">15 ثانية</span></div><div class="c4-track"><div class="c4-progress" id="c4-progress"></div></div></div><div class="c4-board-wrap"><div class="c4-board" id="c4-board"></div><svg class="c4-win-svg" id="c4-win-svg" viewBox="0 0 700 600" preserveAspectRatio="none"></svg></div><div class="c4-result" id="c4-result"></div><div class="c4-actions"><button class="c4-secondary" id="c4-again">مباراة جديدة ↻</button><button class="c4-secondary" id="c4-level-back">رجوع</button></div><div class="c4-hint">اضغط على أي خانة في العمود لإسقاط القرص</div>';
 const players=shell.querySelectorAll('.c4-player');
 players[0].querySelector('strong').textContent=p1;players[1].querySelector('strong').textContent=p2;
 const board=shell.querySelector('#c4-board');
 const myTurn=!!c4Game.your_turn;
 const activeIndex=human?(myTurn?(myPiece===1?0:1):(myPiece===1?1:0)):(c4Game.bot_move_pending?1:0);
 const arrowRow=document.createElement('div');arrowRow.className='c4-arrows';
 for(let col=0;col<7;col++){const arrow=document.createElement('button');arrow.type='button';arrow.className='c4-arrow'+(myTurn&&c4Game.status==='playing'?' active':'');arrow.textContent='↓';arrow.setAttribute('aria-label','العب في العمود '+(col+1));arrow.disabled=!myTurn||c4Game.board[0][col]!==0||c4Game.status!=='playing';arrow.onclick=()=>submitConnect4Move(col);arrowRow.appendChild(arrow);}
 board.parentElement.insertBefore(arrowRow,board);
 c4Game.board.forEach((row,r)=>row.forEach((piece,col)=>{
  const slot=document.createElement('button');slot.className='c4-slot';slot.type='button';slot.setAttribute('aria-label','العمود '+(col+1));
  if(piece){const disc=document.createElement('span');const isNew=previousBoard&&previousBoard[r][col]===0;disc.className='c4-disc '+(piece===1?'red':'blue')+(isNew?' falling':'');if(isNew)disc.style.animationDelay=(r*.035)+'s';slot.appendChild(disc);}
  slot.disabled=!myTurn||c4Game.status!=='playing'||c4Game.board[0][col]!==0;
  slot.onclick=()=>submitConnect4Move(col);board.appendChild(slot);
 }));
 shell.querySelector('#c4-again').onclick=()=>{c4GameIdFromUrl=null;showConnect4Setup();};
 shell.querySelector('#c4-level-back').onclick=()=>{c4GameIdFromUrl=null;showConnect4Setup();};
 if(c4Game.winning_cells?.length===4){
  const first=c4Game.winning_cells[0],last=c4Game.winning_cells[3];
  const svg=shell.querySelector('#c4-win-svg'),boardEl=shell.querySelector('#c4-board');
  const center=(cell)=>{const slot=boardEl.children[cell[0]*7+cell[1]],rect=slot.getBoundingClientRect(),base=svg.getBoundingClientRect();return {x:(rect.left+rect.width/2-base.left)/base.width*700,y:(rect.top+rect.height/2-base.top)/base.height*600};};
  const a=center(first),b=center(last),line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);line.setAttribute('pathLength','1');svg.appendChild(line);
 }
 if(c4Game.status!=='playing'){
  const result=shell.querySelector('#c4-result');result.classList.add('show');
  result.textContent=c4Game.status==='draw'?'🤝 تعادل! تم إرجاع الرهانات':c4Game.status==='won'?'🏆 فزت! لعب ممتاز!':'🏆 فاز '+(c4Game.winner_name||p2)+'!';
  shell.querySelector('#c4-status').textContent='انتهت المباراة';shell.querySelector('#c4-clock').textContent='—';shell.querySelector('#c4-progress').style.width='0%';
 }else if(!myTurn){
  const rpsLine=human&&c4Game.challenge_starter_name
   ? '✊ حجر ورقة مقص: يبدأ '+c4Game.challenge_starter_name
   : c4Game.rps_result
    ? (c4Game.rps_result==='bot_starts'
       ? '✊ حجر ورقة مقص: البوت فاز ('+({r:'حجر',p:'ورقة',s:'مقص'}[c4Game.rps_bot_choice]||'')+')'
       : '✊ حجر ورقة مقص: أنت فزت ('+({r:'حجر',p:'ورقة',s:'مقص'}[c4Game.rps_bot_choice]||'')+')')
    : '';
  shell.querySelector('#c4-status').textContent=rpsLine?(rpsLine+' — '+(c4Game.bot_move_pending?'البوت يبدأ الآن':'انتظر دورك')):(c4Game.bot_move_pending?'البوت يستعد للحركة...':'دور '+(human?(myPiece===1?p2:p1):p2));
  shell.querySelector('#c4-clock').textContent='انتظار';
  players.forEach((el,i)=>el.classList.toggle('active',i===activeIndex));
  if(c4Game.bot_move_pending){
   let fallDelay=0;
   if(previousBoard){for(let r=0;r<6;r++){for(let col=0;col<7;col++){if(previousBoard[r][col]===0&&c4Game.board[r][col]!==0)fallDelay=Math.max(fallDelay,r*35);}}}
   c4BotTimer=setTimeout(runC4BotMove,1620+fallDelay);
  }
  else if(human){startC4Timer();pollConnect4State();}
 }else{
  shell.querySelector('#c4-status').textContent=human&&c4Game.challenge_starter_name
   ? '✊ حجر ورقة مقص: يبدأ '+c4Game.challenge_starter_name+' — دورك! اختر عمودًا'
   : c4Game.rps_result?(c4Game.rps_result==='bot_starts'?'✊ حجر ورقة مقص: فاز '+p2+' ('+({r:'حجر',p:'ورقة',s:'مقص'}[c4Game.rps_bot_choice]||'')+') ويبدأ أولًا':'✊ حجر ورقة مقص: فزت ('+({r:'حجر',p:'ورقة',s:'مقص'}[c4Game.rps_bot_choice]||'')+') وتبدأ أولًا'):'دورك! اختر عمودًا';
  players.forEach((el,i)=>{el.classList.toggle('active',i===(human?(myPiece===1?0:1):0));el.style.setProperty('--turn-color',i===(human?(myPiece===1?0:1):0)?'#ff3448':'#278bff');});
  shell.querySelectorAll('.c4-arrow').forEach(el=>el.style.setProperty('--turn-color',myPiece===1?'#ff3448':'#278bff'));
  startC4Timer();
 }
}
async function runC4BotMove(){
 if(c4Busy||!c4Game||!c4Game.bot_move_pending)return;
 c4Busy=true;const previous=c4Game.board.map(row=>row.slice());
 try{
  const rpsInfo={rps_result:c4Game.rps_result,rps_player_choice:c4Game.rps_player_choice,rps_bot_choice:c4Game.rps_bot_choice};
  c4Game=await c4Request('/api/connect4/bot-move',{game_id:c4Game.id});
  Object.assign(c4Game,Object.fromEntries(Object.entries(rpsInfo).filter(([,v])=>v!==undefined)));
  c4Busy=false;renderConnect4(previous);
 }
 catch(e){c4Busy=false;const s=document.getElementById('c4-status');if(s)s.textContent=e.message;c4BotTimer=setTimeout(runC4BotMove,1500);}
}
async function pollConnect4State(){
 if(c4PollTimer||!c4Game||c4Game.game_mode!=='human'||c4Game.status!=='playing')return;
 c4PollTimer=setTimeout(async()=>{
  c4PollTimer=null;
  try{const next=await c4Request('/api/connect4/state',{game_id:c4Game.id});
   if(JSON.stringify(next.board)!==JSON.stringify(c4Game.board)||next.status!==c4Game.status||next.your_turn!==c4Game.your_turn){const previous=c4Game.board.map(row=>row.slice());c4Game=next;renderConnect4(previous);}
   else pollConnect4State();
  }catch(e){pollConnect4State();}
 },1300);
}
function startC4Timer(){
 stopC4Timer();if(!c4Game||c4Game.status!=='playing')return;
 c4Seconds=15;const started=Number(c4Game.turn_started_at)||Date.now();
 const update=()=>{const left=Math.max(0,15-(Date.now()-started)/1000);const clock=document.getElementById('c4-clock'),bar=document.getElementById('c4-progress');if(clock)clock.textContent=Math.ceil(left)+' ثانية';if(bar)bar.style.width=(left/15*100)+'%';if(left<=0){stopC4Timer();if(c4Game.your_turn){const legal=c4Game.board[0].map((v,i)=>v===0?i:null).filter(v=>v!==null);if(legal.length)submitConnect4Move(legal[Math.floor(Math.random()*legal.length)],true);}else if(c4Game.game_mode==='human'){pollConnect4State();}}};
 update();c4Tick=setInterval(update,200);c4Timer=setTimeout(update,15100);
}
async function submitConnect4Move(col,automatic=false){
 if(c4Busy||!c4Game||c4Game.status!=='playing'||!c4Game.your_turn)return;
 const previousBoard=c4Game.board.map(row=>row.slice());c4Busy=true;stopC4Timer();
 document.querySelectorAll('.c4-slot,.c4-arrow').forEach(x=>x.disabled=true);
 const status=document.getElementById('c4-status');if(status)status.textContent=automatic?'انتهى الوقت! اخترنا لك حركة عشوائية':'جاري إسقاط القرص...';
 try{c4Game=await c4Request('/api/connect4/move',{game_id:c4Game.id,column:col});c4Busy=false;renderConnect4(previousBoard);}
 catch(e){c4Busy=false;const s=document.getElementById('c4-status');if(s)s.textContent=e.message;startC4Timer();pollConnect4State();}
}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{
 const a=b.dataset.action;
 if(a==='help'){openBot('help');return;}
 if(a==='games'){showGames();return;}
 const names={points:'توب النقاط',active:'توب المتفاعلين العام',robbers:'توب الحرامية'};
 showTop(a,names[a]||'التوب');
});
document.getElementById('back-home').onclick=showHome;
(async()=>{
 try{

  const data=await r.json();botUsername=data.bot_username||'';

   if(b.type==='large'){if(b.image){const im=document.createElement('img');im.className='large-image';im.src=b.image;a.appendChild(im);}const name=document.createElement('span');name.className='label';name.textContent=b.title;a.appendChild(name);}
   else{if(b.image){const im=document.createElement('img');im.className='thumb';im.src=b.image;a.appendChild(im);}const name=document.createElement('span');name.className='label';name.textContent=b.title;a.appendChild(name);const dots=document.createElement('span');dots.className='dots';dots.textContent='⋮';a.appendChild(dots);}
   root.appendChild(a);
  }
  if(miniGameChallengeIdFromStart){home.hidden=true;page.hidden=false;pageTitle.textContent='الألعاب';startMiniGameChallenge();}
  else if(c4ChallengeIdFromStart){home.hidden=true;page.hidden=false;pageTitle.textContent='كونكت 4';startConnect4Challenge();}
  else if(c4GameIdFromUrl){home.hidden=true;page.hidden=false;pageTitle.textContent='كونكت 4';startConnect4();}
 }catch(e){document.getElementById('custom').innerHTML='<div class="empty">تعذر تحميل الإضافات حاليًا</div>';}
})();
