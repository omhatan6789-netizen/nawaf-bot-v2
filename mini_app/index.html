<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
let botUsername='';
const home=document.getElementById('home');
const page=document.getElementById('page');
const pageTitle=document.getElementById('page-title');
const pageContent=document.getElementById('page-content');
let miniAppColorMap={};
function miniButtonText(el){const label=el.querySelector?.('.label');return String(label?.innerText||el.innerText||el.textContent||'').replace(/^[\p{S}\p{P}\s]+/u,'').replace(/\s+/g,' ').trim();}
function miniButtonTextColor(hex){
 const h=String(hex||'').replace('#','');if(!/^[0-9a-fA-F]{6}$/.test(h))return '#ffffff';
 const n=parseInt(h,16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
 return (0.299*r+0.587*g+0.114*b)>160?'#171717':'#ffffff';
}
function applyMiniAppButtonColors(map){
 if(map)miniAppColorMap=map;
 document.querySelectorAll('button,.back-button,.custom-card').forEach(el=>{
  const key=miniButtonText(el),color=miniAppColorMap[key];
  if(!color)return;
  el.style.setProperty('background',color,'important');
  el.style.setProperty('background-color',color,'important');
  el.style.setProperty('border-color',color,'important');
  el.style.setProperty('color',miniButtonTextColor(color),'important');
  el.style.setProperty('box-shadow','0 4px 0 '+color+'88','important');
 });
}
const miniButtonColorObserver=new MutationObserver(()=>applyMiniAppButtonColors());
miniButtonColorObserver.observe(document.body,{childList:true,subtree:true,characterData:true});
function showHome(){stopC4Timer();stopMiniGameTimers();stopExtraGame();document.body.classList.remove('c4-active');page.hidden=true;home.hidden=false;}
function telegramDisplayName(){const u=tg?.initDataUnsafe?.user||{};return [u.first_name,u.last_name].filter(Boolean).join(' ').trim()||u.username||'أنت';}
function winnerDisplayName(game){const status=String(game?.status||'');const botName=String(game?.bot_name||'').trim();if(botName&&(status==='won'||status==='lost'))return status==='lost'?botName:telegramDisplayName();const name=String(game?.winner_name||'').trim();return (!name||name==='أحد اللاعبين'||name==='أنت')?telegramDisplayName():name;}
function openBot(startParam=''){if(!botUsername)return;const link='https://t.me/'+botUsername+(startParam?'?start='+encodeURIComponent(startParam):'');if(tg?.openTelegramLink)tg.openTelegramLink(link);else location.href=link;}
function showTop(kind,title){
 home.hidden=true;page.hidden=false;pageTitle.textContent=title;pageContent.replaceChildren();
 if(kind==='games'){
  const chooser=document.createElement('div');chooser.className='c4-panel';chooser.style.display='grid';chooser.style.gap='10px';
  const wins=document.createElement('button');wins.className='c4-secondary c4-win';wins.textContent='🏆 الأكثر فوزًا';
  wins.onclick=()=>showTop('game_wins','🏆 توب الأكثر فوزًا');
  const losses=document.createElement('button');losses.className='c4-secondary c4-loss';losses.textContent='💀 الأكثر خسارة';
  losses.onclick=()=>showTop('game_losses','💀 توب الأكثر خسارة');
  chooser.append(wins,losses);pageContent.appendChild(chooser);return;
 }
 const loading=document.createElement('div');loading.className='empty';loading.textContent='جاري تحميل الترتيب...';pageContent.appendChild(loading);
 fetch('/api/mini-app?top='+encodeURIComponent(kind)).then(async r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(data=>{
  pageContent.replaceChildren();
  if(!Array.isArray(data.leaderboard))throw new Error('No leaderboard data');
  if(!data.leaderboard.length){const e=document.createElement('div');e.className='empty';e.textContent='لا يوجد ترتيب حتى الآن';pageContent.appendChild(e);return;}
  data.leaderboard.forEach((item,i)=>{const row=document.createElement('div');row.className='custom-card';const name=document.createElement('span');name.className='label';name.textContent=(i+1)+'  •  '+item.name+'  —  '+(kind==='active'?'( رسالة '+item.value+' )':item.value+' '+item.unit);row.appendChild(name);pageContent.appendChild(row);});
 }).catch(()=>{pageContent.replaceChildren();const e=document.createElement('div');e.className='empty';e.textContent='تعذر تحميل الترتيب حاليًا، حاول مرة ثانية';pageContent.appendChild(e);});
}

function showGames(){
 stopC4Timer();stopMiniGameTimers();stopExtraGame();document.body.classList.remove('c4-active');home.hidden=true;page.hidden=false;pageTitle.textContent='الألعاب 🎮';pageContent.replaceChildren();
 const games=[
  ['🔴','كونكت 4','العب ضد البوت أو تحدَّ لاعبًا','connect'],
  ['🟦','المربعات','ارسم الخطوط واجمع المربعات','dots'],
  ['🧠','اختبر ذاكرتك','احفظ التسلسل وتحدَّ لاعبًا آخر','memory'],
  ['🔤','خمن الكلمة','تحدَّ حتى 10 لاعبين أو تدرب لحالك','word'],
 ];
 games.forEach(([emoji,name,hint,type])=>{
  const card=document.createElement('button');card.className='custom-card game-card';card.type='button';card.style.width='100%';card.style.cursor='pointer';
  const imageUrl=onlineGameImages[type];
  if(imageUrl){
   const image=document.createElement('img');image.className='game-cover';image.src=imageUrl;image.alt=name;image.loading='lazy';
   image.onerror=()=>{image.remove();const placeholder=document.createElement('div');placeholder.className='game-cover-placeholder';placeholder.textContent=emoji;card.insertBefore(placeholder,label);};
   card.appendChild(image);
  }else{
   const placeholder=document.createElement('div');placeholder.className='game-cover-placeholder';placeholder.textContent=emoji;card.appendChild(placeholder);
  }
  const label=document.createElement('span');label.className='label';label.textContent=name;card.appendChild(label);
  card.onclick=()=>{if(type==='connect'){showConnect4Setup();return;}if(type==='word'){showWordSetup();return;}showMiniGameInstructions(type);};
  pageContent.appendChild(card);
 });
}
function showMiniGameInstructions(type){
 stopMiniGameTimers();document.body.classList.add('c4-active');
 const shell=c4Shell(),isDots=type==='dots',title=isDots?'المربعات 🟦':'اختبر ذاكرتك 🧠';
 shell.innerHTML='<div class="c4-heading"><h2>'+title+'</h2><p>اختر طريقة اللعب</p></div><div class="c4-panel"><button class="c4-start" id="mg-solo">🤖 العب ضد البوت</button><button class="c4-secondary" id="mg-multi">👥 تحدَّ لاعبًا</button><div class="c4-result show">'+(isDots?'ارسم الخطوط وأكمل المربعات لتحصل على نقاط.':'احفظ تسلسل الألوان وكرره، وكل جولة يزيد التسلسل.')+'</div><button class="c4-secondary" id="mg-back">رجوع للألعاب</button></div>';
 shell.querySelector('#mg-solo').onclick=()=>showMiniGameDifficulty(type);
 shell.querySelector('#mg-multi').onclick=()=>showMiniGameMultiplayerInfo(type);
 shell.querySelector('#mg-back').onclick=showGames;
}
function showMiniGameMultiplayerInfo(type){
 const shell=c4Shell(),command=type==='dots'?'مربعات':'ذاكرة';
 shell.innerHTML='<div class="c4-heading"><h2>تحدي لاعب 👥</h2></div><div class="c4-panel"><div class="c4-result show">رد على رسالة اللاعب في القروب واكتب <b>'+command+'</b>، أو أضف مبلغ الرهان مثل <b>'+command+' 50000</b>. الرهان الافتراضي 20,000 لكل لاعب.</div><button class="c4-secondary" id="mg-back">رجوع</button></div>';
 shell.querySelector('#mg-back').onclick=()=>showMiniGameInstructions(type);
}
function showMiniGameDifficulty(type){
 stopMiniGameTimers();const shell=c4Shell(),title=type==='dots'?'المربعات 🟦':'اختبر ذاكرتك 🧠';
 const levels=[['سهل','مناسب للتجربة'],['متوسط','تحدي متوازن'],['صعب','خصم أذكى'],['مستحيل','أقوى مستوى']];
 shell.innerHTML='<div class="c4-heading"><h2>'+title+'</h2><p>اختر مستوى البوت</p></div><div class="c4-levels" id="mg-difficulty"></div><button class="c4-secondary" id="mg-back">رجوع</button>';
 const root=shell.querySelector('#mg-difficulty');
 levels.forEach(([level,desc])=>{const b=document.createElement('button');b.className='c4-level';b.innerHTML='<b>'+level+'</b><small>'+desc+'</small>';b.onclick=()=>startMiniGameSolo(type,level);root.appendChild(b);});
 shell.querySelector('#mg-back').onclick=()=>showMiniGameInstructions(type);
}

let c4Difficulty='متوسط',c4Game=null,c4Timer=null,c4Tick=null,c4Busy=false,c4Seconds=15,c4BotTimer=null,c4PollTimer=null,c4RpsChoice=null,c4ChallengePollTimer=null;
const c4StartParam=tg?.initDataUnsafe?.start_param||'';
const onlineConnectId=c4StartParam.startsWith('online_c4_')?c4StartParam.slice(10):'';
const onlineMiniGameId=c4StartParam.startsWith('online_mg_')?c4StartParam.slice(10):'';
const onlineLobbyId=c4StartParam.startsWith('online_lobby_')?c4StartParam.slice(13):'';
const onlineMode=!!(onlineConnectId||onlineMiniGameId);
let c4GameIdFromUrl=onlineConnectId||new URLSearchParams(window.location.search).get('game_id');
const c4ChallengeIdFromStart=c4StartParam.startsWith('c4c_')?c4StartParam.slice(4):new URLSearchParams(window.location.search).get('challenge_id');
const miniGameChallengeIdFromStart=onlineMiniGameId||(c4StartParam.startsWith('mg_')?c4StartParam.slice(3):new URLSearchParams(window.location.search).get('mini_game_id'));
let miniGame=null,miniGamePollTimer=null,miniGameChallengePollTimer=null,miniGameTimer=null,miniGameTick=null,miniGameBusy=false,miniGameInputLocked=true;
let memoryPlaybackTimers=[],memoryPresentationKey=null;
let miniSoloGame=null,miniSoloId=null,miniSoloPoll=null,miniSoloBotTimer=null,miniSoloClock=null,miniSoloTick=null,miniSoloBusy=false;
const c4Levels=[['سهل','مناسب للتجربة'],['متوسط','تحدي متوازن'],['صعب','يفكر قبل أن يلعب'],['مستحيل','أقوى تحدي']];
function stopC4Timer(){if(c4Timer)clearTimeout(c4Timer);if(c4Tick)clearInterval(c4Tick);if(c4BotTimer)clearTimeout(c4BotTimer);if(c4PollTimer)clearTimeout(c4PollTimer);if(c4ChallengePollTimer)clearTimeout(c4ChallengePollTimer);c4Timer=null;c4Tick=null;c4BotTimer=null;c4PollTimer=null;c4ChallengePollTimer=null;}
function c4Shell(){document.body.classList.add('c4-active');pageContent.innerHTML='<div class="c4-shell" id="c4-shell"></div>';return document.getElementById('c4-shell');}
function showConnect4Setup(){
 stopC4Timer();c4Game=null;c4Busy=false;c4RpsChoice=null;
 const shell=c4Shell();
 shell.innerHTML='<div class="c4-heading"><h2>كونكت 4 <span style="font-size:20px">🔴🔵</span></h2><p>كوّن أربعة أقراص متصلة قبل البوت</p></div><div class="c4-panel"><div class="c4-label">اختر مستوى البوت</div><div class="c4-levels" id="c4-levels"></div><div class="c4-label" style="margin-top:18px">حجر ورقة مقص — من يبدأ؟</div><div class="c4-levels" id="c4-rps"></div><button class="c4-start" id="c4-start">ابدأ التحدي ✦</button><div class="c4-hint">فرصة فوز البوت في حجر ورقة مقص 40٪</div></div>';
 const levels=shell.querySelector('#c4-levels');
 c4Levels.forEach(([name,desc])=>{const b=document.createElement('button');b.className='c4-level'+(c4Difficulty===name?' active':'');b.innerHTML=name+'<small>'+desc+'</small>';b.onclick=()=>{c4Difficulty=name;levels.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));};levels.appendChild(b);});
 const rps=shell.querySelector('#c4-rps');
 [['r','✊ حجر'],['p','✋ ورقة'],['s','✌️ مقص']].forEach(([value,label])=>{const b=document.createElement('button');b.className='c4-level';b.textContent=label;b.onclick=()=>{c4RpsChoice=value;rps.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));};rps.appendChild(b);});
 shell.querySelector('#c4-start').onclick=()=>{if(!c4RpsChoice){shell.querySelector('.c4-hint').textContent='اختر حجر أو ورقة أو مقص أولًا';return;}startConnect4(c4RpsChoice);};
}
async function c4Request(path,payload){
 const initData=tg?.initData||'';
 if(!initData)throw new Error('افتح الميني آب من داخل تيليجرام حتى نتحقق من حسابك');
 const requestPath=(onlineConnectId&&path==='/api/connect4/state')?'/api/online/spectate':path;
 const requestPayload=requestPath==='/api/online/spectate'?{game_type:'connect',game_id:payload.game_id,initData}:{...payload,initData};
 const response=await fetch(requestPath,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(requestPayload)});
 const data=await response.json().catch(()=>({}));
 if(!response.ok||!data.ok)throw new Error(data.error||'تعذر الاتصال بالسيرفر');
 return requestPath==='/api/online/spectate'?data.result.game:data.game;
}
async function c4ChallengeRequest(path,payload={}){
 const initData=tg?.initData||'';
 if(!initData)throw new Error('افتح الميني آب من داخل تيليجرام حتى نتحقق من حسابك');
 const requestPath=(onlineMiniGameId&&path==='/api/minigames/challenge/state')?'/api/online/spectate':path;
 const requestPayload=requestPath==='/api/online/spectate'?{game_type:'mini',game_id:payload.challenge_id,initData}:{...payload,initData};
 const response=await fetch(requestPath,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(requestPayload)});
 const data=await response.json().catch(()=>({}));
 if(!response.ok||!data.ok)throw new Error(data.error||'تعذر الاتصال بالسيرفر');
 return requestPath==='/api/online/spectate'?{phase:'playing',game:data.result.game}:data.result;
}
function stopMiniGameTimers(){
 if(miniSoloPoll)clearTimeout(miniSoloPoll);if(miniSoloBotTimer)clearTimeout(miniSoloBotTimer);if(miniSoloClock)clearTimeout(miniSoloClock);if(miniSoloTick)clearInterval(miniSoloTick);
 miniSoloPoll=miniSoloBotTimer=miniSoloClock=miniSoloTick=null;miniSoloGame=null;miniSoloId=null;miniSoloBusy=false;
 if(miniGamePollTimer)clearTimeout(miniGamePollTimer);
 if(miniGameChallengePollTimer)clearTimeout(miniGameChallengePollTimer);
 if(miniGameTimer)clearTimeout(miniGameTimer);
 if(miniGameTick)clearInterval(miniGameTick);
 memoryPlaybackTimers.forEach(clearTimeout);memoryPlaybackTimers=[];
 miniGamePollTimer=miniGameChallengePollTimer=miniGameTimer=miniGameTick=null;memoryPresentationKey=null;miniGameInputLocked=true;
}

let onlineLobbyPoll=null, onlineLobbyState=null, onlineGameImages={};
async function onlineLobbyRequest(action,settings={}){
 const initData=tg?.initData||'';
 if(!initData)throw new Error('افتح الغرفة من داخل تيليجرام');
 const response=await fetch('/api/online/lobby',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,lobby_id:onlineLobbyId,action,settings})});
 const data=await response.json().catch(()=>({}));
 if(!response.ok||!data.ok)throw new Error(data.error||'تعذر تحديث الغرفة');
 return data.result;
}
function renderOnlineLobby(state){
 onlineLobbyState=state;
 const shell=c4Shell(),names={connect:'Connect Four 🔴',dots:'Dots and Boxes 🟦',memory:'Memory Match 🧠'};
 const me=Number(tg?.initDataUnsafe?.user?.id||0),isCreator=state.is_creator;
 const joined=state.players||[];
 const slots=Array.from({length:state.player_count},(_,i)=>joined[i]?'<div class="c4-player"><strong>'+escapeLobbyText(joined[i].name)+'</strong><small>منضم ✓</small></div>':'<div class="c4-player"><strong>بانتظار لاعب</strong><small>المقعد '+(i+1)+'</small></div>').join('');
 const canConfigure=isCreator&&state.status==='pending';
 const cover=onlineGameImages[state.game_type]?'<img class="online-game-cover" src="'+escapeLobbyText(onlineGameImages[state.game_type])+'" alt="صورة اللعبة">':'';
 shell.innerHTML=cover+'<div class="c4-heading"><h2>غرفة اللعبة 🎮</h2><p>'+names[state.game_type]+'</p></div><div class="c4-panel"><div class="c4-label">اللاعبون ('+joined.length+'/'+state.player_count+')</div><div class="c4-players" style="display:grid;grid-template-columns:1fr 1fr;gap:9px">'+slots+'</div><div class="c4-label" style="margin-top:18px">إعدادات الغرفة</div><div class="c4-levels" id="online-counts"></div><div class="c4-levels" id="online-modes"></div><div class="c4-result show" id="online-room-status"></div><button class="c4-start" id="online-join">انضمام إلى الغرفة 👥</button><button class="c4-secondary" id="online-start">بدء اللعبة 🚀</button><button class="c4-secondary" id="online-leave">مغادرة الغرفة</button></div>';
 const status=shell.querySelector('#online-room-status');
 const counts=shell.querySelector('#online-counts'),modes=shell.querySelector('#online-modes');
 const supported=state.game_type==='dots'?[2,3,4]:[2];
 supported.forEach(n=>{const b=document.createElement('button');b.className='c4-level'+(state.player_count===n?' active':'');b.textContent=n+' لاعبين';b.disabled=!canConfigure;b.onclick=()=>onlineLobbyRequest('configure',{player_count:n,team_mode:n===4?state.team_mode:'individual'}).then(loadOnlineLobby).catch(showOnlineLobbyError);counts.appendChild(b);});
 if(state.game_type==='dots'&&state.player_count===4){
  [['individual','كل لاعب لحاله'],['teams','فريقين 2 ضد 2']].forEach(([v,t])=>{const b=document.createElement('button');b.className='c4-level'+(state.team_mode===v?' active':'');b.textContent=t;b.disabled=!canConfigure;b.onclick=()=>onlineLobbyRequest('configure',{player_count:4,team_mode:v}).then(loadOnlineLobby).catch(showOnlineLobbyError);modes.appendChild(b);});
 }else{modes.remove();}
 const join=shell.querySelector('#online-join'),start=shell.querySelector('#online-start'),leave=shell.querySelector('#online-leave');
 join.disabled=state.status!=='pending'||state.is_joined||joined.length>=state.player_count;
 join.textContent=state.is_joined?'أنت منضم بالفعل ✓':'انضمام إلى الغرفة 👥';
 join.onclick=()=>onlineLobbyRequest('join',{name:tg?.initDataUnsafe?.user?.first_name||'لاعب'}).then(loadOnlineLobby).catch(showOnlineLobbyError);
 start.hidden=!isCreator||state.status!=='pending';
 start.disabled=joined.length<state.player_count;
 start.onclick=()=>onlineLobbyRequest('start').then(result=>{onlineLobbyState=result;loadOnlineLobby();}).catch(showOnlineLobbyError);
 leave.hidden=state.status!=='pending'||!state.is_joined;
 leave.onclick=()=>onlineLobbyRequest('leave').then(loadOnlineLobby).catch(showOnlineLobbyError);
 if(state.status==='playing'){
  status.textContent='بدأت المباراة! افتحوا اللعبة من الزر أدناه.';
  const launch=document.createElement('button');launch.className='c4-start';launch.textContent='فتح اللعبة الآن 🎮';
  launch.onclick=()=>{const param=state.game_type==='connect'?'online_c4_'+state.game_id:'online_mg_'+state.game_id;const url='https://t.me/'+botUsername+'?startapp='+param;if(tg?.openTelegramLink)tg.openTelegramLink(url);else location.href=url;};
  shell.querySelector('.c4-panel').appendChild(launch);
  start.hidden=true;join.hidden=true;leave.hidden=true;
 }else if(state.status==='cancelled'){status.textContent='تم إلغاء الغرفة.';join.hidden=true;start.hidden=true;leave.hidden=true;}
 else{status.textContent=isCreator?'أنت صاحب الغرفة. اضبط الإعدادات وانتظر انضمام اللاعبين.':'انضم للغرفة وانتظر بدء صاحبها.';}
}
function escapeLobbyText(value){return String(value||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function showOnlineLobbyError(error){const el=document.getElementById('online-room-status');if(el)el.textContent=error?.message||'حدث خطأ';}
async function loadOnlineLobby(){
 const state=await onlineLobbyRequest('state');renderOnlineLobby(state);
}
function startOnlineLobby(){
 home.hidden=true;page.hidden=false;pageTitle.textContent='غرفة اللعبة';pageContent.replaceChildren();
 if(onlineLobbyPoll)clearInterval(onlineLobbyPoll);
 loadOnlineLobby().catch(showOnlineLobbyError);
 onlineLobbyPoll=setInterval(()=>loadOnlineLobby().catch(()=>{}),2200);
}

function clearOnlineEndOverlay(){document.querySelector('.online-end-overlay')?.remove();}
async function restartOnlineGame(gameType,gameId){
 const overlay=document.querySelector('.online-end-overlay'),button=overlay?.querySelector('[data-online-restart]');
 if(button){button.disabled=true;button.textContent='جاري تجهيز جولة جديدة...';}
 try{
  const initData=tg?.initData||'';if(!initData)throw new Error('افتح اللعبة من تيليجرام أولًا');
  const response=await fetch('/api/online/restart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,game_type:gameType,game_id:gameId})});
  const data=await response.json().catch(()=>({}));if(!response.ok||!data.ok)throw new Error(data.error||'تعذر إعادة اللعب');
  clearOnlineEndOverlay();
  if(gameType==='connect'){c4Game=data.result;renderConnect4();}
  else{miniGame=data.result.game;renderMiniGame();}
 }catch(e){if(button){button.disabled=false;button.textContent='↻ إعادة اللعب';}const msg=overlay?.querySelector('p');if(msg)msg.textContent=e.message;}
}
async function withdrawOnlineGame(gameType,gameId,button){
  if(button){button.disabled=true;button.textContent='جاري الانسحاب...';}
  try{
   const initData=tg?.initData||'';if(!initData)throw new Error('افتح اللعبة من تيليجرام أولًا');
   const response=await fetch('/api/online/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,game_type:gameType,game_id:gameId})});
   const data=await response.json().catch(()=>({}));if(!response.ok||!data.ok)throw new Error(data.error||'تعذر الانسحاب');

 const scores=shell.querySelector('#word-scores');
 scores.innerHTML=(g.players||[]).map(p=>'<span>'+escapeLobbyText(p.name)+': '+p.score+'</span>').join('');
 const input=shell.querySelector('#word-guess'),submit=shell.querySelector('#word-submit');
 const message=shell.querySelector('#word-message');
 renderWordHistory(shell.querySelector('#word-history'),g.my_guesses||[]);
 shell.querySelector('#word-attempts-left').textContent=g.is_player?'المحاولات المتبقية: '+g.attempts_left+' من '+g.attempts_limit:'';
 if(training){shell.querySelector('#word-round-label').textContent='الكلمة '+(g.current_index+1)+' من '+g.total+' · '+g.my_score+'/'+g.win_target+' كلمة صحيحة';}
 if(g.mode==='online'&&!g.is_player){input.disabled=true;submit.disabled=true;input.placeholder='أنت متفرج — المشاهدة فقط';message.textContent='👀 أنت تشاهد اللعبة فقط';}
 if(finished){
  if(extraPoll)clearTimeout(extraPoll);extraPoll=null;
  input.remove();submit.remove();shell.querySelector('#word-attempts-left').remove();
  message.textContent=training?(g.my_score>=g.win_target?'🏆 فزت على البوت! حققت '+g.my_score+' كلمات صحيحة':'انتهت اللعبة! حققت '+g.my_score+' من '+g.win_target+' كلمات مطلوبة'):(g.winner==='تعادل'?'🤝 انتهت اللعبة بالتعادل':'🏆 الفائز: '+(g.winner||'انتهت اللعبة'));
  shell.querySelector('#word-clock').textContent='انتهت '+g.total+' كلمات';
  const result=document.createElement('div');result.className='c4-result show';result.style.marginTop='12px';result.textContent=(g.players||[]).map(p=>p.name+' — '+p.score+' كلمة').join(' | ');shell.querySelector('#word-end-actions').appendChild(result);
  const back=document.createElement('button');back.className='c4-start';back.textContent='رجوع للألعاب';back.onclick=()=>{stopExtraGame();showGames();};shell.querySelector('#word-end-actions').appendChild(back);
  const homeBtn=document.createElement('button');homeBtn.className='c4-secondary';homeBtn.textContent='القائمة الرئيسية';homeBtn.onclick=()=>{stopExtraGame();showHome();};shell.querySelector('#word-end-actions').appendChild(homeBtn);
  return;
 }
 const myOut=g.attempts_left<=0;
 if(myOut){input.disabled=true;submit.disabled=true;input.placeholder='انتهت محاولاتك لهذه الكلمة';message.textContent=g.mode==='online'?'انتهت محاولاتك، انتظر بقية اللاعبين أو نهاية الوقت':'انتهت محاولاتك';}
 if(g.round_until){
  input.disabled=true;submit.disabled=true;
  if(g.round_end_reason==='timeout')message.textContent='⏰ انتهى وقت الجولة — لم يجب أحد';
  else if(g.round_end_reason==='attempts')message.textContent='انتهت محاولات الجميع';
  else message.textContent='🏆 '+(g.round_winner||'لاعب')+' عرف الكلمة!';
  const revealKey=String(g.current_index)+':'+String(g.round_until);
  if(extraLastRevealKey!==revealKey){
   extraLastRevealKey=revealKey;
   const title=g.round_end_reason==='timeout'?'انتهى وقت الجولة':g.round_end_reason==='attempts'?'انتهت المحاولات':'🎉 '+(g.round_winner||'لاعب')+' عرف الكلمة!';
   showWordReveal(title,g.round_word||'',()=>{},g.last_guess||'',g.last_feedback||[]);
  }
 }
 submit.onclick=async()=>{
  if(extraBusy||input.disabled)return;
  const guessed=input.value.trim();
  if(!guessed)return;
  extraBusy=true;submit.disabled=true;
  try{
   const res=await extraGameRequest('guess','word',{guess:guessed});
   extraGame=res.state||extraGame;
   renderWordGame();
  }catch(e){showExtraError(e);submit.disabled=false;}
  finally{extraBusy=false;}
 };
 shell.querySelector('#word-back')?.remove();
 if(g.round_deadline&&!g.round_until){
  const updateClock=()=>{
   const left=Math.max(0,Math.ceil((g.round_deadline-Date.now())/1000));
   const el=document.getElementById('word-clock');
   if(el)el.textContent='الوقت المتبقي للجولة: '+String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  };
  updateClock();extraElapsedTimer=setInterval(updateClock,500);
 }
 scheduleExtraPoll();
}
function renderWordHistory(root,guesses){
 if(!root)return;root.replaceChildren();
 (guesses||[]).forEach((item,index)=>{
  const number=document.createElement('div');number.className='word-guess-number';number.textContent='المحاولة '+(index+1);
  const row=document.createElement('div');row.className='word-guess-row';
  Array.from(String(item.guess||'')).forEach((ch,i)=>{
   const code=(item.feedback||[])[i]||'white',tile=document.createElement('span');tile.className='word-tile';tile.textContent=ch;
   tile.style.background=({green:'#22c55e',orange:'#f97316',white:'#fff',green_purple:'#22c55e',yellow_purple:'#eab308'}[code]||'#fff');
   if(code.includes('purple'))tile.style.borderColor='#a855f7';
   row.appendChild(tile);
  });
  root.append(number,row);
 });
}
function renderWordTiles(root,guess,feedback){
 if(!root)return;root.replaceChildren();
 Array.from(String(guess||'')).forEach((ch,i)=>{
  const code=(feedback||[])[i]||'white',tile=document.createElement('span');tile.className='word-tile';tile.textContent=ch;
  tile.style.background=({green:'#22c55e',orange:'#f97316',white:'#fff',green_purple:'#22c55e',yellow_purple:'#eab308'}[code]||'#fff');
  if(code.includes('purple'))tile.style.borderColor='#a855f7';
  root.appendChild(tile);
 });
}
function showWordReveal(title,word,done,guess='',feedback=[]){
 const overlay=document.createElement('div');overlay.className='online-end-overlay';overlay.style.zIndex='100001';
 const card=document.createElement('div');card.className='online-end-card';
 card.innerHTML='<h2>'+escapeLobbyText(title)+'</h2><p>الكلمة كانت: <b>'+escapeLobbyText(word)+'</b></p><div id="word-reveal-tiles" style="display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:12px 0"></div><div style="font-size:55px;font-weight:1000" id="word-countdown">3</div>';
 overlay.appendChild(card);renderWordTiles(card.querySelector('#word-reveal-tiles'),guess,feedback);document.body.appendChild(overlay);
 let n=3;const timer=setInterval(()=>{n--;const el=card.querySelector('#word-countdown');if(el)el.textContent=n;if(n<=0){clearInterval(timer);overlay.remove();if(done)done();}},1000);
}
async function advanceWord(){
 if(extraAdvancing)return;
 extraAdvancing=true;
 try{extraGame=await extraGameRequest('next','word');extraLastRevealKey='';renderWordGame();}
 catch(e){showExtraError(e);}
 finally{extraAdvancing=false;}
}
function wordStateKey(g){
 return [g?.status,g?.current_index,g?.round_winner,g?.round_until,g?.round_deadline,
  g?.attempts_left,(g?.my_guesses||[]).map(x=>x.guess+':'+(x.feedback||[]).join(',')).join(';'),
  (g?.players||[]).map(p=>p.id+':'+p.score).join(',')].join('|');
}
function scheduleExtraPoll(){
 if(extraPoll)clearTimeout(extraPoll);
 extraPoll=setTimeout(async()=>{
  try{
   if(extraGameType==='word'&&extraGame){
    const before=wordStateKey(extraGame),next=await extraGameRequest('state','word'),changed=wordStateKey(next)!==before;
    extraGame=next;
    if(next.status==='finished'){if(changed)renderWordGame();extraPoll=null;return;}
    if(next.round_until&&Date.now()>=next.round_until&&next.is_player){await advanceWord();return;}
    if(changed)renderWordGame();
   }
  }catch(e){}
  if(extraGame&&extraGame.status!=='finished')scheduleExtraPoll();
 },1000);
}
function showExtraError(error){const shell=document.getElementById('c4-shell');if(shell){let el=shell.querySelector('.c4-error');if(!el){el=document.createElement('div');el.className='c4-error';shell.appendChild(el);}el.textContent=error?.message||'حدث خطأ';}}
function startC4Timer(){
 stopC4Timer();if(!c4Game||c4Game.status!=='playing')return;
 c4Seconds=15;const started=Number(c4Game.turn_started_at)||Date.now();
 const update=()=>{const left=Math.max(0,15-(Date.now()-started)/1000);const clock=document.getElementById('c4-clock'),bar=document.getElementById('c4-progress');if(clock)clock.textContent=Math.ceil(left)+' ثانية';if(bar)bar.style.width=(left/15*100)+'%';if(left<=0){stopC4Timer();if(c4Game.your_turn){const legal=c4Game.board[0].map((v,i)=>v===0?i:null).filter(v=>v!==null);if(legal.length)submitConnect4Move(legal[Math.floor(Math.random()*legal.length)],true);}else if(c4Game.game_mode==='human'){pollConnect4State();}}};
 update();c4Tick=setInterval(update,200);c4Timer=setTimeout(update,15100);
}
async function submitConnect4Move(col,automatic=false){
 if(c4Busy||!c4Game||c4Game.status!=='playing'||!c4Game.your_turn)return;
 const previousBoard=c4Game.board.map(row=>row.slice());c4Busy=true;stopC4Timer();
 document.querySelectorAll('.c4-slot,.c4-arrow').forEach(x=>x.disabled=true);
 const status=document.getElementById('c4-status');if(status)status.textContent=automatic?'انتهى الوقت! اخترنا لك حركة عشوائية':'جاري إسقاط القرص...';
 try{c4Game=await c4Request('/api/connect4/move',{game_id:c4Game.id,column:col});c4Busy=false;renderConnect4(previousBoard);}
 catch(e){c4Busy=false;const s=document.getElementById('c4-status');if(s)s.textContent=e.message;startC4Timer();pollConnect4State();}
}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{
 const a=b.dataset.action;
 if(a==='help'){openBot('help');return;}
 if(a==='games'){
  try{showGames();}
  catch(err){
   console.error('Open games failed:',err);
   home.hidden=true;page.hidden=false;pageTitle.textContent='الألعاب 🎮';pageContent.replaceChildren();
   const e=document.createElement('div');e.className='empty';e.textContent='تعذر فتح قائمة الألعاب: '+(err?.message||'خطأ غير معروف');pageContent.appendChild(e);
  }
  return;
 }
 if(a==='game-stats'){showTop('games','🏆 توب الألعاب');return;}
 const names={points:'توب النقاط',active:'توب المتفاعلين العام',robbers:'توب الحرامية'};
 showTop(a,names[a]||'التوب');
});
document.getElementById('back-home').onclick=showHome;
(async()=>{
 try{
  const r=await fetch('/api/mini-app');const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||('HTTP '+r.status));botUsername=data.bot_username||'';onlineGameImages=data.online_game_images||{};applyMiniAppButtonColors(data.button_colors||{});
  if(data.banner){const im=document.getElementById('banner');im.src=data.banner;im.style.display='block';}
  const root=document.getElementById('custom');
  for(const b of data.buttons||[]){
   const a=document.createElement('a');a.className='custom-card'+(b.type==='large'?' large':'');a.href=b.target;a.target='_blank';a.rel='noopener';a.style.background=b.color||'#fff';
   if(b.type==='large'){if(b.image){const im=document.createElement('img');im.className='large-image';im.src=b.image;a.appendChild(im);}const name=document.createElement('span');name.className='label';name.textContent=b.title;a.appendChild(name);}
   else{if(b.image){const im=document.createElement('img');im.className='thumb';im.src=b.image;a.appendChild(im);}const name=document.createElement('span');name.className='label';name.textContent=b.title;a.appendChild(name);const dots=document.createElement('span');dots.className='dots';dots.textContent='⋮';a.appendChild(dots);}
   root.appendChild(a);
  }
  if(extraGameType&&extraGameId){
    home.hidden=true;page.hidden=false;pageTitle.textContent='خمن الكلمة';
    extraGame=await extraGameRequest('join','word');if(extraGame.status==='waiting')renderWordLobby();else renderWordGame();
  }
  else if(onlineLobbyId){startOnlineLobby();}
  else if(miniGameChallengeIdFromStart){home.hidden=true;page.hidden=false;pageTitle.textContent='الألعاب';startMiniGameChallenge();}
  else if(c4ChallengeIdFromStart){home.hidden=true;page.hidden=false;pageTitle.textContent='كونكت 4';startConnect4Challenge();}
  else if(c4GameIdFromUrl){home.hidden=true;page.hidden=false;pageTitle.textContent='كونكت 4';startConnect4();}
 }catch(e){console.error('Mini App extensions load failed:',e);const box=document.createElement('div');box.className='empty';box.textContent='تعذر تحميل الإضافات: '+(e?.message||'خطأ غير معروف');document.getElementById('custom').replaceChildren(box);}
})();
</script></body></html>
