<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#570909">
<title>بوت نواف</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--red:#9e1018;--muted:rgba(255,255,255,.58)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#a20e18 0%,#650a10 40%,#16090b 100%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 15px 34px}
.wrap{max-width:620px;margin:auto}.hero{width:100%;height:220px;overflow:hidden;border-radius:0 0 22px 22px;background:linear-gradient(140deg,#b20e1b,#21090d);box-shadow:0 12px 32px #0006}.hero img{width:100%;height:100%;object-fit:cover;display:none}
.brand{text-align:center;margin:17px 0 22px;color:rgba(255,255,255,.48);font-size:13px;letter-spacing:1.5px;font-weight:600}
.section-title{font-size:14px;color:#ffffffb8;margin:20px 4px 10px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{border:1px solid #fff;border-radius:14px;background:#fff;color:#1a1111;min-height:58px;font-size:15px;font-weight:750;box-shadow:0 4px 0 #260609;cursor:pointer}
.menu button:first-child{grid-column:span 2}
.custom{display:grid;gap:12px}.custom-card{position:relative;display:flex;align-items:center;gap:12px;padding:10px 13px;border:1px solid #171010;border-radius:16px;background:#fff;color:#171010;box-shadow:0 5px 0 #160608;min-height:74px;text-decoration:none;overflow:hidden}
.custom-card .thumb{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#eee;flex:none}.custom-card .label{font-weight:750;flex:1;text-align:center;font-size:15px;overflow-wrap:anywhere}.dots{font-size:22px;color:#777;line-height:1}
.custom-card.large{display:block;padding:0 0 13px;text-align:center}.custom-card.large .large-image{width:100%;height:185px;object-fit:cover;display:block;background:#eee}.custom-card.large .label{display:block;padding:12px 12px 0;font-size:17px}
.empty{color:#ffffffbb;text-align:center;font-size:13px;padding:12px}.back-button{width:100%;margin-top:14px;border:1px solid #fff;border-radius:14px;background:#fff;color:#1a1111;min-height:52px;font-size:15px;font-weight:750;box-shadow:0 4px 0 #260609;cursor:pointer}#page-content .custom-card{min-height:58px}

/* Chess Mini App */
body.chess-mode{background:#bdeeff;color:#102d3a;padding:0 10px 18px}
body.chess-mode .hero,body.chess-mode .brand{display:none}
.chess-wrap{position:relative;max-width:560px;margin:0 auto;padding:12px 0 18px}
.chess-decor{position:absolute;inset:0;pointer-events:none;overflow:hidden;color:#fff}
.chess-decor span{position:absolute;opacity:.8;text-shadow:0 1px 4px #fff}
.chess-panel{position:relative;z-index:1}
.chess-turn{background:#101010;color:#fff;border-radius:15px;text-align:center;padding:10px 12px;margin:0 auto 12px;box-shadow:0 4px 0 #0003}
.chess-turn small{display:block;font-size:12px;opacity:.8}
.chess-turn strong{display:block;font-size:19px;margin-top:2px}
.chess-board{width:min(94vw,500px);aspect-ratio:1;margin:auto;display:grid;position:relative;grid-template-columns:repeat(8,1fr);border:5px solid #573c2a;border-radius:5px;overflow:hidden;box-shadow:0 12px 28px #234b5c55;direction:ltr;touch-action:manipulation}
.chess-square{border:0;border-radius:0;display:grid;place-items:center;padding:0;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;aspect-ratio:1/1;font-size:clamp(22px,10vw,49px);line-height:1;cursor:pointer;position:relative;isolation:isolate;transition:background-color .16s ease,box-shadow .16s ease}
.chess-square.light{background:#f0d9b5;color:#171717}.chess-square.dark{background:#b58863;color:#171717}
.chess-piece{display:grid;place-items:center;width:100%;height:100%;font-family:'DejaVu Sans','Segoe UI Symbol',serif;font-variant-emoji:text;line-height:1;transform:translateY(-1px);user-select:none;pointer-events:none;transition:transform .18s ease,filter .18s ease}
.chess-piece.white-piece{color:#fff!important;-webkit-text-fill-color:#fff!important;-webkit-text-stroke:1.15px #343434;text-shadow:0 2px 1px #0008,0 0 3px #0008;filter:drop-shadow(0 2px 1px #0006)}
.chess-piece.black-piece{color:#171717!important;-webkit-text-fill-color:#171717!important;-webkit-text-stroke:.65px #f6f0e6;text-shadow:0 1px 1px #fff8;filter:drop-shadow(0 2px 1px #0005)}
.chess-square.selected{z-index:2;box-shadow:inset 0 0 0 4px #21a9e9, inset 0 0 18px #21a9e966}
.chess-square.target:after{content:"";position:absolute;inset:19%;border:3px solid #087eaa;border-radius:50%;box-shadow:0 0 0 3px #fff9,0 0 12px #087eaa88;pointer-events:none}
.chess-square.target:not(.occupied):before{content:"✦";position:absolute;font-size:clamp(15px,4vw,23px);color:#087eaa;text-shadow:0 1px 3px #fff;z-index:1}
.chess-square.capture-target:after{inset:7%;border:4px solid #d84c39;box-shadow:0 0 0 3px #fff9,0 0 14px #d84c3988}
.chess-move-flash{animation:chessMoveFlash .48s ease-out}
@keyframes chessMoveFlash{0%{box-shadow:inset 0 0 0 5px #1ba6dc, inset 0 0 24px #1ba6dc99}100%{box-shadow:inset 0 0 0 0 transparent}}
.chess-controls{display:flex;gap:8px;margin:12px auto;max-width:500px}
.chess-controls button,.chess-option{flex:1;border:0;border-radius:12px;padding:12px 8px;background:#111;color:#fff;font-weight:750}
.chess-option{background:#fff;color:#173746;border:2px solid #d5edf5}
.chess-option.active{background:#153746;color:#fff;border-color:#153746}
.chess-setup{display:grid;gap:12px;max-width:500px;margin:0 auto}
.chess-setup h3{margin:8px 0 0;color:#123545}
.chess-options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chess-status{text-align:center;font-weight:700;color:#123545;margin:10px}
.chess-back{background:#fff;color:#122f3c;border:1px solid #123545;box-shadow:none}

</style></head>
<body><main class="wrap">
<div class="hero"><img id="banner" alt=""></div>
<div class="brand">Dev bot ~ نواف</div>
<div id="home">
<div class="section-title">القوائم</div>
<div class="menu">
<button data-action="points">توب النقاط</button><button data-action="active">توب المتفاعلين العام</button>
<button data-action="robbers">توب الحرامية</button><button data-action="games">الألعاب</button>
<button data-action="help">الأوامر</button>
</div>
<div class="section-title">إضافات</div><div class="custom" id="custom"></div>
</div>
<section id="page" hidden><div class="section-title" id="page-title"></div><div class="custom" id="page-content"></div><button id="back-home" class="back-button">↩ رجوع للقائمة الرئيسية</button></section>
</main>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
let botUsername='';
const home=document.getElementById('home');
const page=document.getElementById('page');
const pageTitle=document.getElementById('page-title');
const pageContent=document.getElementById('page-content');
function showHome(){document.body.classList.remove('chess-mode');page.hidden=true;home.hidden=false;}
function openBot(startParam=''){if(!botUsername)return;const link='https://t.me/'+botUsername+(startParam?'?start='+encodeURIComponent(startParam):'');if(tg?.openTelegramLink)tg.openTelegramLink(link);else location.href=link;}
function showTop(kind,title){
 home.hidden=true;page.hidden=false;pageTitle.textContent=title;pageContent.replaceChildren();
 const loading=document.createElement('div');loading.className='empty';loading.textContent='جاري تحميل الترتيب...';pageContent.appendChild(loading);
 fetch('/api/mini-app?top='+encodeURIComponent(kind)).then(async r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(data=>{
  pageContent.replaceChildren();
  if(!Array.isArray(data.leaderboard))throw new Error('No leaderboard data');
  if(!data.leaderboard.length){const e=document.createElement('div');e.className='empty';e.textContent='لا يوجد ترتيب حتى الآن';pageContent.appendChild(e);return;}
  data.leaderboard.forEach((item,i)=>{const row=document.createElement('div');row.className='custom-card';const name=document.createElement('span');name.className='label';name.textContent=(i+1)+'  •  '+item.name+'  —  '+(kind==='active'?'( رسالة '+item.value+' )':item.value+' '+item.unit);row.appendChild(name);pageContent.appendChild(row);});
 }).catch(()=>{pageContent.replaceChildren();const e=document.createElement('div');e.className='empty';e.textContent='تعذر تحميل الترتيب حاليًا، حاول مرة ثانية';pageContent.appendChild(e);});
}

let chessBotName='البوت', chessGame=null, chessSelected=null, chessDifficulty='متوسط', chessClock=0, chessBoardEl=null, chessSquareEls={};
function showGames(){
 document.body.classList.add('chess-mode');home.hidden=true;page.hidden=false;
 pageTitle.textContent='الألعاب 🎮';pageContent.replaceChildren();
 const card=document.createElement('button');card.className='back-button';card.textContent='♟️ الشطرنج';
 card.onclick=showChessSetup;pageContent.appendChild(card);
}
function chessDecor(){
 const d=document.createElement('div');d.className='chess-decor';
 d.innerHTML='<span style="top:5%;left:7%;font-size:28px">☁</span><span style="top:18%;right:5%;font-size:15px">✦</span><span style="top:42%;left:2%;font-size:20px">✧</span><span style="bottom:16%;right:5%;font-size:25px">☁</span><span style="bottom:4%;left:18%;font-size:18px">✦</span>';
 return d;
}
function showChessSetup(){
 document.body.classList.add('chess-mode');home.hidden=true;page.hidden=false;pageTitle.textContent='الشطرنج ♟️';pageContent.replaceChildren();
 const wrap=document.createElement('div');wrap.className='chess-wrap';wrap.appendChild(chessDecor());
 const panel=document.createElement('div');panel.className='chess-panel chess-setup';
 panel.innerHTML='<h3>اختر مستوى اللعب</h3><div class="chess-options" id="chess-difficulties"></div><h3>وقت المباراة</h3><div class="chess-options" id="chess-clocks"></div><button class="back-button" id="chess-start">ابدأ اللعب ♟</button>';
 wrap.appendChild(panel);pageContent.appendChild(wrap);
 const diffs=['سهل','متوسط','صعب','مستحيل'];
 const droot=panel.querySelector('#chess-difficulties');
 diffs.forEach(v=>{const b=document.createElement('button');b.className='chess-option'+(v===chessDifficulty?' active':'');b.textContent=v;b.onclick=()=>{chessDifficulty=v;droot.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));};droot.appendChild(b);});
 const clocks=panel.querySelector('#chess-clocks');
 [[0,'بدون وقت'],[600,'10 دقائق لكل لاعب']].forEach(([v,label])=>{const b=document.createElement('button');b.className='chess-option'+(v===chessClock?' active':'');b.textContent=label;b.onclick=()=>{chessClock=v;clocks.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));};clocks.appendChild(b);});
 panel.querySelector('#chess-start').onclick=startChessGame;
}
async function chessRequest(path,data){
 const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,initData:tg?.initData||''})});
 const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'تعذر تنفيذ الطلب');return result.game;
}
async function startChessGame(){
 const start=document.getElementById('chess-start');if(start){start.disabled=true;start.textContent='جاري تجهيز المباراة...';}
 try{chessGame=await chessRequest('/api/chess/new',{difficulty:chessDifficulty,clock:chessClock});chessSelected=null;renderChessGame();}
 catch(e){alert(e.message);if(start){start.disabled=false;start.textContent='ابدأ اللعب ♟';}}
}
const chessPieces={'K':'♔','Q':'♕','R':'♖','B':'♗','N':'♘','P':'♙','k':'♚','q':'♛','r':'♜','b':'♝','n':'♞','p':'♟'};
function renderChessGame(){
 pageContent.replaceChildren();chessSquareEls={};const wrap=document.createElement('div');wrap.className='chess-wrap';wrap.appendChild(chessDecor());
 const panel=document.createElement('div');panel.className='chess-panel';
 const turn=document.createElement('div');turn.className='chess-turn';
 const label=document.createElement('small');label.textContent='دور اللاعب';
 const name=document.createElement('strong');name.textContent=chessGame.turn_name||chessBotName;
 turn.append(label,name);panel.appendChild(turn);
 chessBoardEl=document.createElement('div');chessBoardEl.className='chess-board';
 for(let r=0;r<8;r++)for(let f=0;f<8;f++){
  const coord=String.fromCharCode(97+f)+(8-r),sq=document.createElement('button');
  sq.type='button';sq.className='chess-square '+((r+f)%2?'dark':'light');sq.dataset.square=coord;
  sq.onclick=()=>selectChessSquare(coord,chessPieceAt(chessGame.fen,coord));chessSquareEls[coord]=sq;chessBoardEl.appendChild(sq);
 }
 panel.appendChild(chessBoardEl);
 refreshChessBoard();
 const status=document.createElement('div');status.className='chess-status';status.id='chess-status';
 status.textContent=chessGame.status==='finished'?(chessGame.result==='draw'?'انتهت المباراة بالتعادل':chessGame.result==='white'?'فزت بالمباراة!':'فاز '+chessBotName):'اختر قطعة ثم اختر المربع الذي تريد الانتقال إليه';
 panel.appendChild(status);
 const controls=document.createElement('div');controls.className='chess-controls';
 const resign=document.createElement('button');resign.textContent='استسلام';resign.onclick=()=>{if(confirm('هل تريد الاستسلام؟')){alert('سيتم تفعيل الاستسلام مع نظام المباريات الكامل.');}};controls.appendChild(resign);
 const back=document.createElement('button');back.className='chess-back';back.textContent='رجوع للألعاب';back.onclick=showGames;controls.appendChild(back);
 panel.appendChild(controls);wrap.appendChild(panel);pageContent.appendChild(wrap);
}
function chessPieceAt(fen,coord){
 const [files,rank]=[fen.split(' ')[0].split('/'),8-Number(coord[1])];let file=0;
 for(const ch of files[rank]){if(/[1-8]/.test(ch))file+=Number(ch);else{if(file==="abcdefgh".indexOf(coord[0]))return ch;file++;}}
 return null;
}
function refreshChessBoard(){
 if(!chessBoardEl||!chessGame)return;
 const legal=chessGame.legal_moves||[];
 for(const [coord,sq] of Object.entries(chessSquareEls)){
  const piece=chessPieceAt(chessGame.fen,coord);
  sq.replaceChildren();sq.classList.toggle('selected',chessSelected===coord);
  sq.classList.toggle('occupied',!!piece);
  const isTarget=!!chessSelected&&legal.some(m=>m.startsWith(chessSelected+coord));
  sq.classList.toggle('target',isTarget);
  sq.classList.toggle('capture-target',isTarget&&!!piece);
  if(piece){const span=document.createElement('span');span.className='chess-piece '+(piece===piece.toUpperCase()?'white-piece':'black-piece');span.textContent=(chessPieces[piece]||'')+'\uFE0E';sq.appendChild(span);}
 }
}
async function animateChessMove(from,to,piece,commitVisual=false){
 if(!chessBoardEl||!piece)return;
 const source=chessSquareEls[from],dest=chessSquareEls[to],boardRect=chessBoardEl.getBoundingClientRect();
 if(!source||!dest)return;
 const sourceRect=source.getBoundingClientRect(),destRect=dest.getBoundingClientRect();
 const moving=document.createElement('span');
 moving.className='chess-piece '+(piece===piece.toUpperCase()?'white-piece':'black-piece');
 moving.textContent=(chessPieces[piece]||'')+'\uFE0E';moving.style.cssText='position:absolute;z-index:30;display:grid;place-items:center;width:12.5%;height:12.5%;font-size:clamp(27px,8vw,53px);left:'+(sourceRect.left-boardRect.left)+'px;top:'+(sourceRect.top-boardRect.top)+'px;transition:transform .34s cubic-bezier(.2,.8,.2,1);';
 const sourcePiece=source.querySelector('.chess-piece'),destPiece=dest.querySelector('.chess-piece');
 if(sourcePiece)sourcePiece.style.visibility='hidden';if(destPiece)destPiece.style.visibility='hidden';
 chessBoardEl.appendChild(moving);
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 moving.style.transform='translate('+(destRect.left-sourceRect.left)+'px,'+(destRect.top-sourceRect.top)+'px)';
 await new Promise(resolve=>setTimeout(resolve,370));
 moving.remove();
 if(commitVisual){
  source.replaceChildren();dest.replaceChildren();
  const landed=document.createElement('span');landed.className='chess-piece '+(piece===piece.toUpperCase()?'white-piece':'black-piece');landed.textContent=(chessPieces[piece]||'')+'\uFE0E';dest.appendChild(landed);
 }else{
  if(sourcePiece)sourcePiece.style.visibility='';if(destPiece)destPiece.style.visibility='';
 }
}
function selectChessSquare(square,piece){
 if(!chessGame||chessGame.status!=='active')return;
 const legal=chessGame.legal_moves||[];
 if(chessSelected){
  const matches=legal.filter(m=>m.startsWith(chessSelected+square));
  if(matches.length){const move=matches.find(m=>m.length===5&&m.endsWith('q'))||matches[0];submitChessMove(move);return;}
 }
 if(piece&&piece===piece.toUpperCase()){chessSelected=square;refreshChessBoard();return;}
 chessSelected=null;refreshChessBoard();
}
async function submitChessMove(move){
 const from=move.slice(0,2),to=move.slice(2,4),movingPiece=chessPieceAt(chessGame.fen,from);
 chessSelected=null;refreshChessBoard();
 try{
  await animateChessMove(from,to,movingPiece,true);
  const turnName=document.querySelector('.chess-turn strong');if(turnName)turnName.textContent=chessBotName;
  const status=document.getElementById('chess-status');if(status)status.textContent='يفكر '+chessBotName+'...';
  const response=await chessRequest('/api/chess/move',{game_id:chessGame.id,move});
  if(response.ai_move&&response.after_player_fen){
   const finalFen=response.fen;
   chessGame={...response,fen:response.after_player_fen,turn_name:chessBotName,legal_moves:[]};
   refreshChessBoard();
   const reply=response.ai_move,replyFrom=reply.slice(0,2),replyTo=reply.slice(2,4);
   await animateChessMove(replyFrom,replyTo,chessPieceAt(response.after_player_fen,replyFrom),true);
   chessGame={...response,fen:finalFen};refreshChessBoard();
  }else{chessGame=response;refreshChessBoard();}
  const activeName=chessGame.turn_name||chessBotName;
  const nameEl=document.querySelector('.chess-turn strong');if(nameEl)nameEl.textContent=activeName;
  const finalStatus=document.getElementById('chess-status');
  if(finalStatus)finalStatus.textContent=chessGame.status==='finished'?(chessGame.result==='draw'?'انتهت المباراة بالتعادل':chessGame.result==='white'?'فزت بالمباراة!':'فاز '+chessBotName):'دور '+activeName+' · اختر القطعة التالية';
 }catch(e){alert(e.message);refreshChessBoard();}
}

document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{
 const a=b.dataset.action;
 if(a==='help'){openBot('help');return;}
 if(a==='games'){showGames();return;}
 const names={points:'توب النقاط',active:'توب المتفاعلين العام',robbers:'توب الحرامية'};
 showTop(a,names[a]||'التوب');
});
document.getElementById('back-home').onclick=showHome;
(async()=>{
 try{
  const r=await fetch('/api/mini-app');if(!r.ok)throw new Error('API');
  const data=await r.json();botUsername=data.bot_username||'';chessBotName=data.bot_name||botUsername||'البوت';
  if(data.banner){const im=document.getElementById('banner');im.src=data.banner;im.style.display='block';}
  const root=document.getElementById('custom');
  for(const b of data.buttons||[]){
   const a=document.createElement('a');a.className='custom-card'+(b.type==='large'?' large':'');a.href=b.target;a.target='_blank';a.rel='noopener';a.style.background=b.color||'#fff';
   if(b.type==='large'){if(b.image){const im=document.createElement('img');im.className='large-image';im.src=b.image;a.appendChild(im);}const name=document.createElement('span');name.className='label';name.textContent=b.title;a.appendChild(name);}
   else{if(b.image){const im=document.createElement('img');im.className='thumb';im.src=b.image;a.appendChild(im);}const name=document.createElement('span');name.className='label';name.textContent=b.title;a.appendChild(name);const dots=document.createElement('span');dots.className='dots';dots.textContent='⋮';a.appendChild(dots);}
   root.appendChild(a);
  }
 }catch(e){document.getElementById('custom').innerHTML='<div class="empty">تعذر تحميل الإضافات حاليًا</div>';}
})();
</script></body></html>
