<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>بولينق</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030b18;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
body{background:radial-gradient(ellipse at 50% 40%,#123b69 0,#07182d 48%,#020711 100%)}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);max-width:620px;margin:auto}
header{height:58px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
header button,.action{border:1px solid #398ad9;background:#0b2543;color:#eaf6ff;border-radius:13px;padding:9px 13px;font-weight:800}
h1{font-size:21px;margin:0;color:#d9f1ff;text-shadow:0 0 18px #168fff}
#score{display:flex;gap:7px;justify-content:center;flex-shrink:0;margin:4px 0 7px}.players{display:flex;gap:7px;overflow-x:auto;flex-shrink:0;padding:0 1px 7px;scrollbar-width:none}.player-chip{display:flex;align-items:center;gap:6px;min-width:0;flex:1;background:#0a1e35;border:1px solid #1d5b91;border-radius:12px;padding:5px 7px}.player-chip.active{border-color:#67d1ff;box-shadow:0 0 12px #16aaff55}.player-chip img{width:27px;height:27px;border-radius:50%;object-fit:cover;background:#163b5e}.player-chip span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-chip b{display:block;font-size:12px;color:#dff4ff}
.scorebox{background:#0a1e35;border:1px solid #1d5b91;border-radius:12px;padding:7px 12px;text-align:center;min-width:70px}
.scorebox small{display:block;color:#8fc8f6;font-size:11px}.scorebox b{font-size:18px}
#lane-wrap{position:relative;flex:1;min-height:0;border:1px solid #2678b9;border-radius:24px;overflow:hidden;box-shadow:0 0 35px #087bdf44,inset 0 0 40px #0b5ba733;background:#061a31}
canvas{display:block;width:100%;height:100%}
#hint{text-align:center;color:#b7dfff;font-size:13px;padding:11px 4px 4px;min-height:36px}
#bottom{display:flex;gap:9px;padding:5px 0 10px;justify-content:center;flex-shrink:0}
#bottom button{flex:1;max-width:190px;padding:12px}
#result{position:absolute;inset:0;background:#020a15dd;backdrop-filter:blur(9px);display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
#result .panel{width:100%;max-width:340px;background:linear-gradient(145deg,#123b63,#07182d);border:1px solid #53b6ff;border-radius:24px;padding:25px;box-shadow:0 0 45px #138cff55}
#result h2{font-size:28px;margin:0 0 10px}#result p{color:#c4e6ff}
</style></head>
<body><main id="app">
<header><button id="back">رجوع</button><h1>بولينق 🎳</h1><button id="reset">إعادة</button></header>
<section id="score"><div class="scorebox"><small>الجولة</small><b id="frame">1 / 10</b></div><div class="scorebox"><small>إسقاطك</small><b id="fallen">0 / 10</b></div><div class="scorebox"><small>النقاط</small><b id="points">0</b></div><div class="scorebox"><small>الدور</small><b id="current-player">أنت</b></div></section><div id="players" class="players" hidden></div>
<div id="lane-wrap"><canvas id="game"></canvas><div id="result"><div class="panel"><h2 id="result-title">رميّة رائعة!</h2><p id="result-text"></p><button class="action" id="again">العب مرة ثانية</button></div></div></div>
<div id="hint">اسحب من الكرة للأعلى، وحرّك إصبعك يمينًا أو يسارًا لتحديد الاتجاه</div>
<div id="bottom"><button class="action" id="throw">تسديد</button><button class="action" id="next">الجولة التالية</button></div>
</main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),wrap=document.getElementById('lane-wrap');
const $=id=>document.getElementById(id);let W=0,H=0,dpr=1,ball,pins=[],drag=null,anim=0,frame=1,total=0,shots=0,settle=0,locked=false,score=0,rolls=[],frameRolls=[],standing=10;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const tg=window.Telegram?.WebApp;tg?.ready?.();
const onlineParams=new URLSearchParams(location.search),onlineGameId=onlineParams.get('game_id')||'',onlineMode=onlineParams.get('online')==='1';
let onlineState=null,onlinePoll=null,lastOnlineTurn=null;
const M=window.Matter||null;let physicsEngine=null,physicsWorld=null,ballBody=null;
if(M){physicsEngine=M.Engine.create();physicsWorld=physicsEngine.world;physicsEngine.gravity.y=.13;physicsEngine.positionIterations=8;physicsEngine.velocityIterations=6;M.Events.on(physicsEngine,'collisionStart',event=>{if(!ballBody)return;for(const pair of event.pairs){const other=pair.bodyA===ballBody?pair.bodyB:pair.bodyB===ballBody?pair.bodyA:null;if(!other)continue;const pin=pins.find(item=>item.body===other);if(pin&&!pin.fallen){pin.fallen=true;M.Body.setStatic(other,false);M.Body.setVelocity(other,{x:ballBody.velocity.x*.42+(Math.random()-.5)*1.5,y:Math.abs(ballBody.velocity.y)*.28+1.2});M.Body.setAngularVelocity(other,(Math.random()-.5)*.24);}}});}
function resize(){const r=wrap.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function lane(){const top=H*.12,bottom=H*.91,cx=W/2,topW=W*.30,botW=W*.78;ctx.save();ctx.beginPath();ctx.moveTo(cx-topW/2,top);ctx.lineTo(cx+topW/2,top);ctx.lineTo(cx+botW/2,bottom);ctx.lineTo(cx-botW/2,bottom);ctx.closePath();let g=ctx.createLinearGradient(0,top,0,bottom);g.addColorStop(0,'#a8dfff');g.addColorStop(.35,'#438fc4');g.addColorStop(1,'#174b78');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#5cc7ff';ctx.lineWidth=2;ctx.stroke();
for(let i=-3;i<=3;i++){let x1=cx+i*topW/7,x2=cx+i*botW/7;ctx.strokeStyle='rgba(210,240,255,.17)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1,top);ctx.lineTo(x2,bottom);ctx.stroke()}
ctx.strokeStyle='#a8e7ff88';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-topW*.42,top+H*.05);ctx.lineTo(cx-botW*.43,bottom-H*.02);ctx.moveTo(cx+topW*.42,top+H*.05);ctx.lineTo(cx+botW*.43,bottom-H*.02);ctx.stroke();
ctx.fillStyle='#64caff';ctx.shadowColor='#1aa7ff';ctx.shadowBlur=18;ctx.fillRect(cx-topW*.48,top-5,topW*.96,4);ctx.restore()}
function pinShape(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=p.alpha;ctx.shadowColor='#9bdcff';ctx.shadowBlur=9;let s=p.s;ctx.fillStyle='#f5fbff';ctx.beginPath();ctx.moveTo(-s*.28,s*.48);ctx.quadraticCurveTo(-s*.42,s*.08,-s*.18,-s*.13);ctx.quadraticCurveTo(-s*.28,-s*.55,0,-s*.58);ctx.quadraticCurveTo(s*.28,-s*.55,s*.18,-s*.13);ctx.quadraticCurveTo(s*.42,s*.08,s*.28,s*.48);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#e33d59';ctx.lineWidth=Math.max(2,s*.12);ctx.beginPath();ctx.moveTo(-s*.18,-s*.15);ctx.lineTo(s*.18,-s*.15);ctx.stroke();ctx.fillStyle='#d8efff';ctx.beginPath();ctx.ellipse(0,s*.45,s*.3,s*.1,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function ballShape(){if(!ball)return;ctx.save();ctx.shadowColor='#26baff';ctx.shadowBlur=24;let g=ctx.createRadialGradient(ball.x-ball.r*.35,ball.y-ball.r*.4,2,ball.x,ball.y,ball.r);g.addColorStop(0,'#f0fbff');g.addColorStop(.22,'#46c8ff');g.addColorStop(.65,'#0872d1');g.addColorStop(1,'#032b66');ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#dff7ff';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(ball.x+Math.cos(i*2.1)*ball.r*.3,ball.y+Math.sin(i*2.1)*ball.r*.3,ball.r*.09,0,Math.PI*2);ctx.fill()}ctx.restore()}
function addWall(x1,y1,x2,y2,thickness=9){const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),body=M.Bodies.rectangle((x1+x2)/2,(y1+y2)/2,len,thickness,{isStatic:true,angle:Math.atan2(dy,dx),friction:.2});M.Composite.add(physicsWorld,body)}
function setupPins(){pins=[];ballBody=null;if(M){M.Composite.clear(physicsWorld,false);const cx=W/2,top=H*.12,bottom=H*.91,topW=W*.30,botW=W*.78;addWall(cx-topW/2,top,cx-botW/2,bottom);addWall(cx+topW/2,top,cx+botW/2,bottom);addWall(cx-topW/2,top,cx+topW/2,top,7)}const cx=W/2,top=H*.19,step=Math.min(W*.075,H*.045),bodies=[];for(let row=0;row<4;row++)for(let col=0;col<=row;col++){let x=cx+(col-row/2)*step*1.65,y=top+row*step*1.25,s=Math.max(13,step*.75),pin={x,y,vx:0,vy:0,a:0,av:0,s,fallen:false,alpha:1,body:null};if(M){pin.body=M.Bodies.rectangle(x,y,s*.48,s*1.08,{isStatic:true,restitution:.12,friction:.32,frictionAir:.075,density:.001,chamfer:{radius:s*.18}});bodies.push(pin.body)}pins.push(pin)}if(M&&bodies.length)M.Composite.add(physicsWorld,bodies);resetBall()}
function resetShot(){setupPins();drag=null;locked=false;settle=0;standing=10;frameRolls=[];$('hint').textContent='اسحب من الكرة للأعلى، وحرّك إصبعك يمينًا أو يسارًا لتحديد الاتجاه';update()}
function update(){
 $('frame').textContent=frame+' / 10';$('fallen').textContent=(10-standing)+' / 10';$('points').textContent=score;
 const bar=$('players');
 if(onlineState){
  bar.hidden=false;bar.replaceChildren();
  onlineState.players.forEach((p,i)=>{
   const chip=document.createElement('div');chip.className='player-chip'+(i===onlineState.turn_index?' active':'');
   const avatar=document.createElement('img');avatar.src='/number-sort/avatar/'+Number(p.id||0);avatar.alt='';avatar.onerror=()=>{avatar.remove()};
   const info=document.createElement('span'),name=document.createElement('b'),points=document.createElement('span');
   name.textContent=p.name||'لاعب';points.textContent=(onlineState.scores?.[i]||0)+' نقطة';
   info.append(name,points);chip.append(avatar,info);bar.append(chip);
  });
  const p=onlineState.players?.[onlineState.turn_index];$('current-player').textContent=p?.name||'—';
 }else bar.hidden=true;
}
function scoringTotal(){let i=0,sum=0;for(let f=0;f<10;f++){if(i>=rolls.length)break;let a=rolls[i];if(a===10){sum+=10+(rolls[i+1]??0)+(rolls[i+2]??0);i++;}else if(i+1<rolls.length&&a+rolls[i+1]===10){sum+=10+(rolls[i+2]??0);i+=2;}else{sum+=a+(rolls[i+1]??0);i+=2;}}return sum}
function resetBall(){if(M&&ballBody){M.Composite.remove(physicsWorld,ballBody);ballBody=null;}ball={x:W/2,y:H*.83,vx:0,vy:0,r:Math.max(17,Math.min(W,H)*.035)}}
function freshRack(){setupPins();standing=10}
function draw(){if(!W||!H)return;ctx.clearRect(0,0,W,H);lane();pins.forEach(pinShape);ballShape();if(drag){ctx.strokeStyle='#b9ecff55';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r+7,0,Math.PI*2);ctx.stroke()}}
function launch(){if(locked||!drag)return;let dx=drag.x-ball.x,dy=ball.y-drag.y;let power=clamp(Math.hypot(dx,dy),12,Math.min(H*.42,180));let angle=clamp(dx/Math.max(55,power),-.48,.48);let speed=7+power*.075;ball.vx=Math.sin(angle)*speed;ball.vy=-Math.cos(angle)*speed;if(M){ballBody=M.Bodies.circle(ball.x,ball.y,ball.r,{restitution:.18,friction:.025,frictionAir:.012,density:.02});M.Composite.add(physicsWorld,ballBody);M.Body.setVelocity(ballBody,{x:ball.vx,y:ball.vy});}locked=true;drag=null;$('hint').textContent='الكرة في طريقها إلى القوارير...';animate()}
function animate(){if(!M||!ballBody){animateFallback();return;}cancelAnimationFrame(anim);let quiet=0;function step(){M.Engine.update(physicsEngine,1000/60);ball.x=ballBody.position.x;ball.y=ballBody.position.y;ball.vx=ballBody.velocity.x;ball.vy=ballBody.velocity.y;let moving=Math.hypot(ball.vx,ball.vy)>.18;pins.forEach(p=>{if(!p.body)return;p.x=p.body.position.x;p.y=p.body.position.y;p.a=p.body.angle;if(!p.body.isStatic){p.fallen=true;if(Math.hypot(p.body.velocity.x,p.body.velocity.y)>.16||Math.abs(p.body.angularVelocity)>.02)moving=true;}});draw();if(moving&&quiet<360){quiet=0;anim=requestAnimationFrame(step);}else{if(ballBody){M.Composite.remove(physicsWorld,ballBody);ballBody=null;}finishShot();}}step()}
function animateFallback(){cancelAnimationFrame(anim);function step(){let moving=false;ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.992;ball.vy*=.992;pins.forEach(p=>{if(p.fallen){p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy*=.985;p.a+=p.av;p.av*=.98;if(p.y>H*.96||p.x<-30||p.x>W+30)p.alpha=Math.max(0,p.alpha-.04);if(Math.hypot(p.vx,p.vy)>.15)moving=true;return}let d=Math.hypot(ball.x-p.x,ball.y-p.y),hit=ball.r+p.s*.34;if(d<hit&&ball.y<p.y+ball.r){let nx=(p.x-ball.x)/(d||1),ny=(p.y-ball.y)/(d||1),imp=Math.max(3,Math.abs(ball.vy)*.8);p.fallen=true;p.vx=nx*imp+ball.vx*.35;p.vy=ny*imp+Math.abs(ball.vy)*.65;p.av=(Math.random()-.5)*.28;ball.vx+=nx*1.1;ball.vy*=.84;}});if(ball.y<H*.16){ball.vy=Math.max(ball.vy,1);ball.vx*=.98}if(ball.y>H*.89||ball.x<W*.1||ball.x>W*.9){ball.vx*=.92;ball.vy*=.9}if(Math.hypot(ball.vx,ball.vy)>.18)moving=true;draw();if(moving){anim=requestAnimationFrame(step)}else finishShot()}step()}
async function finishShot(){
 const down=Math.min(standing,pins.filter(p=>p.fallen).length);
 if(onlineMode){await submitOnlineShot(down);return;}
 frameRolls.push(down);rolls.push(down);standing=Math.max(0,standing-down);total+=down;shots++;score=scoringTotal();update();
 $('hint').textContent='أسقطت '+down+' قارورة — مجموعك '+score+' نقطة';
 let frameDone=false,bonusRack=false;
 if(frame<10){frameDone=down===10||frameRolls.length>=2;}
 else if(frameRolls.length===1){bonusRack=down===10;}
 else if(frameRolls.length===2){const first=frameRolls[0],second=frameRolls[1];if(first===10)bonusRack=second===10;else if(first+second===10)bonusRack=true;else frameDone=true;}
 else frameDone=true;
 if(frameDone){$('next').disabled=false;$('next').style.opacity='1';$('hint').textContent+=' — انتهى دور الجولة، اضغط الجولة التالية';return;}
 if(bonusRack||standing===0)freshRack();
 else{if(M)pins.filter(p=>p.fallen&&p.body).forEach(p=>M.Composite.remove(physicsWorld,p.body));pins=pins.filter(p=>!p.fallen);pins.forEach(p=>{p.vx=0;p.vy=0;p.av=0;p.alpha=1;});resetBall();}
 locked=false;drag=null;update();$('hint').textContent+=' — باقي لك رمية';
}
async function onlineRequest(action,extra={}) {
 const initData=tg?.initData||'';
 if(!initData)throw new Error('افتح اللعبة من داخل تيليجرام');
 const response=await fetch('/api/bowling-online',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,action,game_id:onlineGameId,...extra})});
 const data=await response.json().catch(()=>({}));
 if(!response.ok||!data.ok)throw new Error(data.error||'تعذر الاتصال بالمباراة');
 return data.result;
}
let endOverlayShown=false,endCountdown=null;
function returnBowlingToMenu(){if(endCountdown){clearTimeout(endCountdown);endCountdown=null;}if(onlinePoll)clearInterval(onlinePoll);location.href='/mini-app';}
function showBowlingEndOverlay(winnerName,isDraw,subtitle){
 if(endOverlayShown)return;endOverlayShown=true;if(onlinePoll){clearInterval(onlinePoll);onlinePoll=null;}
 const style=document.createElement('style');
 style.textContent='.online-end-overlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(5,3,7,.68);backdrop-filter:blur(15px) saturate(.72)}.online-end-card{width:min(100%,440px);padding:30px 20px 22px;border:1px solid #ffffff35;border-radius:28px;background:radial-gradient(ellipse at 50% 0%,#123e68 0%,transparent 58%),linear-gradient(145deg,#10263a,#070d16);box-shadow:0 22px 85px #000d;text-align:center}.online-end-card h2{font-size:clamp(25px,7vw,34px);margin:0 0 13px;font-weight:1000}.online-end-winner{margin:8px auto 12px;padding:12px 14px;border:1px solid #38a9e870;border-radius:17px;background:#080d16a8;color:#71d0ff;font-size:clamp(23px,6vw,31px);font-weight:1000}.online-end-card p{color:#ffffffd1;font-size:15px;line-height:1.8;margin:0 0 24px}.online-end-actions{display:grid;gap:11px}.online-end-actions button{width:100%;min-height:58px;border:1px solid #ffffff20;border-radius:17px;font-size:17px;font-weight:950;color:#fff;background:linear-gradient(135deg,#168fda,#07518e)}.online-end-actions button:last-child{background:linear-gradient(135deg,#45404a,#211d25)}';
 document.head.append(style);
 const overlay=document.createElement('div');overlay.className='online-end-overlay';
 const card=document.createElement('div');card.className='online-end-card';
 const h=document.createElement('h2');h.textContent=isDraw?'🤝 انتهت اللعبة بالتعادل':'🎉 انتهت اللعبة!';
 const w=document.createElement('div');w.className='online-end-winner';w.textContent=isDraw?'تعادل بين اللاعبين':(winnerName||'انتهت اللعبة');
 const p=document.createElement('p');p.textContent=subtitle||(isDraw?'كانت مباراة حماسية! يعطيكم العافية 👏':'🏆 الفائز: '+winnerName);
 const actions=document.createElement('div');actions.className='online-end-actions';
 const close=document.createElement('button');close.textContent='قفل الصفحة';close.onclick=()=>{if(tg?.close)tg.close();else returnBowlingToMenu();};
 const home=document.createElement('button');home.textContent='الرجوع للقائمة الرئيسية';home.onclick=returnBowlingToMenu;
 actions.append(close,home);card.append(h,w,p,actions);overlay.append(card);document.body.append(overlay);
 const sound=fetch('/api/game-end-sound?game_type=bowling').then(r=>r.json()).then(d=>d?.url?new Audio(d.url):null).catch(()=>null);
 endCountdown=setTimeout(()=>{const layer=document.createElement('div');layer.className='online-end-countdown';layer.style.cssText='position:fixed;inset:0;z-index:100001;display:flex;align-items:center;justify-content:center;padding:18px;background:#0008;backdrop-filter:blur(13px)';const box=document.createElement('div');box.style.cssText='width:min(100%,440px);padding:28px 20px;border:1px solid #ffffff70;border-radius:26px;background:#0a1827;text-align:center';const label=document.createElement('div');label.textContent='سيتم إغلاق الصفحة بعد:';label.style.fontSize='24px';label.style.fontWeight='900';const num=document.createElement('div');num.style.cssText='font-size:112px;font-weight:1000';const home2=document.createElement('button');home2.className='action';home2.textContent='الرجوع للقائمة الرئيسية';home2.onclick=returnBowlingToMenu;box.append(label,num,home2);layer.append(box);document.body.append(layer);let n=5;const tick=()=>{if(!layer.isConnected)return;num.textContent=n;if(n<=1){endCountdown=setTimeout(()=>{if(tg?.close)tg.close();else returnBowlingToMenu();},1000);return;}n--;endCountdown=setTimeout(tick,1000);};sound.then(a=>a?.play().catch(()=>{}));tick();},3000);
}
function showOnlineResult(state){
 if(state.status!=='finished')return;
 const winner=state.draw?'':state.winner_name||'الفائز';
 const details=state.players.map((p,i)=>p.name+': '+(state.scores?.[i]||0)+' نقطة').join(' — ');
 showBowlingEndOverlay(winner,!!state.draw,details);
}
function applyOnlineState(state,resetRack=false){
 const oldKey=lastOnlineTurn;onlineState=state;frame=state.frame||1;
 const me=Number(tg?.initDataUnsafe?.user?.id||0),myIndex=state.players?.findIndex(p=>Number(p.id)===me)??-1;
 score=myIndex>=0?(state.scores?.[myIndex]||0):0;standing=Number(state.standing??10);
 const key=String(state.frame)+':'+String(state.turn_index);
 if(resetRack||(!oldKey&&key)|| (oldKey&&oldKey!==key)){setupPins();resetBall();}
 lastOnlineTurn=key;locked=!state.your_turn||state.status!=='playing';
 $('throw').disabled=locked;update();
 const current=state.players?.[state.turn_index];$('current-player').textContent=current?.name||'—';
 if(state.status==='finished')showOnlineResult(state);
 else $('hint').textContent=state.your_turn?'دورك — اسحب الكرة للتسديد':'بانتظار دور '+(current?.name||'اللاعب');
}
async function submitOnlineShot(pinsDown){
 const oldKey=lastOnlineTurn,oldStanding=standing;
 try{
  const state=await onlineRequest('shot',{pins:pinsDown});
  const key=String(state.frame)+':'+String(state.turn_index);
  const sameTurn=key===oldKey&&state.your_turn;
  onlineState=state;frame=state.frame||1;
  const me=Number(tg?.initDataUnsafe?.user?.id||0),myIndex=state.players?.findIndex(p=>Number(p.id)===me)??-1;
  score=myIndex>=0?(state.scores?.[myIndex]||0):0;standing=Number(state.standing??10);lastOnlineTurn=key;
  if(sameTurn&&standing===Math.max(0,oldStanding-pinsDown)){if(M)pins.filter(p=>p.fallen&&p.body).forEach(p=>M.Composite.remove(physicsWorld,p.body));pins=pins.filter(p=>!p.fallen);resetBall();}
  else{setupPins();resetBall();}
  locked=!state.your_turn||state.status!=='playing';$('throw').disabled=locked;update();showOnlineResult(state);
  if(state.status!=='finished')$('hint').textContent=state.your_turn?'باقي لك رمية':'بانتظار دور '+(state.players?.[state.turn_index]?.name||'اللاعب');
 }catch(e){locked=true;$('throw').disabled=true;$('hint').textContent=e.message;}
}
async function loadOnlineBowling(){
 try{
  if(!onlineGameId)throw new Error('معرّف المباراة غير موجود');
  const state=await onlineRequest('state');applyOnlineState(state,true);
  if(onlinePoll)clearInterval(onlinePoll);
  onlinePoll=setInterval(async()=>{
   try{
    const fresh=await onlineRequest('state');
    const key=String(fresh.frame)+':'+String(fresh.turn_index);
    if(key!==lastOnlineTurn)applyOnlineState(fresh,true);
    else{onlineState=fresh;standing=Number(fresh.standing??10);score=fresh.scores?.[fresh.players.findIndex(p=>Number(p.id)===Number(tg?.initDataUnsafe?.user?.id))]||score;locked=!fresh.your_turn;$('throw').disabled=locked;update();showOnlineResult(fresh);}
   }catch(e){}
  },1800);
 }catch(e){$('hint').textContent=e.message;}
}
function nextFrame(){
 frame++;
 if(frame>10){showBowlingEndOverlay('نتيجتك: '+score+' نقطة',false,'أسقطت '+total+' قارورة خلال 10 جولات.');return;}
 $('next').disabled=true;$('next').style.opacity='.5';shots=0;resetShot();
}
canvas.addEventListener('pointerdown',e=>{if(locked||(onlineMode&&!onlineState?.your_turn)||!ball)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(Math.hypot(x-ball.x,y-ball.y)<ball.r*2.5){drag={x,y};canvas.setPointerCapture(e.pointerId)}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const r=canvas.getBoundingClientRect();drag.x=e.clientX-r.left;drag.y=e.clientY-r.top;draw()});
canvas.addEventListener('pointerup',()=>{if(drag)launch()});$('throw').onclick=()=>{if(!locked){drag={x:ball.x,y:ball.y-H*.24};launch()}};$('next').onclick=nextFrame;$('reset').onclick=()=>{if(onlineMode)return;frame=1;total=0;score=0;shots=0;rolls=[];frameRolls=[];$('result').style.display='none';$('next').disabled=true;$('next').style.opacity='.5';resetShot()};$('again').onclick=()=>$('reset').click();$('back').onclick=()=>{if(onlinePoll)clearInterval(onlinePoll);location.href='/mini-app'};
new ResizeObserver(()=>{resize();if(!locked)setupPins()}).observe(wrap);resize();setupPins();$('next').disabled=true;$('next').style.opacity='.5';update();if(onlineMode){$('reset').hidden=true;$('next').hidden=true;loadOnlineBowling();}
})();
</script></body></html>
