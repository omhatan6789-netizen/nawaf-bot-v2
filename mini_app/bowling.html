<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>بولينق</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030b18;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
body{background:radial-gradient(ellipse at 50% 40%,#123b69 0,#07182d 48%,#020711 100%)}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);max-width:620px;margin:auto}
header{height:58px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
header button,.action{border:1px solid #398ad9;background:#0b2543;color:#eaf6ff;border-radius:13px;padding:9px 13px;font-weight:800}
h1{font-size:21px;margin:0;color:#d9f1ff;text-shadow:0 0 18px #168fff}
#score{display:flex;gap:7px;justify-content:center;flex-shrink:0;margin:4px 0 10px}
.scorebox{background:#0a1e35;border:1px solid #1d5b91;border-radius:12px;padding:7px 12px;text-align:center;min-width:70px}
.scorebox small{display:block;color:#8fc8f6;font-size:11px}.scorebox b{font-size:18px}
#lane-wrap{position:relative;flex:1;min-height:0;border:1px solid #2678b9;border-radius:24px;overflow:hidden;box-shadow:0 0 35px #087bdf44,inset 0 0 40px #0b5ba733;background:#061a31}
canvas{display:block;width:100%;height:100%}
#hint{text-align:center;color:#b7dfff;font-size:13px;padding:11px 4px 4px;min-height:36px}
#bottom{display:flex;gap:9px;padding:5px 0 10px;justify-content:center;flex-shrink:0}
#bottom button{flex:1;max-width:190px;padding:12px}
#result{position:absolute;inset:0;background:#020a15dd;backdrop-filter:blur(9px);display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
#result .panel{width:100%;max-width:340px;background:linear-gradient(145deg,#123b63,#07182d);border:1px solid #53b6ff;border-radius:24px;padding:25px;box-shadow:0 0 45px #138cff55}
#result h2{font-size:28px;margin:0 0 10px}#result p{color:#c4e6ff}
</style></head>
<body><main id="app">
<header><button id="back">رجوع</button><h1>بولينق 🎳</h1><button id="reset">إعادة</button></header>
<section id="score"><div class="scorebox"><small>الجولة</small><b id="frame">1 / 10</b></div><div class="scorebox"><small>إسقاطك</small><b id="fallen">0 / 10</b></div><div class="scorebox"><small>النقاط</small><b id="points">0</b></div></section>
<div id="lane-wrap"><canvas id="game"></canvas><div id="result"><div class="panel"><h2 id="result-title">رميّة رائعة!</h2><p id="result-text"></p><button class="action" id="again">العب مرة ثانية</button></div></div></div>
<div id="hint">اسحب من الكرة للأعلى، وحرّك إصبعك يمينًا أو يسارًا لتحديد الاتجاه</div>
<div id="bottom"><button class="action" id="throw">تسديد</button><button class="action" id="next">الجولة التالية</button></div>
</main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),wrap=document.getElementById('lane-wrap');
const $=id=>document.getElementById(id);let W=0,H=0,dpr=1,ball,pins=[],drag=null,anim=0,frame=1,total=0,shots=0,settle=0,locked=false,score=0,rolls=[],frameRolls=[],standing=10;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const r=wrap.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function lane(){const top=H*.12,bottom=H*.91,cx=W/2,topW=W*.30,botW=W*.78;ctx.save();ctx.beginPath();ctx.moveTo(cx-topW/2,top);ctx.lineTo(cx+topW/2,top);ctx.lineTo(cx+botW/2,bottom);ctx.lineTo(cx-botW/2,bottom);ctx.closePath();let g=ctx.createLinearGradient(0,top,0,bottom);g.addColorStop(0,'#a8dfff');g.addColorStop(.35,'#438fc4');g.addColorStop(1,'#174b78');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#5cc7ff';ctx.lineWidth=2;ctx.stroke();
for(let i=-3;i<=3;i++){let x1=cx+i*topW/7,x2=cx+i*botW/7;ctx.strokeStyle='rgba(210,240,255,.17)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1,top);ctx.lineTo(x2,bottom);ctx.stroke()}
ctx.strokeStyle='#a8e7ff88';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-topW*.42,top+H*.05);ctx.lineTo(cx-botW*.43,bottom-H*.02);ctx.moveTo(cx+topW*.42,top+H*.05);ctx.lineTo(cx+botW*.43,bottom-H*.02);ctx.stroke();
ctx.fillStyle='#64caff';ctx.shadowColor='#1aa7ff';ctx.shadowBlur=18;ctx.fillRect(cx-topW*.48,top-5,topW*.96,4);ctx.restore()}
function pinShape(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=p.alpha;ctx.shadowColor='#9bdcff';ctx.shadowBlur=9;let s=p.s;ctx.fillStyle='#f5fbff';ctx.beginPath();ctx.moveTo(-s*.28,s*.48);ctx.quadraticCurveTo(-s*.42,s*.08,-s*.18,-s*.13);ctx.quadraticCurveTo(-s*.28,-s*.55,0,-s*.58);ctx.quadraticCurveTo(s*.28,-s*.55,s*.18,-s*.13);ctx.quadraticCurveTo(s*.42,s*.08,s*.28,s*.48);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#e33d59';ctx.lineWidth=Math.max(2,s*.12);ctx.beginPath();ctx.moveTo(-s*.18,-s*.15);ctx.lineTo(s*.18,-s*.15);ctx.stroke();ctx.fillStyle='#d8efff';ctx.beginPath();ctx.ellipse(0,s*.45,s*.3,s*.1,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function ballShape(){if(!ball)return;ctx.save();ctx.shadowColor='#26baff';ctx.shadowBlur=24;let g=ctx.createRadialGradient(ball.x-ball.r*.35,ball.y-ball.r*.4,2,ball.x,ball.y,ball.r);g.addColorStop(0,'#f0fbff');g.addColorStop(.22,'#46c8ff');g.addColorStop(.65,'#0872d1');g.addColorStop(1,'#032b66');ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#dff7ff';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(ball.x+Math.cos(i*2.1)*ball.r*.3,ball.y+Math.sin(i*2.1)*ball.r*.3,ball.r*.09,0,Math.PI*2);ctx.fill()}ctx.restore()}
function setupPins(){pins=[];const cx=W/2,top=H*.19,step=Math.min(W*.075,H*.045);for(let row=0;row<4;row++)for(let col=0;col<=row;col++){let x=cx+(col-row/2)*step*1.65,y=top+row*step*1.25;pins.push({x,y,vx:0,vy:0,a:0,av:0,s:Math.max(13,step*.75),fallen:false,alpha:1})}ball={x:W/2,y:H*.83,vx:0,vy:0,r:Math.max(17,Math.min(W,H)*.035}}}
function resetShot(){setupPins();drag=null;locked=false;settle=0;standing=10;frameRolls=[];$('hint').textContent='اسحب من الكرة للأعلى، وحرّك إصبعك يمينًا أو يسارًا لتحديد الاتجاه';update()}
function update(){ $('frame').textContent=frame+' / 10';$('fallen').textContent=(10-standing)+' / 10';$('points').textContent=score}
function scoringTotal(){let i=0,sum=0;for(let f=0;f<10;f++){if(i>=rolls.length)break;let a=rolls[i];if(a===10){sum+=10+(rolls[i+1]??0)+(rolls[i+2]??0);i++;}else if(i+1<rolls.length&&a+rolls[i+1]===10){sum+=10+(rolls[i+2]??0);i+=2;}else{sum+=a+(rolls[i+1]??0);i+=2;}}return sum}
function resetBall(){ball={x:W/2,y:H*.83,vx:0,vy:0,r:Math.max(17,Math.min(W,H)*.035)}}
function freshRack(){setupPins();standing=10}
function draw(){if(!W||!H)return;ctx.clearRect(0,0,W,H);lane();pins.forEach(pinShape);ballShape();if(drag){ctx.strokeStyle='#b9ecff55';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r+7,0,Math.PI*2);ctx.stroke()}}
function launch(){if(locked||!drag)return;let dx=drag.x-ball.x,dy=ball.y-drag.y;let power=clamp(Math.hypot(dx,dy),12,Math.min(H*.42,180));let angle=clamp(dx/Math.max(55,power),-.48,.48);let speed=7+power*.075;ball.vx=Math.sin(angle)*speed;ball.vy=-Math.cos(angle)*speed;locked=true;drag=null;$('hint').textContent='الكرة في طريقها إلى القوارير...';animate()}
function animate(){cancelAnimationFrame(anim);let active=true;function step(){let moving=false;ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.992;ball.vy*=.992;
pins.forEach(p=>{if(p.fallen){p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy*=.985;p.a+=p.av;p.av*=.98;if(p.y>H*.96||p.x<-30||p.x>W+30)p.alpha=Math.max(0,p.alpha-.04);if(Math.hypot(p.vx,p.vy)>.15)moving=true;return}
let d=Math.hypot(ball.x-p.x,ball.y-p.y),hit=ball.r+p.s*.34;if(d<hit&&ball.y<p.y+ball.r){let nx=(p.x-ball.x)/(d||1),ny=(p.y-ball.y)/(d||1),imp=Math.max(3,Math.abs(ball.vy)*.8);p.fallen=true;p.vx=nx*imp+ball.vx*.35;p.vy=ny*imp+Math.abs(ball.vy)*.65;p.av=(Math.random()-.5)*.28;ball.vx+=nx*1.1;ball.vy*=.84;}}
);
if(ball.y<H*.16){ball.vy=Math.max(ball.vy,1);ball.vx*=.98}
if(ball.y>H*.89||ball.x<W*.1||ball.x>W*.9){ball.vx*=.92;ball.vy*=.9}
if(Math.hypot(ball.vx,ball.vy)>.18)moving=true;else{ball.vx=0;ball.vy=0}
draw();if(moving){anim=requestAnimationFrame(step)}else{settle++;finishShot()}}
step()}
function finishShot(){
 const down=Math.min(standing,pins.filter(p=>p.fallen).length);
 frameRolls.push(down);rolls.push(down);standing=Math.max(0,standing-down);total+=down;shots++;score=scoringTotal();update();
 $('hint').textContent='أسقطت '+down+' قارورة — مجموعك '+score+' نقطة';
 let frameDone=false,bonusRack=false;
 if(frame<10){frameDone=down===10||frameRolls.length>=2;}
 else if(frameRolls.length===1){bonusRack=down===10;}
 else if(frameRolls.length===2){const first=frameRolls[0],second=frameRolls[1];if(first===10)bonusRack=second===10;else if(first+second===10)bonusRack=true;else frameDone=true;}
 else frameDone=true;
 if(frameDone){$('next').disabled=false;$('next').style.opacity='1';$('hint').textContent+=' — انتهى دور الجولة، اضغط الجولة التالية';return;}
 if(bonusRack||standing===0)freshRack();
 else{pins=pins.filter(p=>!p.fallen);pins.forEach(p=>{p.vx=0;p.vy=0;p.av=0;p.alpha=1;});resetBall();}
 locked=false;drag=null;update();$('hint').textContent+=' — باقي لك رمية';
}
function nextFrame(){
 frame++;
 if(frame>10){$('result-title').textContent='انتهت اللعبة!';$('result-text').textContent='نتيجتك الرسمية: '+score+' نقطة — أسقطت '+total+' قارورة';$('result').style.display='flex';return;}
 $('next').disabled=true;$('next').style.opacity='.5';shots=0;resetShot();
}
canvas.addEventListener('pointerdown',e=>{if(locked||!ball)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(Math.hypot(x-ball.x,y-ball.y)<ball.r*2.5){drag={x,y};canvas.setPointerCapture(e.pointerId)}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const r=canvas.getBoundingClientRect();drag.x=e.clientX-r.left;drag.y=e.clientY-r.top;draw()});
canvas.addEventListener('pointerup',()=>{if(drag)launch()});$('throw').onclick=()=>{if(!locked){drag={x:ball.x,y:ball.y-H*.24};launch()}};$('next').onclick=nextFrame;$('reset').onclick=()=>{frame=1;total=0;score=0;shots=0;rolls=[];frameRolls=[];$('result').style.display='none';$('next').disabled=true;$('next').style.opacity='.5';resetShot()};$('again').onclick=()=>$('reset').click();$('back').onclick=()=>{location.href='/mini-app'};
new ResizeObserver(()=>{resize();if(!locked)setupPins()}).observe(wrap);resize();setupPins();$('next').disabled=true;$('next').style.opacity='.5';update();
})();
</script></body></html>
