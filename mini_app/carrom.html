<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#35090d"><title>كيرم | بوت نواف</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<style>
:root{color-scheme:dark;--red:#b81728;--gold:#e5bb76}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#17090b;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh;background:radial-gradient(ellipse at 50% 0,#78121b,#24090d 58%,#100709);padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);touch-action:pan-y}body.playing{touch-action:auto;overscroll-behavior:none}
.app{width:min(100%,560px);margin:auto;padding:10px 0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.brand{font-weight:950;font-size:21px;letter-spacing:.2px}.brand small{display:block;color:#ffffff80;font-size:10px;font-weight:650;letter-spacing:1.8px}
.pill{border:1px solid #ffffff30;background:#ffffff12;color:#fff;border-radius:30px;padding:8px 12px;font-weight:800}
.panel{border:1px solid #ffffff22;background:linear-gradient(145deg,#ffffff13,#09040670);border-radius:20px;padding:15px;box-shadow:0 12px 30px #0005}
h1{font-size:26px;margin:4px 0 5px;text-align:center} .sub{text-align:center;color:#ffffff9a;font-size:13px;margin:0 0 16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid #ffffff35;border-radius:15px;background:#17090c;color:#fff;padding:14px 8px;min-height:65px;font-weight:850;font-size:15px}.choice.active{border-color:#ff9ba3;background:linear-gradient(135deg,#a81321,#4d0a11);box-shadow:0 0 0 2px #ff5b672b}
.primary,.secondary{width:100%;border:0;border-radius:14px;min-height:52px;margin-top:12px;font-size:16px;font-weight:900}.primary{background:linear-gradient(135deg,#ef4858,#9e0d1c);color:#fff;box-shadow:0 4px 0 #560811}.secondary{background:#ffffff13;color:#fff;border:1px solid #ffffff30}
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}
.player{border:1px solid #ffffff28;background:#110709a8;border-radius:14px;padding:9px 10px;min-width:0}.player.active{border-color:#ffbd78;box-shadow:0 0 0 2px #ffbd7825}.player strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.player span{font-size:11px;color:#ffffff9a}
.vs{font-size:11px;color:#ffffff70;font-weight:900}
.board-wrap{position:relative;width:min(100%,430px);margin:0 auto;filter:drop-shadow(0 13px 18px #0009);touch-action:none;overscroll-behavior:contain;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#board{display:block;width:100%;height:auto;aspect-ratio:1/1;touch-action:none;border-radius:18px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.position-control{width:min(100%,430px);margin:12px auto 4px;padding:12px 14px;border:1px solid #ffffff2b;border-radius:15px;background:#ffffff0d;touch-action:pan-x;user-select:none}.position-control label{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:850;color:#ffe0ad;margin-bottom:8px}.position-control input{display:block;width:100%;height:28px;margin:0;accent-color:#e8b66d;touch-action:pan-x}.position-control small{display:block;text-align:center;color:#ffffff80;font-size:11px;margin-top:5px}.hint{text-align:center;color:#ffffff9b;font-size:12px;min-height:22px;margin:9px 0 0}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.controls button{border:1px solid #ffffff30;background:#ffffff12;color:#fff;border-radius:12px;min-height:43px;font-weight:800}
#setup,#game{display:none}#setup.show,#game.show{display:block}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 15px);transform:translateX(-50%);background:#16090c;border:1px solid #ffffff40;border-radius:14px;padding:12px 17px;z-index:9;box-shadow:0 8px 30px #0009;max-width:90%;text-align:center}
@media(min-height:850px){.board-wrap{width:min(100%,470px)}}
</style></head>
<body><main class="app">
<header class="top"><button class="pill" id="back">رجوع</button><div class="brand">كيرم <small>NAWAF GAME</small></div><button class="pill" id="reset">إعادة</button></header>
<section id="setup" class="panel show"><h1>كيرم 🎯</h1><p class="sub">اختر طريقة اللعب وعدد اللاعبين</p>
<div class="sub">طريقة اللعب</div><div class="choices" id="modes">
<button class="choice active" data-mode="bot">🤖 ضد الكمبيوتر</button><button class="choice" data-mode="local">👥 لاعبين على نفس الجهاز</button>
</div>
<div class="sub" style="margin-top:16px">عدد اللاعبين</div><div class="choices" id="counts">
<button class="choice active" data-count="2">لاعبان</button><button class="choice" data-count="4">أربعة لاعبين</button>
</div>
<div id="fourModeWrap" style="display:none"><div class="sub" style="margin-top:16px">نظام الأربعة لاعبين</div><div class="choices" id="fourModes">
<button class="choice active" data-four-mode="teams">🤝 فريقان (2 ضد 2)</button><button class="choice" data-four-mode="solo">🏆 كل لاعب لحاله</button>
</div></div>
<button class="primary" id="start">ابدأ اللعب</button>
<p class="sub" style="margin:12px 0 0">اللعب أونلاين بالغرف قيد بناء نظام المزامنة الخاص به.</p></section>
<section id="game"><div class="scorebar" id="scorebar"></div><div class="board-wrap"><canvas id="board" width="800" height="800"></canvas></div><div class="position-control"><label for="striker-position"><span>مكان قرص التسديد</span><span>↔</span></label><input id="striker-position" type="range" min="0" max="100" value="50" step="1"><small>حرّك المؤشر لتحديد مكان القرص على خطك فقط</small></div><div class="hint" id="hint">اسحب من القرص الضارب للخلف ثم اتركه للتسديد</div><div class="controls"><button id="change">تبديل اللاعب</button><button id="new">مباراة جديدة</button></div></section>
</main>
<script>
const {Engine,World,Bodies,Body,Sleeping}=Matter;
const $=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d');
const W=800,H=800,engine=Engine.create({enableSleeping:true}),world=engine.world;
engine.gravity.x=0;engine.gravity.y=0;engine.positionIterations=8;engine.velocityIterations=8;engine.constraintIterations=4;
let mode='bot',count=2,fourMode='teams',players=[],turn=0,coins=[],striker=null,aim=null,dragging=false,activePointerId=null,shotMoving=false,turnPocketed=0,queenPocketed=false,gameOver=false,lastT=0,raf=0;
const cx=400,cy=400,inner={l:62,r:738,t:62,b:738},pocketR=43;
function choose(group,attr,val){document.querySelectorAll('#'+group+' .choice').forEach(b=>b.classList.toggle('active',b.dataset[attr]===val));}
$('modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;choose('modes','mode',mode)};
$('counts').onclick=e=>{const b=e.target.closest('[data-count]');if(!b)return;count=Number(b.dataset.count);choose('counts','count',String(count));$('fourModeWrap').style.display=count===4?'block':'none';};
$('fourModes').onclick=e=>{const b=e.target.closest('[data-four-mode]');if(!b)return;fourMode=b.dataset.fourMode;choose('fourModes','fourMode',fourMode)};
function setGameSwipeLock(locked){document.body.classList.toggle('playing',locked);const tg=window.Telegram?.WebApp;if(!tg)return;if(locked&&typeof tg.disableVerticalSwipes==='function')tg.disableVerticalSwipes();if(!locked&&typeof tg.enableVerticalSwipes==='function')tg.enableVerticalSwipes();}
function startGame(){ $('setup').classList.remove('show');$('game').classList.add('show');setGameSwipeLock(true);players=count===2?[{name:'أنت',color:'#242326',score:0},{name:mode==='bot'?'الكمبيوتر':'اللاعب الثاني',color:'#eee4d0',score:0}]:fourMode==='teams'?[{name:'الفريق الأول · أنت',color:'#242326',score:0,team:0},{name:'الفريق الثاني · اللاعب 2',color:'#eee4d0',score:0,team:1},{name:'الفريق الأول · اللاعب 3',color:'#242326',score:0,team:0},{name:'الفريق الثاني · اللاعب 4',color:'#eee4d0',score:0,team:1}]:[{name:'اللاعب 1',color:'#242326',score:0},{name:'اللاعب 2',color:'#eee4d0',score:0},{name:'اللاعب 3',color:'#242326',score:0},{name:'اللاعب 4',color:'#eee4d0',score:0}];turn=0;gameOver=false;resetBoard();renderScores();$('hint').textContent='اسحب القرص الضارب للخلف ثم اتركه للتسديد';loop();}
function clearWorld(){World.clear(world,false);coins=[];striker=null;}
function addWalls(){/* الحدود تُدار باصطدامات دقيقة أدناه، مع فتحات الجيوب الأربع فقط. */}
function addCoin(x,y,color,type='coin'){const b=Bodies.circle(x,y,type==='queen'?19:18,{label:type,restitution:.88,friction:.035,frictionStatic:.12,frictionAir:.018,density:.0012,sleepThreshold:70});b.gameColor=color;b.gameType=type;b.pocketed=false;World.add(world,b);coins.push(b);return b;}
function resetBoard(){clearWorld();addWalls();const colors=['#080808','#f7f7f7'];addCoin(cx,cy,'#ed172b','queen');
 const rings=[{r:38,n:6,start:-Math.PI/2},{r:76,n:12,start:-Math.PI/2}];rings.forEach((ring,ri)=>{for(let i=0;i<ring.n;i++){const a=ring.start+i*Math.PI*2/ring.n+(ri?Math.PI/12:0);addCoin(cx+Math.cos(a)*ring.r,cy+Math.sin(a)*ring.r,colors[(i+ri)%2]);}});
 placeStriker();turnPocketed=0;queenPocketed=false;shotMoving=false;aim=null;draw();}
function baselinePosition(value=50){
 const v=Math.max(0,Math.min(100,Number(value)))/100;
 if(count===2)return {x:205+390*v,y:turn%2===0?620:180};
 const bases=[{x:205+390*v,y:620},{x:180,y:205+390*v},{x:205+390*v,y:180},{x:620,y:205+390*v}];
 return bases[turn%4];
}
function placeStriker(){
 if(striker)World.remove(world,striker);
 const slider=$('striker-position');if(slider)slider.value=50;
 const p=baselinePosition(50);
 striker=Bodies.circle(p.x,p.y,28,{label:'striker',restitution:.82,friction:.035,frictionAir:.016,density:.002});
 striker.gameColor='#d8a64f';striker.isStriker=true;World.add(world,striker);
}
function renderScores(){const el=$('scorebar');el.innerHTML='';if(players.length===4&&fourMode==='teams'){[0,1].forEach(team=>{const members=players.filter(p=>p.team===team),score=members.reduce((n,p)=>n+p.score,0),active=players[turn]?.team===team;const d=document.createElement('div');d.className='player'+(active?' active':'');d.innerHTML='<strong>'+(team===0?'الفريق الأول':'الفريق الثاني')+'</strong><span>'+score+' نقطة · '+members.map(p=>p.name.split(' · ').pop()).join(' و ')+'</span>';el.appendChild(d);});const vs=document.createElement('div');vs.className='vs';vs.textContent='VS';el.appendChild(vs);return;}players.forEach((p,i)=>{const d=document.createElement('div');d.className='player'+(i===turn?' active':'');d.innerHTML='<strong>'+p.name+'</strong><span>'+p.score+' نقطة</span>';el.appendChild(d);if(i===0&&players.length===2){const vs=document.createElement('div');vs.className='vs';vs.textContent='VS';el.appendChild(vs);}});if(players.length===4){const vs=document.createElement('div');vs.className='vs';vs.textContent='الدور '+(turn+1);el.appendChild(vs);}}
function drawBoard(){
 // KOXTONS-style layout: dark frame, clean double playing boundary,
 // eight red baseline markers, diagonal corner guides and a central compass.
 const frame=ctx.createLinearGradient(0,0,800,800);
 frame.addColorStop(0,'#161719');frame.addColorStop(.45,'#08090a');frame.addColorStop(1,'#242528');
 roundRect(ctx,8,8,784,784,30,frame,'#55575b',5);
 const bevel=ctx.createLinearGradient(0,20,0,780);
 bevel.addColorStop(0,'#424449');bevel.addColorStop(.5,'#090a0c');bevel.addColorStop(1,'#303237');
 roundRect(ctx,24,24,752,752,23,bevel,'#050506',4);
 const wood=ctx.createLinearGradient(70,55,730,745);
 wood.addColorStop(0,'#f3e4bd');wood.addColorStop(.5,'#ead6a8');wood.addColorStop(1,'#d9c18f');
 roundRect(ctx,48,48,704,704,9,wood,'#171719',3);

 // Four actual corner pockets with red lips.
 [[77,77],[723,77],[77,723],[723,723]].forEach(([x,y])=>{
  ctx.beginPath();ctx.arc(x,y,31,0,Math.PI*2);ctx.fillStyle='#090909';ctx.fill();
  ctx.lineWidth=8;ctx.strokeStyle='#c9152b';ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,21,0,Math.PI*2);ctx.strokeStyle='#4c4c4c';ctx.lineWidth=2;ctx.stroke();
 });

 // Double square playing boundary. No extra decorative rectangles.
 ctx.save();ctx.strokeStyle='#171717';ctx.lineWidth=3;
 ctx.strokeRect(164,164,472,472);ctx.lineWidth=1.5;ctx.strokeRect(176,176,448,448);
 ctx.restore();

 // Base lines and red placement circles, exactly two at each side.
 const markers=[[205,180],[595,180],[205,620],[595,620],[180,205],[180,595],[620,205],[620,595]];
 ctx.save();ctx.strokeStyle='#171717';ctx.lineWidth=2.5;ctx.beginPath();
 ctx.moveTo(205,180);ctx.lineTo(595,180);
 ctx.moveTo(205,620);ctx.lineTo(595,620);
 ctx.moveTo(180,205);ctx.lineTo(180,595);
 ctx.moveTo(620,205);ctx.lineTo(620,595);ctx.stroke();
 markers.forEach(([x,y])=>{
  ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fillStyle='#c9152b';ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle='#171717';ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.strokeStyle='#f3d9bd';ctx.lineWidth=1.5;ctx.stroke();
 });
 ctx.restore();

 // Corner direction guides and curved arrows, mirrored in all four quadrants.
 function arrowLine(x1,y1,x2,y2){
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1),n=11;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-n*Math.cos(a-.48),y2-n*Math.sin(a-.48));
  ctx.moveTo(x2,y2);ctx.lineTo(x2-n*Math.cos(a+.48),y2-n*Math.sin(a+.48));ctx.stroke();
 }
 const corners=[
  {sx:215,sy:215,ex:305,ey:305,arc:[300,255,34,Math.PI*.08,Math.PI*.92]},
  {sx:585,sy:215,ex:495,ey:305,arc:[500,255,34,Math.PI*.08,Math.PI*.92]},
  {sx:215,sy:585,ex:305,ey:495,arc:[300,545,34,-Math.PI*.92,-Math.PI*.08]},
  {sx:585,sy:585,ex:495,ey:495,arc:[500,545,34,-Math.PI*.92,-Math.PI*.08]}
 ];
 ctx.save();ctx.strokeStyle='#25201a';ctx.lineWidth=2;
 corners.forEach(c=>{
  arrowLine(c.sx,c.sy,c.ex,c.ey);
  ctx.beginPath();ctx.arc(c.arc[0],c.arc[1],c.arc[2],c.arc[3],c.arc[4]);ctx.stroke();
  const end=c.arc[4],ex=c.arc[0]+Math.cos(end)*c.arc[2],ey=c.arc[1]+Math.sin(end)*c.arc[2];
  const tangent=end+Math.PI/2;
  ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-10*Math.cos(tangent-.5),ey-10*Math.sin(tangent-.5));ctx.moveTo(ex,ey);ctx.lineTo(ex-10*Math.cos(tangent+.5),ey-10*Math.sin(tangent+.5));ctx.stroke();
 });
 ctx.restore();

 // Central compass rose, not the old pair of plain circles.
 ctx.save();ctx.translate(cx,cy);
 ctx.beginPath();ctx.arc(0,0,82,0,Math.PI*2);ctx.strokeStyle='#171717';ctx.lineWidth=2.5;ctx.stroke();
 ctx.beginPath();ctx.arc(0,0,61,0,Math.PI*2);ctx.strokeStyle='#171717';ctx.lineWidth=1.5;ctx.stroke();
 for(let i=0;i<8;i++){
  const a=-Math.PI/2+i*Math.PI/4,outer=58,inner=15,side=9;
  ctx.beginPath();ctx.moveTo(Math.cos(a)*outer,Math.sin(a)*outer);
  ctx.lineTo(Math.cos(a+Math.PI/2)*side,Math.sin(a+Math.PI/2)*side);
  ctx.lineTo(Math.cos(a)*inner,Math.sin(a)*inner);
  ctx.lineTo(Math.cos(a-Math.PI/2)*side,Math.sin(a-Math.PI/2)*side);
  ctx.closePath();ctx.fillStyle=i%2===0?'#c9152b':'#171717';ctx.fill();ctx.strokeStyle='#171717';ctx.lineWidth=1;ctx.stroke();
 }
 ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fillStyle='#c9152b';ctx.fill();ctx.strokeStyle='#171717';ctx.lineWidth=2;ctx.stroke();
 ctx.restore();
}
function roundRect(c,x,y,w,h,r,fill,stroke,lw){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill();if(stroke){c.lineWidth=lw;c.strokeStyle=stroke;c.stroke();}}
function drawPiece(b){const {x,y}=b.position,r=b.circleRadius||15;ctx.save();ctx.translate(x,y);ctx.rotate(b.angle||0);ctx.shadowColor='#0008';ctx.shadowBlur=8;ctx.shadowOffsetY=4;const grad=ctx.createRadialGradient(-r*.35,-r*.42,r*.1,0,0,r*1.2);if(b.gameType==='queen'){grad.addColorStop(0,'#ff626d');grad.addColorStop(.25,'#f51d32');grad.addColorStop(.7,'#d90020');grad.addColorStop(1,'#8f0014');}else if(b.isStriker){grad.addColorStop(0,'#ffe6a6');grad.addColorStop(.4,'#d9a64e');grad.addColorStop(1,'#80501c');}else if(b.gameColor==='#080808'||b.gameColor==='#242326'){grad.addColorStop(0,'#444');grad.addColorStop(.22,'#171717');grad.addColorStop(.62,'#050505');grad.addColorStop(1,'#000');}else{grad.addColorStop(0,'#fff');grad.addColorStop(.28,'#f7f7f7');grad.addColorStop(.72,'#e4e4e4');grad.addColorStop(1,'#bdbdbd');}ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle=b.isStriker?'#fff0c0':'#fff8';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*.56,0,Math.PI*2);ctx.strokeStyle=b.isStriker?'#885d25':'#8c7257';ctx.lineWidth=1;ctx.stroke();if(b.gameType==='queen'){ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♛',0,1);}ctx.restore();}
function draw(){drawBoard();coins.filter(b=>!b.pocketed).forEach(drawPiece);if(striker&&!striker.pocketed)drawPiece(striker);if(aim&&striker){ctx.save();const dx=striker.position.x-aim.x,dy=striker.position.y-aim.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,tipX=striker.position.x+ux*125,tipY=striker.position.y+uy*125;ctx.lineCap='round';ctx.strokeStyle='#ffd27a';ctx.lineWidth=11;ctx.shadowColor='#0009';ctx.shadowBlur=8;ctx.beginPath();ctx.moveTo(striker.position.x,striker.position.y);ctx.lineTo(tipX-ux*24,tipY-uy*24);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.moveTo(tipX,tipY);ctx.lineTo(tipX-ux*38-uy*25,tipY-uy*38+ux*25);ctx.lineTo(tipX-ux*38+uy*25,tipY-uy*38-ux*25);ctx.closePath();ctx.fill();ctx.restore();}}
function enforceBoardBounds(){
 const ps=[[77,77],[723,77],[77,723],[723,723]],bodies=[striker,...coins].filter(b=>b&&!b.pocketed);
 for(const b of bodies){
  const r=b.circleRadius||18,p=b.position,v=b.velocity;
  if(ps.some(([x,y])=>Math.hypot(p.x-x,p.y-y)<pocketR+8))continue;
  let x=p.x,y=p.y,vx=v.x,vy=v.y,hitX=false,hitY=false;
  const minX=inner.l+r,maxX=inner.r-r,minY=inner.t+r,maxY=inner.b-r;
  if(x<minX){x=minX;hitX=true;}else if(x>maxX){x=maxX;hitX=true;}
  if(y<minY){y=minY;hitY=true;}else if(y>maxY){y=maxY;hitY=true;}
  if(hitX||hitY){
   const speed=Math.hypot(vx,vy),bounce=.48+Math.min(.38,speed*.025);
   if(hitX){vx=-vx*bounce;vy*=.985;}
   if(hitY){vy=-vy*bounce;vx*=.985;}
   Body.setPosition(b,{x,y});Body.setVelocity(b,{x:vx,y:vy});Sleeping.set(b,false);
  }
 }
}
function loop(t){if(!document.getElementById('game').classList.contains('show'))return;const dt=Math.min(33,t-(lastT||t));lastT=t;const step=(dt||16.67)/3;Engine.update(engine,step);Engine.update(engine,step);Engine.update(engine,step);detectPockets();enforceBoardBounds();draw();if(!shotMoving&&striker&&striker.speed>.2)shotMoving=true;if(shotMoving&&allStopped()){shotMoving=false;finishTurn();}raf=requestAnimationFrame(loop);}
function allStopped(){return [striker,...coins].filter(b=>b&&!b.pocketed).every(b=>Math.abs(b.velocity.x)<.13&&Math.abs(b.velocity.y)<.13&&Math.abs(b.angularVelocity)<.02);}
function detectPockets(){const ps=[[77,77],[723,77],[77,723],[723,723]];[striker,...coins].filter(Boolean).forEach(b=>{if(b.pocketed)return;for(const [x,y] of ps){if(Math.hypot(b.position.x-x,b.position.y-y)<pocketR){b.pocketed=true;World.remove(world,b);if(b===striker){setTimeout(()=>{placeStriker();draw();},180);}else{turnPocketed++;if(b.gameType==='queen')queenPocketed=true;else players[turn].score+=b.gameColor==='#272629'?1:1;toast(b.gameType==='queen'?'دخلت الملكة!':'قرص في الجيب +1');}break;}}});}
function finishTurn(){if(queenPocketed){players[turn].score+=3;queenPocketed=false;}renderScores();if(coins.every(c=>c.pocketed)){if(players.length===4&&fourMode==='teams'){const a=players.filter(p=>p.team===0).reduce((n,p)=>n+p.score,0),b=players.filter(p=>p.team===1).reduce((n,p)=>n+p.score,0);gameOver=true;$('hint').textContent=a===b?'انتهت المباراة — تعادل الفريقين 🤝':'انتهت المباراة — الفائز: '+(a>b?'الفريق الأول':'الفريق الثاني')+' 🏆';}else{const winner=players.reduce((a,b)=>a.score>=b.score?a:b);gameOver=true;$('hint').textContent='انتهت المباراة — الفائز: '+winner.name+' 🏆';}return;}if(turnPocketed===0)turn=(turn+1)%players.length;turnPocketed=0;placeStriker();renderScores();$('hint').textContent='دور '+players[turn].name+' — اسحب القرص للخلف ثم اتركه';if(mode==='bot'&&turn===1&&!gameOver)setTimeout(botShot,700);}
function pointerPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
canvas.addEventListener('pointerdown',e=>{if(!striker||shotMoving||gameOver||(mode==='bot'&&turn===1))return;const p=pointerPos(e);if(Math.hypot(p.x-striker.position.x,p.y-striker.position.y)<82){e.preventDefault();dragging=true;activePointerId=e.pointerId;aim=p;try{canvas.setPointerCapture(e.pointerId);}catch(_){}draw();}}, {passive:false});
canvas.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==activePointerId)return;e.preventDefault();aim=pointerPos(e);draw();}, {passive:false});
function releaseShot(e){if(!dragging||e.pointerId!==activePointerId)return;if(e.cancelable)e.preventDefault();const p=aim||pointerPos(e);dragging=false;activePointerId=null;aim=null;const dx=striker.position.x-p.x,dy=striker.position.y-p.y,len=Math.hypot(dx,dy);if(len<8){draw();return;}const power=Math.min(0.30,len*.0042);Sleeping.set(striker,false);Body.setVelocity(striker,{x:dx/len*power*60,y:dy/len*power*60});shotMoving=true;$('hint').textContent='القرص يتحرك...';}
canvas.addEventListener('pointerup',releaseShot,{passive:false});
canvas.addEventListener('pointercancel',releaseShot,{passive:false});
function botShot(){if(gameOver||turn!==1||mode!=='bot')return;const target=coins.find(c=>!c.pocketed&&c.gameType!=='queen')||coins.find(c=>!c.pocketed);if(!target)return;const dx=target.position.x-striker.position.x,dy=target.position.y-striker.position.y,len=Math.hypot(dx,dy)||1;Sleeping.set(striker,false);Body.setVelocity(striker,{x:dx/len*9,y:dy/len*9});shotMoving=true;$('hint').textContent='الكمبيوتر يسدد...';}
function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),1300);}
function back(){cancelAnimationFrame(raf);dragging=false;aim=null;setGameSwipeLock(false);$('game').classList.remove('show');$('setup').classList.add('show');}
$('striker-position').addEventListener('input',e=>{
 if(!striker||shotMoving||dragging||gameOver)return;
 const requested=Math.max(0,Math.min(100,Number(e.target.value)));
 const horizontal=count===2||turn%2===0;
 const fixed=horizontal?(turn%2===0?620:180):(turn%4===1?180:620);
 const wanted=baselinePosition(requested);
 const targetAxis=horizontal?'x':'y';
 const fixedAxis=horizontal?'y':'x';
 const radius=striker.circleRadius||28;
 // Search the entire baseline and choose the nearest unoccupied point.
 // This keeps the full usable line available instead of blocking the slider
 // merely because a coin lies somewhere between the old and new positions.
 let best=null,bestDistance=Infinity,bestValue=requested;
 for(let v=0;v<=100;v++){
  const p=baselinePosition(v);
  let clear=true;
  for(const coin of coins){
   if(coin.pocketed)continue;
   if(Math.hypot(p.x-coin.position.x,p.y-coin.position.y)<radius+(coin.circleRadius||18)+2){clear=false;break;}
  }
  if(!clear)continue;
  const d=Math.abs(p[targetAxis]-wanted[targetAxis]);
  if(d<bestDistance){best=p;bestDistance=d;bestValue=v;}
 }
 if(!best)best=wanted;
 Body.setPosition(striker,best);Sleeping.set(striker,false);Body.setVelocity(striker,{x:0,y:0});
 e.target.value=String(bestValue);
 draw();
});
$('start').onclick=startGame;$('back').onclick=()=>{if($('game').classList.contains('show'))back();else location.href='/mini-app';};$('reset').onclick=()=>{if(players.length){players.forEach(p=>p.score=0);turn=0;gameOver=false;resetBoard();renderScores();$('hint').textContent='مباراة جديدة — دور '+players[0].name;}};$('new').onclick=()=>{players.forEach(p=>p.score=0);turn=0;gameOver=false;resetBoard();renderScores();$('hint').textContent='بدأت مباراة جديدة';};$('change').onclick=()=>{if(shotMoving)return;turn=(turn+1)%players.length;placeStriker();renderScores();draw();};
if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
</script></body></html>
