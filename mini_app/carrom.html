function applyOnlineState(result){
 const previousMove=onlineState?.move_no;
 onlineState=result;remoteMotionActive=false;remoteAim=null;remoteMotionSeq=0;remoteMotionTargets=null;remoteStrikerTarget=null;remoteMotionNeedsSync=false;const previousCoins=coins.slice();count=result.players.length;fourMode=result.settings.team_mode||'individual';turn=result.turn_index;const seat=Math.max(0,Math.min(count-1,Number(result.you_player_index)||0));viewRotation=count===2?(seat===0?0:Math.PI):([-0,-Math.PI/2,Math.PI,Math.PI/2][seat]??0);
 players=result.players.map((p,i)=>({id:Number(p.id),name:p.name,color:i%2?'#eee4d0':'#242326',score:Number(result.scores?.[i]||0),forfeited:!!p.forfeited,team:fourMode==='teams'?i%2:undefined}));

 if(previousMove!==undefined&&result.move_no!==previousMove){const messages={queen_pocketed:'دخلت الملكة الحمراء! لازم تدخل قرص ثاني في الضربة القادمة لتثبيتها',queen_covered:'تم تثبيت الملكة الحمراء بنجاح! +50 نقطة',queen_returned:'ما دخلت قرص لتثبيت الملكة؛ رجعت الملكة للنص',last_coin_returned:'لازم تجيب الملكة أول؛ رجعنا آخر قرص إلى وسط الملعب',queen_pocketed_last_coin_returned:'دخلت الملكة! رجع آخر قرص إلى الوسط؛ غطِّ الملكة بضربة بعدها',striker_foul:'دخل المضرب! تم خصم 5 نقاط',turn_timeout:'انتهى وقت اللاعب وتم استبعاده من المباراة',player_withdrew:'انسحب اللاعب من المباراة'};const event=result.state.last_event;if(messages[event])toast(messages[event]);}

 const stamp=Number(m.sent_at||0);if(stamp&&stamp<=remoteMotionSeq)return;remoteMotionSeq=stamp||remoteMotionSeq+1;

function applyRemoteMotionFrame(){

function enforceBoardBounds(){

  const r=b.circleRadius||18,p=b.position,v=b.velocity;

function detectPockets(){

  }
 });
}
function finishTurn(){if(mode==='online'){submitOnlineShot();return;}clearLocalTurnTimer();if(strikerPocketed){players[turn].score=Math.max(0,players[turn].score-5);toast('دخل المضرب! -5 نقاط');if((collectedCoins[turn]||0)>0){collectedCoins[turn]--;addCoin(400,455,'#080808');toast('رجع قرص أسود إلى وسط الملعب');}}if(queenCoverShot){if(turnPocketed>0){players[turn].score+=50;toast('تم تثبيت الملكة! +50 نقطة');queenPendingCover=false;}else{addCoin(cx,cy,'#ed172b','queen');queenPendingCover=false;toast('الملكة رجعت بالنص ماجبت شي بعدها');}queenCoverShot=false;}if(queenPocketed){queenPendingCover=true;queenPocketed=false;}renderScores();if(coins.every(c=>c.pocketed)&&!queenPendingCover){gameOver=true;const winner=players.reduce((a,b)=>a.score>=b.score?a:b);const tied=players.filter(p=>p.score===winner.score).length>1;$('hint').textContent=tied?'انتهت المباراة بالتعادل 🤝':'انتهت المباراة — الفائز: '+winner.name+' 🏆';showCarromEndOverlay(tied?'':winner.name,tied,tied?'تعادل اللاعبان في النقاط.':('🏆 الفائز: '+winner.name+' — '+winner.score+' نقطة'));return;}if((turnPocketed===0&&!queenPendingCover)||strikerPocketed)turn=(turn+1)%players.length;turnPocketed=0;strikerPocketed=false;placeStriker();renderScores();$('hint').textContent='دور '+players[turn].name+' — اسحب القرص للخلف ثم اتركه';startLocalTurnTimer();if(mode==='bot'&&turn===1&&!gameOver)setTimeout(botShot,1500);}
let pocketAudio=null;function unlockPocketAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!pocketAudio)pocketAudio=new AC();if(pocketAudio.state==='suspended')pocketAudio.resume();}catch(_){}}function playPocketSound(){try{unlockPocketAudio();if(!pocketAudio)return;const t=pocketAudio.currentTime,master=pocketAudio.createGain();master.gain.setValueAtTime(.0001,t);master.gain.exponentialRampToValueAtTime(.42,t+.008);master.gain.exponentialRampToValueAtTime(.0001,t+.24);master.connect(pocketAudio.destination);const osc=pocketAudio.createOscillator(),g=pocketAudio.createGain();osc.type='triangle';osc.frequency.setValueAtTime(185,t);osc.frequency.exponentialRampToValueAtTime(72,t+.12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.65,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.16);osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+.17);const n=Math.floor(pocketAudio.sampleRate*.055),buf=pocketAudio.createBuffer(1,n,pocketAudio.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);const noise=pocketAudio.createBufferSource(),ng=pocketAudio.createGain();ng.gain.setValueAtTime(.0001,t);ng.gain.exponentialRampToValueAtTime(.18,t+.003);ng.gain.exponentialRampToValueAtTime(.0001,t+.055);noise.buffer=buf;noise.connect(ng);ng.connect(master);noise.start(t);noise.stop(t+.06);}catch(_){}}
function pointerPos(e){const r=canvas.getBoundingClientRect(),sx=(e.clientX-r.left)*W/r.width-W/2,sy=(e.clientY-r.top)*H/r.height-H/2,a=-viewRotation,co=Math.cos(a),si=Math.sin(a);return{x:W/2+sx*co-sy*si,y:H/2+sx*si+sy*co};}
canvas.addEventListener('pointerdown',e=>{if(!striker||strikerPlacementInvalid||shotMoving||gameOver||(mode==='bot'&&turn===1)||(mode==='online'&&!onlineState?.your_turn))return;unlockPocketAudio();const p=pointerPos(e);if(Math.hypot(p.x-striker.position.x,p.y-striker.position.y)<82){e.preventDefault();dragging=true;activePointerId=e.pointerId;aim=p;try{canvas.setPointerCapture(e.pointerId);}catch(_){}if(mode==='online')sendOnlineMotion();draw();}}, {passive:false});
canvas.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==activePointerId)return;e.preventDefault();aim=pointerPos(e);if(mode==='online')sendOnlineMotion();draw();}, {passive:false});
function releaseShot(e){if(!dragging||e.pointerId!==activePointerId)return;if(strikerPlacementInvalid){dragging=false;activePointerId=null;aim=null;draw();return;}if(e.cancelable)e.preventDefault();const p=pointerPos(e);dragging=false;activePointerId=null;aim=null;const dx=striker.position.x-p.x,dy=striker.position.y-p.y,len=Math.hypot(dx,dy);if(len<24){$('hint').textContent='ما ثبتّ التصويب — تقدر تسحب مرة ثانية وتعدّل اتجاهك';draw();return;}const pull=Math.min(1,len/240),speed=2.2+18.5*Math.pow(pull,1.5)+3*Math.pow(pull,6);Sleeping.set(striker,false);Body.setVelocity(striker,{x:dx/len*speed,y:dy/len*speed});queenCoverShot=queenPendingCover;shotMoving=true;$('hint').textContent='القرص يتحرك...';if(mode==='online')sendOnlineMotion();}
canvas.addEventListener('pointerup',releaseShot,{passive:false});
canvas.addEventListener('pointercancel',e=>{if(e.pointerId!==activePointerId)return;dragging=false;activePointerId=null;aim=null;draw();},{passive:false});
function pointSegmentDistance(px,py,ax,ay,bx,by){
 const dx=bx-ax,dy=by-ay,len2=dx*dx+dy*dy;
 const t=len2?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/len2)):0;
 return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function botLinePenalty(ax,ay,bx,by,excluded,extra=0){
 let penalty=0;
 for(const coin of coins){
  if(coin.pocketed||coin===excluded)continue;
  const clearance=pointSegmentDistance(coin.position.x,coin.position.y,ax,ay,bx,by);
  const needed=(coin.circleRadius||20)+extra;
  if(clearance<needed)penalty+=(needed-clearance)*1.8;
 }
 return penalty;
}
function findBotShot(){
 const regular=coins.filter(c=>!c.pocketed&&c.gameType!=='queen');
 const queen=coins.find(c=>!c.pocketed&&c.gameType==='queen');
 // Queen first when only one regular coin remains; cover the queen with a regular coin afterward.
 const pool=queen&&!queenPendingCover&&regular.length===1?[queen]:(regular.length?regular:(queen?[queen]:[]));
 if(!pool.length)return null;
 const pockets=[[77,77],[723,77],[77,723],[723,723]];
 const step=botDifficulty==='hard'?3:botDifficulty==='medium'?5:10;
 let best=null,bestScore=-Infinity;
 for(const target of pool){
  for(const pocket of pockets){
   const tx=target.position.x,ty=target.position.y;
   const px=pocket[0]-tx,py=pocket[1]-ty,pocketDistance=Math.hypot(px,py)||1;
   const ux=px/pocketDistance,uy=py/pocketDistance;
   const ghost={x:tx-ux*((target.circleRadius||20)+30+3),y:ty-uy*((target.circleRadius||20)+30+3)};
   if(ghost.x<95||ghost.x>705||ghost.y<95||ghost.y>705)continue;
   const potPenalty=botLinePenalty(tx,ty,pocket[0],pocket[1],target,5);
   for(let value=0;value<=100;value+=step){
    const position=baselinePosition(value);
    if(coins.some(c=>!c.pocketed&&Math.hypot(position.x-c.position.x,position.y-c.position.y)<(c.circleRadius||20)+32))continue;
    const approachDistance=Math.hypot(ghost.x-position.x,ghost.y-position.y);
    const approachPenalty=botLinePenalty(position.x,position.y,ghost.x,ghost.y,target,7);
    const score=-(approachDistance*.035)-(pocketDistance*.012)-(approachPenalty*2.8)-(potPenalty*3.2);
    if(score>bestScore){bestScore=score;best={position,ghost,target,pocket,value,score};}
   }
  }
 }
 return best;
}
function moveBotStriker(position){
 return new Promise(resolve=>{
  if(!striker){resolve();return;}
  const start={x:striker.position.x,y:striker.position.y},began=performance.now();
  const duration=botDifficulty==='easy'?260:botDifficulty==='hard'?520:400;
  const animate=now=>{
   if(gameOver||turn!==1||mode!=='bot'){resolve();return;}
   const t=Math.min(1,(now-began)/duration),ease=t*t*(3-2*t);
   Body.setPosition(striker,{x:start.x+(position.x-start.x)*ease,y:start.y+(position.y-start.y)*ease});
   Body.setVelocity(striker,{x:0,y:0});Sleeping.set(striker,false);updateStrikerPlacementState();draw();
   if(t<1)requestAnimationFrame(animate);else resolve();
  };
  requestAnimationFrame(animate);
 });
}
async function botShot(){
 if(gameOver||turn!==1||mode!=='bot'||shotMoving||!striker)return;
 const plan=findBotShot();
 if(!plan)return;
 // The bot visibly moves its striker to a legal point before taking the shot.
 await moveBotStriker(plan.position);
 if(gameOver||turn!==1||mode!=='bot'||!striker)return;
 if(strikerPlacementInvalid){placeStriker();return;}
 const sliderValue=Math.max(0,Math.min(100,Math.round((595-plan.position.x)/390*100)));
 $('striker-position').value=sliderValue;
 const dx=plan.ghost.x-striker.position.x,dy=plan.ghost.y-striker.position.y;
 const error=botDifficulty==='easy'?.12:botDifficulty==='medium'?.045:.012;
 const angle=Math.atan2(dy,dx)+(Math.random()-.5)*error;
 const speed=botDifficulty==='easy'?7.1:botDifficulty==='hard'?12.2:9.5;
 Sleeping.set(striker,false);Body.setVelocity(striker,{x:Math.cos(angle)*speed,y:Math.sin(angle)*speed});
 queenCoverShot=queenPendingCover;shotMoving=true;
 $('hint').textContent='البوت يحدد مكان التسديد ثم يصوّب...';
}
function clearLocalTurnTimer(){if(localTurnTimer){clearInterval(localTurnTimer);localTurnTimer=null;}localTurnDeadline=0;}
function startLocalTurnTimer(){clearLocalTurnTimer();/* الوقت محدد للأونلاين فقط؛ اللعب ضد البوت أو على نفس الجهاز بدون مؤقت. */return;}
function forfeitLocalTurn(timedOut=false){if(gameOver)return;clearLocalTurnTimer();gameOver=true;const winner=mode==='bot'?players[1]:players[(turn+1)%players.length];const message=timedOut?'انتهى وقت اللاعب ولم يلعب خلال 20 ثانية.':'انسحب اللاعب من المباراة.';$('hint').textContent=message+' الفائز: '+winner.name;showCarromEndOverlay(winner.name,false,message);}
function withdrawFromCarrom(){if(gameOver)return;if(mode==='online'){const button=$('withdraw');button.disabled=true;onlineApi('leave').then(applyOnlineState).catch(e=>toast(e.message)).finally(()=>{button.disabled=false;});return;}forfeitLocalTurn(false);}
function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),2000);}
function back(){clearLocalTurnTimer();cancelAnimationFrame(raf);dragging=false;aim=null;setGameSwipeLock(false);$('game').classList.remove('show');$('setup').classList.add('show');}
$('striker-position').addEventListener('input',e=>{
 if(!striker||shotMoving||dragging||gameOver||(mode==='online'&&!onlineState?.your_turn))return;
 const rawRequested=Math.max(0,Math.min(100,Number(e.target.value)));const reverseSlider=Math.abs(viewRotation)>Math.PI/2;const requested=reverseSlider?100-rawRequested:rawRequested;
 const target=baselinePosition(requested);
 Body.setPosition(striker,target);Sleeping.set(striker,false);Body.setVelocity(striker,{x:0,y:0});
 const blocked=updateStrikerPlacementState();
 /* Keep the player-turn hint unchanged; the persistent placement notice is shown above the board. */
 if(mode==='online'){onlinePositionDirty=true;sendOnlineMotion();}
 draw();
});
$('start').onclick=()=>{unlockPocketAudio();startGame();};$('back').onclick=()=>{if(mode==='online'){returnCarromToMenu();return;}if($('game').classList.contains('show'))back();else location.href='/mini-app';};$('reset').onclick=()=>{if(players.length){clearLocalTurnTimer();if(typeof window.clearOnlineEndOverlay==='function')window.clearOnlineEndOverlay();players.forEach(p=>p.score=0);turn=0;gameOver=false;resetBoard();renderScores();$('hint').textContent='مباراة جديدة — دور '+players[0].name;startLocalTurnTimer();}};$('new').onclick=()=>{clearLocalTurnTimer();if(typeof window.clearOnlineEndOverlay==='function')window.clearOnlineEndOverlay();players.forEach(p=>p.score=0);turn=0;gameOver=false;resetBoard();renderScores();$('hint').textContent='بدأت مباراة جديدة';startLocalTurnTimer();};$('withdraw').onclick=withdrawFromCarrom;$('change').onclick=()=>{if(shotMoving)return;turn=(turn+1)%players.length;placeStriker();renderScores();draw();};

if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
if(new URLSearchParams(location.search).get('online')==='1'&&onlineGameId){startOnlineCarrom();}
