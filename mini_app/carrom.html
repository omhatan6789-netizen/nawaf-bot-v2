const onlineGameId=new URLSearchParams(location.search).get('game_id')||'';let onlineState=null,onlinePollTimer=null,onlineSubmitting=false,onlineEndShown=false,gameEndCountdownTimer=null,viewRotation=0,onlineMotionTimer=null,onlineMotionInFlight=false,onlinePositionDirty=false,remoteMotionActive=false,remoteAim=null,remoteMotionSeq=0;

function showCarromEndOverlay(winnerName,isDraw,subtitle){
 if(onlineEndShown)return;onlineEndShown=true;if(onlineMotionTimer){clearInterval(onlineMotionTimer);onlineMotionTimer=null;}if(onlinePollTimer){clearTimeout(onlinePollTimer);onlinePollTimer=null;}

 document.head.append(style);const overlay=document.createElement('div');overlay.className='online-end-overlay';const card=document.createElement('div');card.className='online-end-card';const h=document.createElement('h2');h.textContent=isDraw?'🤝 انتهت اللعبة بالتعادل':'🎉 انتهت اللعبة!';const w=document.createElement('div');w.className='online-end-winner';w.textContent=isDraw?'تعادل بين اللاعبين':(winnerName||'انتهت اللعبة');const p=document.createElement('p');p.textContent=subtitle||(isDraw?'كانت مباراة حماسية! يعطيكم العافية 👏':'🏆 الفائز: '+winnerName);const actions=document.createElement('div');actions.className='online-end-actions';const close=document.createElement('button');close.textContent='قفل الصفحة';close.onclick=()=>{if(window.Telegram?.WebApp?.close)window.Telegram.WebApp.close();else returnCarromToMenu();};const home=document.createElement('button');home.textContent='الرجوع للقائمة الرئيسية';home.onclick=returnCarromToMenu;actions.append(close,home);card.append(h,w,p,actions);overlay.append(card);document.body.append(overlay);
 const soundReady=fetch('/api/game-end-sound?game_type=carrom').then(r=>r.json()).then(d=>d?.url?new Audio(d.url):null).catch(()=>null);
 gameEndCountdownTimer=setTimeout(()=>{const layer=document.createElement('div');layer.className='online-end-countdown';layer.style.cssText='position:fixed;inset:0;z-index:100001;display:flex;align-items:center;justify-content:center;padding:18px;background:#0008;backdrop-filter:blur(13px)';const box=document.createElement('div');box.style.cssText='width:min(100%,440px);padding:28px 20px;border:1px solid #ffffff70;border-radius:26px;background:#180d12;text-align:center';const label=document.createElement('div');label.textContent='سيتم اغلاق الصفحة بعد:';label.style.fontSize='24px';label.style.fontWeight='900';const num=document.createElement('div');num.style.cssText='font-size:112px;font-weight:1000';const home2=document.createElement('button');home2.className='primary';home2.textContent='الرجوع للقائمة الرئيسية';home2.onclick=returnCarromToMenu;box.append(label,num,home2);layer.append(box);document.body.append(layer);let n=5;const tick=()=>{if(!layer.isConnected)return;num.textContent=n;if(n<=1){gameEndCountdownTimer=setTimeout(()=>{if(window.Telegram?.WebApp?.close)window.Telegram.WebApp.close();else returnCarromToMenu();},1000);return;}n--;gameEndCountdownTimer=setTimeout(tick,1000);};soundReady.then(a=>a?.play().catch(()=>{}));tick();},3000);
}
function applyOnlineState(result){
 const previousMove=onlineState?.move_no;
 onlineState=result;remoteMotionActive=false;remoteAim=null;remoteMotionSeq=0;count=result.players.length;fourMode=result.settings.team_mode||'individual';turn=result.turn_index;const seat=Math.max(0,Math.min(count-1,Number(result.you_player_index)||0));viewRotation=count===2?(seat===0?0:Math.PI):([-0,-Math.PI/2,Math.PI,Math.PI/2][seat]??0);
 players=result.players.map((p,i)=>({id:Number(p.id),name:p.name,color:i%2?'#eee4d0':'#242326',score:Number(result.scores?.[i]||0),forfeited:!!p.forfeited,team:fourMode==='teams'?i%2:undefined}));
 clearWorld();addWalls();
 (result.state.discs||[]).forEach(d=>{const coin=addCoin(Number(d.x),Number(d.y),d.color,d.type);if(d.pocketed){coin.pocketed=true;World.remove(world,coin);}});
 const sp=result.state.striker||baselinePosition(50);striker=Bodies.circle(Number(sp.x),Number(sp.y),30,{label:'striker',restitution:.82,friction:.035,frictionAir:.016,density:.002});striker.gameColor='#d8a64f';striker.isStriker=true;World.add(world,striker);
 queenPendingCover=!!result.state.queen_pending_cover;queenPocketed=false;strikerPocketed=false;queenCoverShot=false;turnPocketed=0;shotMoving=false;gameOver=result.status==='finished';
 if(previousMove!==undefined&&result.move_no!==previousMove){const messages={queen_pocketed:'دخلت الملكة الحمراء! لازم تدخل قرص ثاني في الضربة القادمة لتثبيتها',queen_covered:'تم تثبيت الملكة الحمراء بنجاح! +50 نقطة',queen_returned:'ما دخلت قرص لتثبيت الملكة؛ رجعت الملكة للنص',last_coin_returned:'رجعنا آخر قرص للنص؛ لازم تدخل الملكة الحمراء ثم تغطيها بقرص آخر',striker_foul:'دخل المضرب! تم خصم 5 نقاط',turn_timeout:'انتهى وقت اللاعب وتم استبعاده من المباراة',player_withdrew:'انسحب اللاعب من المباراة'};const event=result.state.last_event;if(messages[event])toast(messages[event]);}
 renderScores();draw();
 const hint=$('hint');
 if(gameOver){if(onlineMotionTimer){clearInterval(onlineMotionTimer);onlineMotionTimer=null;}const teamGame=players.length===4&&fourMode==='teams';const winnerPlayerIndex=players.findIndex(p=>p.id===result.winner_id);const teamIndex=teamGame&&winnerPlayerIndex>=0?winnerPlayerIndex%2:-1;const winner=teamGame?null:players.find(p=>p.id===result.winner_id);const isDraw=!result.winner_id;const winnerName=teamGame&&teamIndex>=0?('الفريق '+(teamIndex===0?'الأول':'الثاني')+' ('+players[teamIndex].name+' و '+players[teamIndex+2].name+')'):(winner?.name||'');const high=teamGame?(teamIndex===0?players[0].score+players[2].score:players[1].score+players[3].score):Math.max(...players.map(p=>p.score));showCarromEndOverlay(winnerName,isDraw,isDraw?'انتهت المباراة بالتعادل.':('الفائز: '+winnerName+' — '+high+' نقطة'));hint.textContent='انتهت المباراة';}

}
async function startOnlineCarrom(){

}
function applyRemoteMotion(m){if(!m||Number(m.player_id)===Number(players[onlineState?.you_player_index||0]?.id))return;const stamp=Number(m.sent_at||0);if(stamp&&stamp<=remoteMotionSeq)return;remoteMotionSeq=stamp||remoteMotionSeq+1;(m.discs||[]).forEach((d,i)=>{const b=coins[i];if(!b)return;if(d.pocketed&&!b.pocketed){b.pocketed=true;World.remove(world,b);}else if(!d.pocketed&&b.pocketed){b.pocketed=false;World.add(world,b);}if(!b.pocketed){Body.setPosition(b,{x:+d.x,y:+d.y});Body.setAngle(b,+d.angle||0);Body.setVelocity(b,{x:0,y:0});}});if(striker&&m.striker){Body.setPosition(striker,{x:+m.striker.x,y:+m.striker.y});Body.setVelocity(striker,{x:0,y:0});}remoteAim=m.aim?{x:+m.aim.x,y:+m.aim.y}:null;remoteMotionActive=!!m.moving||!!remoteAim;draw();}

async function submitOnlineShot(){
 if(onlineSubmitting||!onlineState)return;
 if(onlineMotionTimer){clearInterval(onlineMotionTimer);onlineMotionTimer=null;}if(onlineMotionInFlight)await new Promise(resolve=>{const w=()=>onlineMotionInFlight?setTimeout(w,25):resolve();w();});

 try{
  const discs=coins.map(c=>({x:c.position.x,y:c.position.y,color:c.gameColor,type:c.gameType,pocketed:!!c.pocketed}));
  const result=await onlineApi('shot',{shot:{move_no:onlineState.move_no,discs,striker:{x:striker?.position.x||400,y:striker?.position.y||620},striker_pocketed:strikerPocketed}});
  applyOnlineState(result);
 }catch(e){

  try{applyOnlineState(await onlineApi('state'));}catch(stateError){toast(stateError.message||'تعذر تحديث حالة المباراة');}

function startGame(){ $('setup').classList.remove('show');$('game').classList.add('show');setGameSwipeLock(true);$('withdraw').hidden=false;count=2;players=[{name:'أنت',color:'#242326',score:0},{name:mode==='bot'?'البوت':'اللاعب الثاني',color:'#eee4d0',score:0}];turn=0;gameOver=false;resetBoard();renderScores();$('hint').textContent='اسحب القرص الضارب للخلف ثم اتركه للتسديد';startLocalTurnTimer();loop();}
function clearWorld(){World.clear(world,false);coins=[];striker=null;}
function addWalls(){/* الحدود تُدار باصطدامات دقيقة أدناه، مع فتحات الجيوب الأربع فقط. */}
function addCoin(x,y,color,type='coin'){const b=Bodies.circle(x,y,type==='queen'?21:20,{label:type,restitution:.88,friction:.035,frictionStatic:.12,frictionAir:.018,density:.0012,sleepThreshold:70});b.gameColor=color;b.gameType=type;b.pocketed=false;World.add(world,b);coins.push(b);return b;}
function resetBoard(){clearWorld();addWalls();const colors=['#080808','#f7f7f7'];addCoin(cx,cy,'#ed172b','queen');
 const rings=[{r:38,n:6,start:-Math.PI/2},{r:76,n:12,start:-Math.PI/2}];rings.forEach((ring,ri)=>{for(let i=0;i<ring.n;i++){const a=ring.start+i*Math.PI*2/ring.n+(ri?Math.PI/12:0);addCoin(cx+Math.cos(a)*ring.r,cy+Math.sin(a)*ring.r,colors[(i+ri)%2]);}});
 placeStriker();turnPocketed=0;strikerPocketed=false;queenPocketed=false;queenPendingCover=false;queenCoverShot=false;shotMoving=false;aim=null;draw();}
function baselinePosition(value=50){
 const v=Math.max(0,Math.min(100,Number(value)))/100;
 if(count===2)return {x:595-390*v,y:turn%2===0?620:180};
 const bases=[{x:595-390*v,y:620},{x:180,y:205+390*v},{x:595-390*v,y:180},{x:620,y:205+390*v}];
 return bases[turn%4];
}
function placeStriker(){
 if(striker)World.remove(world,striker);
 const slider=$('striker-position');if(slider)slider.value=50;
 const p=baselinePosition(50);
 striker=Bodies.circle(p.x,p.y,30,{label:'striker',restitution:.82,friction:.035,frictionAir:.016,density:.002});
 striker.gameColor='#d8a64f';striker.isStriker=true;World.add(world,striker);
}
function renderScores(){const el=$('scorebar');el.innerHTML='';if(mode==='online'){players.forEach((p,i)=>{const d=document.createElement('div');d.className='player'+(i===turn?' active':'');if(p.id){const im=document.createElement('img');im.src='/number-sort/avatar/'+p.id;im.alt='';im.style.cssText='width:25px;height:25px;border-radius:50%;vertical-align:middle;margin-left:5px';im.onerror=()=>im.remove();d.appendChild(im);}const name=document.createElement('strong');name.textContent=p.name;const score=document.createElement('span');score.textContent=p.forfeited?'مستبعد من المباراة':p.score+' نقطة';d.append(name,score);el.appendChild(d);if(i===0&&players.length===2){const vs=document.createElement('div');vs.className='vs';vs.textContent='VS';el.appendChild(vs);}});return;}if(players.length===4&&fourMode==='teams'){[0,1].forEach(team=>{const members=players.filter(p=>p.team===team),score=members.reduce((n,p)=>n+p.score,0),active=players[turn]?.team===team;const d=document.createElement('div');d.className='player'+(active?' active':'');d.innerHTML='<strong>'+(team===0?'الفريق الأول':'الفريق الثاني')+'</strong><span>'+score+' نقطة · '+members.map(p=>p.name.split(' · ').pop()).join(' و ')+'</span>';el.appendChild(d);});const vs=document.createElement('div');vs.className='vs';vs.textContent='VS';el.appendChild(vs);return;}players.forEach((p,i)=>{const d=document.createElement('div');d.className='player'+(i===turn?' active':'');d.innerHTML='<strong>'+p.name+'</strong><span>'+p.score+' نقطة</span>';el.appendChild(d);if(i===0&&players.length===2){const vs=document.createElement('div');vs.className='vs';vs.textContent='VS';el.appendChild(vs);}});if(players.length===4){const vs=document.createElement('div');vs.className='vs';vs.textContent='الدور '+(turn+1);el.appendChild(vs);}}
function drawBoard(){
 // Reproduction of the selected KOXTONS board markings.
 const frame=ctx.createLinearGradient(0,0,800,800);
 frame.addColorStop(0,'#161719');frame.addColorStop(.45,'#08090a');frame.addColorStop(1,'#242528');
 roundRect(ctx,8,8,784,784,30,frame,'#55575b',5);
 const bevel=ctx.createLinearGradient(0,20,0,780);
 bevel.addColorStop(0,'#424449');bevel.addColorStop(.5,'#090a0c');bevel.addColorStop(1,'#303237');
 roundRect(ctx,24,24,752,752,23,bevel,'#050506',4);
 const wood=ctx.createLinearGradient(70,55,730,745);
 wood.addColorStop(0,'#f3e4bd');wood.addColorStop(.5,'#ead6a8');wood.addColorStop(1,'#d9c18f');
 roundRect(ctx,48,48,704,704,9,wood,'#171719',3);

 // Red corner pocket rims.
 [[77,77],[723,77],[77,723],[723,723]].forEach(([x,y])=>{
  ctx.beginPath();ctx.arc(x,y,39,0,Math.PI*2);ctx.fillStyle='#090909';ctx.fill();
  ctx.lineWidth=9;ctx.strokeStyle='#c9152b';ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,27,0,Math.PI*2);ctx.strokeStyle='#4c4c4c';ctx.lineWidth=2;ctx.stroke();
 });

 // Slightly larger playing field: double parallel boundary lines closer to the corners.
 ctx.save();ctx.strokeStyle='#171717';ctx.lineWidth=3;
 ctx.strokeRect(145,145,510,510);
 ctx.lineWidth=1.7;ctx.strokeRect(157,157,486,486);
 ctx.restore();

 // Four baseline segments and their eight red base circles.
 const lines=[
  [[205,180],[595,180]],[[205,620],[595,620]],
  [[180,205],[180,595]],[[620,205],[620,595]]
 ];
 ctx.save();ctx.strokeStyle='#171717';ctx.lineWidth=2.5;
 lines.forEach(([a,b])=>{ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();});
 const markers=[[205,180],[595,180],[205,620],[595,620],[180,205],[180,595],[620,205],[620,595]];
 markers.forEach(([x,y])=>{
  ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.fillStyle='#c9152b';ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle='#171717';ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.strokeStyle='#f3d9bd';ctx.lineWidth=1.5;ctx.stroke();
 });
 ctx.restore();

 // Four diagonal arrows with the curved directional sweep shown on the reference board.
 const guides=[
  {x:205,y:205,dx:-1,dy:-1},
  {x:595,y:205,dx:1,dy:-1},
  {x:205,y:595,dx:-1,dy:1},
  {x:595,y:595,dx:1,dy:1}
 ];
 ctx.save();ctx.strokeStyle='#25201a';ctx.lineWidth=2.2;ctx.lineCap='round';
 guides.forEach(g=>{
  const sx=g.x+g.dx*5,sy=g.y+g.dy*5,ex=g.x+g.dx*105,ey=g.y+g.dy*105;
  ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
  const a=Math.atan2(ey-sy,ex-sx),n=11;
  ctx.beginPath();ctx.moveTo(ex,ey);
  ctx.lineTo(ex-n*Math.cos(a-.55),ey-n*Math.sin(a-.55));
  ctx.moveTo(ex,ey);ctx.lineTo(ex-n*Math.cos(a+.55),ey-n*Math.sin(a+.55));ctx.stroke();

 });
 ctx.restore();

 // Larger eight-point compass: four bold red diagonal rays and four slim black cardinal rays.
 ctx.save();ctx.translate(cx,cy);
 ctx.beginPath();ctx.arc(0,0,91,0,Math.PI*2);ctx.strokeStyle='#171717';ctx.lineWidth=2.7;ctx.stroke();
 ctx.beginPath();ctx.arc(0,0,70,0,Math.PI*2);ctx.strokeStyle='#171717';ctx.lineWidth=1.8;ctx.stroke();
 for(let i=0;i<8;i++){
  const a=-Math.PI/2+i*Math.PI/4;
  const red=i%2===1,outer=red?69:61,inner=13,half=red?11:8;
  ctx.beginPath();
  ctx.moveTo(Math.cos(a)*outer,Math.sin(a)*outer);
  ctx.lineTo(Math.cos(a+Math.PI/2)*half,Math.sin(a+Math.PI/2)*half);
  ctx.lineTo(Math.cos(a)*inner,Math.sin(a)*inner);
  ctx.lineTo(Math.cos(a-Math.PI/2)*half,Math.sin(a-Math.PI/2)*half);
  ctx.closePath();ctx.fillStyle=red?'#c9152b':'#171717';ctx.fill();
  ctx.strokeStyle='#171717';ctx.lineWidth=1.4;ctx.stroke();
 }
 ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fillStyle='#c9152b';ctx.fill();ctx.strokeStyle='#171717';ctx.lineWidth=2;ctx.stroke();
 ctx.restore();
}
function roundRect(c,x,y,w,h,r,fill,stroke,lw){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill();if(stroke){c.lineWidth=lw;c.strokeStyle=stroke;c.stroke();}}
function drawPiece(b){const {x,y}=b.position,r=b.circleRadius||15;ctx.save();ctx.translate(x,y);ctx.rotate(b.angle||0);ctx.shadowColor='#0008';ctx.shadowBlur=8;ctx.shadowOffsetY=4;const grad=ctx.createRadialGradient(-r*.35,-r*.42,r*.1,0,0,r*1.2);if(b.gameType==='queen'){grad.addColorStop(0,'#ff626d');grad.addColorStop(.25,'#f51d32');grad.addColorStop(.7,'#d90020');grad.addColorStop(1,'#8f0014');}else if(b.isStriker){grad.addColorStop(0,'#ffe6a6');grad.addColorStop(.4,'#d9a64e');grad.addColorStop(1,'#80501c');}else if(b.gameColor==='#080808'||b.gameColor==='#242326'){grad.addColorStop(0,'#444');grad.addColorStop(.22,'#171717');grad.addColorStop(.62,'#050505');grad.addColorStop(1,'#000');}else{grad.addColorStop(0,'#fff');grad.addColorStop(.28,'#f7f7f7');grad.addColorStop(.72,'#e4e4e4');grad.addColorStop(1,'#bdbdbd');}ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle=b.isStriker?'#fff0c0':'#fff8';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*.56,0,Math.PI*2);ctx.strokeStyle=b.isStriker?'#885d25':'#8c7257';ctx.lineWidth=1;ctx.stroke();if(b.gameType==='queen'){ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♛',0,1);}ctx.restore();}
function draw(){ctx.save();ctx.translate(W/2,H/2);ctx.rotate(viewRotation);ctx.translate(-W/2,-H/2);drawBoard();coins.filter(b=>!b.pocketed).forEach(drawPiece);if(striker&&!striker.pocketed)drawPiece(striker);const drawAim=aim||remoteAim;if(drawAim&&striker){const dx=striker.position.x-drawAim.x,dy=striker.position.y-drawAim.y,len=Math.hypot(dx,dy);if(len>=24){ctx.save();const ux=dx/len,uy=dy/len,shaft=Math.min(155,55+len*.6),tipX=striker.position.x+ux*shaft,tipY=striker.position.y+uy*shaft,head=34,half=21;ctx.lineCap='round';ctx.strokeStyle='#f4eee7';ctx.lineWidth=13;ctx.shadowColor='#000b';ctx.shadowBlur=13;ctx.beginPath();ctx.moveTo(striker.position.x+ux*33,striker.position.y+uy*33);ctx.lineTo(tipX-ux*head*.72,tipY-uy*head*.72);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#f4eee7';ctx.strokeStyle='#8e7866';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(tipX,tipY);ctx.lineTo(tipX-ux*head-uy*half,tipY-uy*head+ux*half);ctx.lineTo(tipX-ux*head+uy*half,tipY-uy*head-ux*half);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}}ctx.restore();}
function enforceBoardBounds(){
 const ps=[[77,77],[723,77],[77,723],[723,723]],bodies=[striker,...coins].filter(b=>b&&!b.pocketed);
 for(const b of bodies){
  const r=b.circleRadius||18,p=b.position,v=b.velocity;
  if(ps.some(([x,y])=>Math.hypot(p.x-x,p.y-y)<pocketR+8))continue;
  let x=p.x,y=p.y,vx=v.x,vy=v.y,hitX=false,hitY=false;
  const minX=inner.l+r,maxX=inner.r-r,minY=inner.t+r,maxY=inner.b-r;
  if(x<minX){x=minX;hitX=true;}else if(x>maxX){x=maxX;hitX=true;}
  if(y<minY){y=minY;hitY=true;}else if(y>maxY){y=maxY;hitY=true;}
  if(hitX||hitY){
   const speed=Math.hypot(vx,vy),bounce=.48+Math.min(.38,speed*.025);
   if(hitX){vx=-vx*bounce;vy*=.985;}
   if(hitY){vy=-vy*bounce;vx*=.985;}
   Body.setPosition(b,{x,y});Body.setVelocity(b,{x:vx,y:vy});Sleeping.set(b,false);
  }
 }
}
function loop(t){if(!document.getElementById('game').classList.contains('show'))return;const dt=Math.min(33,t-(lastT||t));lastT=t;if(!(mode==='online'&&!onlineState?.your_turn&&remoteMotionActive)){const step=(dt||16.67)/3;Engine.update(engine,step);Engine.update(engine,step);Engine.update(engine,step);detectPockets();enforceBoardBounds();}draw();if(!shotMoving&&striker&&striker.speed>.2)shotMoving=true;if(shotMoving&&allStopped()){shotMoving=false;finishTurn();}raf=requestAnimationFrame(loop);}
function allStopped(){return [striker,...coins].filter(b=>b&&!b.pocketed).every(b=>Math.abs(b.velocity.x)<.13&&Math.abs(b.velocity.y)<.13&&Math.abs(b.angularVelocity)<.02);}
function detectPockets(){const ps=[[77,77],[723,77],[77,723],[723,723]];[striker,...coins].filter(Boolean).forEach(b=>{if(b.pocketed)return;for(const [x,y] of ps){if(Math.hypot(b.position.x-x,b.position.y-y)<pocketR){b.pocketed=true;World.remove(world,b);playPocketSound();if(b===striker){strikerPocketed=true;setTimeout(()=>{placeStriker();draw();},180);}else if(b.gameType==='queen'){queenPocketed=true;toast('دخلت الملكة! لازم تدخل قرص أبيض أو أسود في الضربة القادمة');}else{turnPocketed++;const points=b.gameColor==='#080808'?5:10;if(mode!=='online')players[turn].score+=points;toast((points===5?'الأسود':'الأبيض')+' +'+points+' نقاط');}break;}}});}
function finishTurn(){if(mode==='online'){submitOnlineShot();return;}clearLocalTurnTimer();if(strikerPocketed){players[turn].score=Math.max(0,players[turn].score-5);toast('دخل المضرب! -5 نقاط');}if(queenCoverShot){if(turnPocketed>0){players[turn].score+=50;toast('تم تثبيت الملكة! +50 نقطة');queenPendingCover=false;}else{addCoin(cx,cy,'#ed172b','queen');queenPendingCover=false;toast('الملكة رجعت بالنص ماجبت شي بعدها');}queenCoverShot=false;}if(queenPocketed){queenPendingCover=true;queenPocketed=false;}renderScores();if(coins.every(c=>c.pocketed)&&!queenPendingCover){gameOver=true;const winner=players.reduce((a,b)=>a.score>=b.score?a:b);const tied=players.filter(p=>p.score===winner.score).length>1;$('hint').textContent=tied?'انتهت المباراة بالتعادل 🤝':'انتهت المباراة — الفائز: '+winner.name+' 🏆';showCarromEndOverlay(tied?'':winner.name,tied,tied?'تعادل اللاعبان في النقاط.':('🏆 الفائز: '+winner.name+' — '+winner.score+' نقطة'));return;}if((turnPocketed===0&&!queenPendingCover)||strikerPocketed)turn=(turn+1)%players.length;turnPocketed=0;strikerPocketed=false;placeStriker();renderScores();$('hint').textContent='دور '+players[turn].name+' — اسحب القرص للخلف ثم اتركه';startLocalTurnTimer();if(mode==='bot'&&turn===1&&!gameOver)setTimeout(botShot,700);}
let pocketAudio=null;function unlockPocketAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!pocketAudio)pocketAudio=new AC();if(pocketAudio.state==='suspended')pocketAudio.resume();}catch(_){}}function playPocketSound(){try{unlockPocketAudio();if(!pocketAudio)return;const t=pocketAudio.currentTime,master=pocketAudio.createGain();master.gain.setValueAtTime(.0001,t);master.gain.exponentialRampToValueAtTime(.42,t+.008);master.gain.exponentialRampToValueAtTime(.0001,t+.24);master.connect(pocketAudio.destination);const osc=pocketAudio.createOscillator(),g=pocketAudio.createGain();osc.type='triangle';osc.frequency.setValueAtTime(185,t);osc.frequency.exponentialRampToValueAtTime(72,t+.12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.65,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.16);osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+.17);const n=Math.floor(pocketAudio.sampleRate*.055),buf=pocketAudio.createBuffer(1,n,pocketAudio.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);const noise=pocketAudio.createBufferSource(),ng=pocketAudio.createGain();ng.gain.setValueAtTime(.0001,t);ng.gain.exponentialRampToValueAtTime(.18,t+.003);ng.gain.exponentialRampToValueAtTime(.0001,t+.055);noise.buffer=buf;noise.connect(ng);ng.connect(master);noise.start(t);noise.stop(t+.06);}catch(_){}}
function pointerPos(e){const r=canvas.getBoundingClientRect(),sx=(e.clientX-r.left)*W/r.width-W/2,sy=(e.clientY-r.top)*H/r.height-H/2,a=-viewRotation,co=Math.cos(a),si=Math.sin(a);return{x:W/2+sx*co-sy*si,y:H/2+sx*si+sy*co};}
canvas.addEventListener('pointerdown',e=>{if(!striker||shotMoving||gameOver||(mode==='bot'&&turn===1)||(mode==='online'&&!onlineState?.your_turn))return;unlockPocketAudio();const p=pointerPos(e);if(Math.hypot(p.x-striker.position.x,p.y-striker.position.y)<82){e.preventDefault();dragging=true;activePointerId=e.pointerId;aim=p;try{canvas.setPointerCapture(e.pointerId);}catch(_){}if(mode==='online')sendOnlineMotion();draw();}}, {passive:false});
canvas.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==activePointerId)return;e.preventDefault();aim=pointerPos(e);if(mode==='online')sendOnlineMotion();draw();}, {passive:false});
function releaseShot(e){if(!dragging||e.pointerId!==activePointerId)return;if(e.cancelable)e.preventDefault();const p=pointerPos(e);dragging=false;activePointerId=null;aim=null;const dx=striker.position.x-p.x,dy=striker.position.y-p.y,len=Math.hypot(dx,dy);if(len<24){$('hint').textContent='ما ثبتّ التصويب — تقدر تسحب مرة ثانية وتعدّل اتجاهك';draw();return;}const pull=Math.min(1,len/240),speed=2.2+14.5*Math.pow(pull,1.5)+2.3*Math.pow(pull,6);Sleeping.set(striker,false);Body.setVelocity(striker,{x:dx/len*speed,y:dy/len*speed});queenCoverShot=queenPendingCover;shotMoving=true;$('hint').textContent='القرص يتحرك...';if(mode==='online')sendOnlineMotion();}
canvas.addEventListener('pointerup',releaseShot,{passive:false});
canvas.addEventListener('pointercancel',e=>{if(e.pointerId!==activePointerId)return;dragging=false;activePointerId=null;aim=null;draw();},{passive:false});
function botShot(){if(gameOver||turn!==1||mode!=='bot')return;const target=coins.find(c=>!c.pocketed&&c.gameType!=='queen')||coins.find(c=>!c.pocketed);if(!target)return;const dx=target.position.x-striker.position.x,dy=target.position.y-striker.position.y,len=Math.hypot(dx,dy)||1;Sleeping.set(striker,false);Body.setVelocity(striker,{x:dx/len*9,y:dy/len*9});queenCoverShot=queenPendingCover;shotMoving=true;$('hint').textContent='البوت يسدد...';}
function clearLocalTurnTimer(){if(localTurnTimer){clearInterval(localTurnTimer);localTurnTimer=null;}localTurnDeadline=0;}
function startLocalTurnTimer(){clearLocalTurnTimer();if(mode==='online'||gameOver||(mode==='bot'&&turn===1))return;localTurnDeadline=Date.now()+20000;const tick=()=>{const left=Math.max(0,Math.ceil((localTurnDeadline-Date.now())/1000));$('hint').textContent='دور '+players[turn].name+' · باقي '+left+' ثانية';if(left<=0){clearLocalTurnTimer();forfeitLocalTurn(true);}};tick();localTurnTimer=setInterval(tick,250);}
function forfeitLocalTurn(timedOut=false){if(gameOver)return;clearLocalTurnTimer();gameOver=true;const winner=mode==='bot'?players[1]:players[(turn+1)%players.length];const message=timedOut?'انتهى وقت اللاعب ولم يلعب خلال 20 ثانية.':'انسحب اللاعب من المباراة.';$('hint').textContent=message+' الفائز: '+winner.name;showCarromEndOverlay(winner.name,false,message);}
function withdrawFromCarrom(){if(gameOver)return;if(mode==='online'){const button=$('withdraw');button.disabled=true;onlineApi('leave').then(applyOnlineState).catch(e=>toast(e.message)).finally(()=>{button.disabled=false;});return;}forfeitLocalTurn(false);}
function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),2000);}
function back(){clearLocalTurnTimer();cancelAnimationFrame(raf);dragging=false;aim=null;setGameSwipeLock(false);$('game').classList.remove('show');$('setup').classList.add('show');}
$('striker-position').addEventListener('input',e=>{
 if(!striker||shotMoving||dragging||gameOver||(mode==='online'&&!onlineState?.your_turn))return;
 const rawRequested=Math.max(0,Math.min(100,Number(e.target.value)));const reverseSlider=Math.abs(viewRotation)>Math.PI/2;const requested=reverseSlider?100-rawRequested:rawRequested;
 const horizontal=count===2||turn%2===0;
 const fixed=horizontal?(turn%2===0?620:180):(turn%4===1?180:620);
 const wanted=baselinePosition(requested);
 const targetAxis=horizontal?'x':'y';
 const fixedAxis=horizontal?'y':'x';
 const radius=striker.circleRadius||28;
 // Search the entire baseline and choose the nearest unoccupied point.
 // This keeps the full usable line available instead of blocking the slider
 // merely because a coin lies somewhere between the old and new positions.
 let best=null,bestDistance=Infinity,bestValue=requested;
 for(let v=0;v<=100;v++){
  const p=baselinePosition(v);
  let clear=true;
  for(const coin of coins){
   if(coin.pocketed)continue;
   if(Math.hypot(p.x-coin.position.x,p.y-coin.position.y)<radius+(coin.circleRadius||18)+2){clear=false;break;}
  }
  if(!clear)continue;
  const d=Math.abs(p[targetAxis]-wanted[targetAxis]);
  if(d<bestDistance){best=p;bestDistance=d;bestValue=v;}
 }
 if(!best)best=wanted;
 Body.setPosition(striker,best);Sleeping.set(striker,false);Body.setVelocity(striker,{x:0,y:0});
 e.target.value=String(reverseSlider?100-bestValue:bestValue);
 if(mode==='online'){onlinePositionDirty=true;sendOnlineMotion();}
 draw();
});
$('start').onclick=()=>{unlockPocketAudio();startGame();};$('back').onclick=()=>{if($('game').classList.contains('show'))back();else location.href='/mini-app';};$('reset').onclick=()=>{if(players.length){clearLocalTurnTimer();if(typeof window.clearOnlineEndOverlay==='function')window.clearOnlineEndOverlay();players.forEach(p=>p.score=0);turn=0;gameOver=false;resetBoard();renderScores();$('hint').textContent='مباراة جديدة — دور '+players[0].name;startLocalTurnTimer();}};$('new').onclick=()=>{clearLocalTurnTimer();if(typeof window.clearOnlineEndOverlay==='function')window.clearOnlineEndOverlay();players.forEach(p=>p.score=0);turn=0;gameOver=false;resetBoard();renderScores();$('hint').textContent='بدأت مباراة جديدة';startLocalTurnTimer();};$('withdraw').onclick=withdrawFromCarrom;$('change').onclick=()=>{if(shotMoving)return;turn=(turn+1)%players.length;placeStriker();renderScores();draw();};

if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
if(new URLSearchParams(location.search).get('online')==='1'&&onlineGameId){startOnlineCarrom();}
