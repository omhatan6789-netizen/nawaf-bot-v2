<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#35090d"><title>كيرم | بوت نواف</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<style>
:root{color-scheme:dark;--red:#b81728;--gold:#e5bb76}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#17090b;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh;background:radial-gradient(ellipse at 50% 0,#78121b,#24090d 58%,#100709);padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);touch-action:pan-y}
.app{width:min(100%,560px);margin:auto;padding:10px 0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.brand{font-weight:950;font-size:21px;letter-spacing:.2px}.brand small{display:block;color:#ffffff80;font-size:10px;font-weight:650;letter-spacing:1.8px}
.pill{border:1px solid #ffffff30;background:#ffffff12;color:#fff;border-radius:30px;padding:8px 12px;font-weight:800}
.panel{border:1px solid #ffffff22;background:linear-gradient(145deg,#ffffff13,#09040670);border-radius:20px;padding:15px;box-shadow:0 12px 30px #0005}
h1{font-size:26px;margin:4px 0 5px;text-align:center} .sub{text-align:center;color:#ffffff9a;font-size:13px;margin:0 0 16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid #ffffff35;border-radius:15px;background:#17090c;color:#fff;padding:14px 8px;min-height:65px;font-weight:850;font-size:15px}.choice.active{border-color:#ff9ba3;background:linear-gradient(135deg,#a81321,#4d0a11);box-shadow:0 0 0 2px #ff5b672b}
.primary,.secondary{width:100%;border:0;border-radius:14px;min-height:52px;margin-top:12px;font-size:16px;font-weight:900}.primary{background:linear-gradient(135deg,#ef4858,#9e0d1c);color:#fff;box-shadow:0 4px 0 #560811}.secondary{background:#ffffff13;color:#fff;border:1px solid #ffffff30}
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}
.player{border:1px solid #ffffff28;background:#110709a8;border-radius:14px;padding:9px 10px;min-width:0}.player.active{border-color:#ffbd78;box-shadow:0 0 0 2px #ffbd7825}.player strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.player span{font-size:11px;color:#ffffff9a}
.vs{font-size:11px;color:#ffffff70;font-weight:900}
.board-wrap{position:relative;width:min(100%,430px);margin:0 auto;filter:drop-shadow(0 13px 18px #0009)}
#board{display:block;width:100%;height:auto;aspect-ratio:700/900;touch-action:none;border-radius:18px}
.hint{text-align:center;color:#ffffff9b;font-size:12px;min-height:22px;margin:9px 0 0}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.controls button{border:1px solid #ffffff30;background:#ffffff12;color:#fff;border-radius:12px;min-height:43px;font-weight:800}
#setup,#game{display:none}#setup.show,#game.show{display:block}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 15px);transform:translateX(-50%);background:#16090c;border:1px solid #ffffff40;border-radius:14px;padding:12px 17px;z-index:9;box-shadow:0 8px 30px #0009;max-width:90%;text-align:center}
@media(min-height:850px){.board-wrap{width:min(100%,470px)}}
</style></head>
<body><main class="app">
<header class="top"><button class="pill" id="back">رجوع</button><div class="brand">كيرم <small>NAWAF GAME</small></div><button class="pill" id="reset">إعادة</button></header>
<section id="setup" class="panel show"><h1>كيرم 🎯</h1><p class="sub">اختر طريقة اللعب وعدد اللاعبين</p>
<div class="sub">طريقة اللعب</div><div class="choices" id="modes">
<button class="choice active" data-mode="bot">🤖 ضد الكمبيوتر</button><button class="choice" data-mode="local">👥 لاعبين على نفس الجهاز</button>
</div>
<div class="sub" style="margin-top:16px">عدد اللاعبين</div><div class="choices" id="counts">
<button class="choice active" data-count="2">لاعبان</button><button class="choice" data-count="4">أربعة لاعبين</button>
</div>
<button class="primary" id="start">ابدأ اللعب</button>
<p class="sub" style="margin:12px 0 0">اللعب أونلاين بالغرف قيد بناء نظام المزامنة الخاص به.</p></section>
<section id="game"><div class="scorebar" id="scorebar"></div><div class="board-wrap"><canvas id="board" width="700" height="900"></canvas></div><div class="hint" id="hint">اسحب من القرص الضارب للخلف ثم اتركه للتسديد</div><div class="controls"><button id="change">تبديل اللاعب</button><button id="new">مباراة جديدة</button></div></section>
</main>
<script>
const {Engine,World,Bodies,Body,Events}=Matter;
const $=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d');
const W=700,H=900,engine=Engine.create({enableSleeping:true}),world=engine.world;
engine.gravity.x=0;engine.gravity.y=0;engine.positionIterations=8;engine.velocityIterations=8;engine.constraintIterations=4;
let mode='bot',count=2,players=[],turn=0,coins=[],striker=null,aim=null,dragging=false,shotMoving=false,turnPocketed=0,queenPocketed=false,gameOver=false,lastT=0,raf=0;
const cx=350,cy=450,inner={l:64,r:636,t:64,b:836},pocketR=39;
function choose(group,attr,val){document.querySelectorAll('#'+group+' .choice').forEach(b=>b.classList.toggle('active',b.dataset[attr]===val));}
$('modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;choose('modes','mode',mode)};
$('counts').onclick=e=>{const b=e.target.closest('[data-count]');if(!b)return;count=Number(b.dataset.count);choose('counts','count',String(count))};
function startGame(){ $('setup').classList.remove('show');$('game').classList.add('show');players=count===2?[{name:'أنت',color:'#242326',score:0},{name:mode==='bot'?'الكمبيوتر':'اللاعب الثاني',color:'#eee4d0',score:0}]:[{name:'أنت',color:'#242326',score:0},{name:'اللاعب 2',color:'#eee4d0',score:0},{name:'اللاعب 3',color:'#242326',score:0},{name:'اللاعب 4',color:'#eee4d0',score:0}];turn=0;gameOver=false;resetBoard();renderScores();$('hint').textContent='اسحب القرص الضارب للخلف ثم اتركه للتسديد';loop();}
function clearWorld(){World.clear(world,false);coins=[];striker=null;}
function addWalls(){const t=26,L=inner.l,R=inner.r,T=inner.t,B=inner.b,gap=92;
 const rect=(x,y,w,h)=>World.add(world,Bodies.rectangle(x,y,w,h,{isStatic:true,restitution:.78,friction:.08}));
 rect((L+R)/2,T,R-L-2*gap,t);rect((L+R)/2,B,R-L-2*gap,t);
 rect(L,(T+B)/2,t,B-T-2*gap);rect(R,(T+B)/2,t,B-T-2*gap);
 rect(L+gap/2,T+gap/2,gap,t);rect(R-gap/2,T+gap/2,gap,t);
}
function addCoin(x,y,color,type='coin'){const b=Bodies.circle(x,y,type==='queen'?16:15,{label:type,restitution:.88,friction:.035,frictionStatic:.12,frictionAir:.018,density:.0012,sleepThreshold:70});b.gameColor=color;b.gameType=type;b.pocketed=false;World.add(world,b);coins.push(b);return b;}
function resetBoard(){clearWorld();addWalls();const colors=['#272629','#eee5d3'];addCoin(cx,cy,'#c91e32','queen');
 const rings=[{r:34,n:6,start:-Math.PI/2},{r:68,n:12,start:-Math.PI/2}];rings.forEach((ring,ri)=>{for(let i=0;i<ring.n;i++){const a=ring.start+i*Math.PI*2/ring.n+(ri?Math.PI/12:0);addCoin(cx+Math.cos(a)*ring.r,cy+Math.sin(a)*ring.r,colors[(i+ri)%2]);}});
 placeStriker();turnPocketed=0;queenPocketed=false;shotMoving=false;aim=null;draw();}
function baselineY(){return turn%2===0?760:140}
function placeStriker(){if(striker)World.remove(world,striker);striker=Bodies.circle(cx,baselineY(),23,{label:'striker',restitution:.82,friction:.035,frictionAir:.016,density:.002});striker.gameColor='#d8a64f';striker.isStriker=true;World.add(world,striker);}
function renderScores(){const el=$('scorebar');el.innerHTML='';players.forEach((p,i)=>{const d=document.createElement('div');d.className='player'+(i===turn?' active':'');d.innerHTML='<strong>'+p.name+'</strong><span>'+p.score+' نقطة</span>';el.appendChild(d);if(i===0&&players.length===2){const vs=document.createElement('div');vs.className='vs';vs.textContent='VS';el.appendChild(vs);}});if(players.length===4){const vs=document.createElement('div');vs.className='vs';vs.textContent='الدور '+(turn+1);el.appendChild(vs);}}
function drawBoard(){const g=ctx.createLinearGradient(35,35,660,870);g.addColorStop(0,'#7d3d20');g.addColorStop(.5,'#35170f');g.addColorStop(1,'#1d0b08');roundRect(ctx,18,18,664,864,28,g,'#c28a50',8);
 const wood=ctx.createLinearGradient(65,60,630,840);wood.addColorStop(0,'#f5d5a1');wood.addColorStop(.5,'#d9a66e');wood.addColorStop(1,'#c88e56');roundRect(ctx,55,55,590,790,18,wood,'#6e351c',12);
 ctx.save();ctx.strokeStyle='#8e4d2d';ctx.lineWidth=3;ctx.strokeRect(102,102,496,696);ctx.strokeStyle='#a64d37';ctx.lineWidth=2;ctx.strokeRect(125,125,450,650);
 ctx.beginPath();ctx.arc(cx,cy,100,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,72,0,Math.PI*2);ctx.stroke();
 for(let i=0;i<4;i++){const a=i*Math.PI/2+Math.PI/4;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*102,cy+Math.sin(a)*102);ctx.lineTo(cx+Math.cos(a)*255,cy+Math.sin(a)*255);ctx.stroke();}
 [[105,105],[595,105],[105,795],[595,795]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,50,0,Math.PI*2);ctx.fillStyle='#210d09';ctx.fill();ctx.strokeStyle='#d5a15f';ctx.lineWidth=6;ctx.stroke();ctx.beginPath();ctx.arc(x,y,39,0,Math.PI*2);ctx.fillStyle='#050303';ctx.fill();});
 ctx.strokeStyle='#9b4d31';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(190,760);ctx.lineTo(510,760);ctx.moveTo(190,140);ctx.lineTo(510,140);ctx.stroke();ctx.restore();}
function roundRect(c,x,y,w,h,r,fill,stroke,lw){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill();if(stroke){c.lineWidth=lw;c.strokeStyle=stroke;c.stroke();}}
function drawPiece(b){const {x,y}=b.position,r=b.circleRadius||15;ctx.save();ctx.translate(x,y);ctx.rotate(b.angle||0);ctx.shadowColor='#0008';ctx.shadowBlur=8;ctx.shadowOffsetY=4;const grad=ctx.createRadialGradient(-r*.35,-r*.42,r*.1,0,0,r*1.2);if(b.gameType==='queen'){grad.addColorStop(0,'#ff9da6');grad.addColorStop(.35,'#df3346');grad.addColorStop(1,'#780b1a');}else if(b.isStriker){grad.addColorStop(0,'#ffe6a6');grad.addColorStop(.4,'#d9a64e');grad.addColorStop(1,'#80501c');}else if(b.gameColor==='#272629'){grad.addColorStop(0,'#777');grad.addColorStop(.4,'#343235');grad.addColorStop(1,'#09090a');}else{grad.addColorStop(0,'#fffdf4');grad.addColorStop(.5,'#e6ddca');grad.addColorStop(1,'#a99b83');}ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle=b.isStriker?'#fff0c0':'#fff8';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*.56,0,Math.PI*2);ctx.strokeStyle=b.isStriker?'#885d25':'#8c7257';ctx.lineWidth=1;ctx.stroke();if(b.gameType==='queen'){ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♛',0,1);}ctx.restore();}
function draw(){drawBoard();coins.filter(b=>!b.pocketed).forEach(drawPiece);if(striker&&!striker.pocketed)drawPiece(striker);if(aim&&striker){ctx.save();ctx.strokeStyle='#fff4d0';ctx.lineWidth=4;ctx.setLineDash([9,8]);ctx.beginPath();ctx.moveTo(striker.position.x,striker.position.y);ctx.lineTo(aim.x,aim.y);ctx.stroke();ctx.setLineDash([]);const dx=striker.position.x-aim.x,dy=striker.position.y-aim.y,len=Math.hypot(dx,dy)||1;ctx.strokeStyle='#ffd27a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(striker.position.x,striker.position.y);ctx.lineTo(striker.position.x+dx/len*100,striker.position.y+dy/len*100);ctx.stroke();ctx.restore();}}
function loop(t){if(!document.getElementById('game').classList.contains('show'))return;const dt=Math.min(33,t-(lastT||t));lastT=t;Engine.update(engine,dt||16.67);detectPockets();draw();if(!shotMoving&&striker&&striker.speed>.2)shotMoving=true;if(shotMoving&&allStopped()){shotMoving=false;finishTurn();}raf=requestAnimationFrame(loop);}
function allStopped(){return [striker,...coins].filter(b=>b&&!b.pocketed).every(b=>Math.abs(b.velocity.x)<.13&&Math.abs(b.velocity.y)<.13&&Math.abs(b.angularVelocity)<.02);}
function detectPockets(){const ps=[[105,105],[595,105],[105,795],[595,795]];[striker,...coins].filter(Boolean).forEach(b=>{if(b.pocketed)return;for(const [x,y] of ps){if(Math.hypot(b.position.x-x,b.position.y-y)<pocketR){b.pocketed=true;World.remove(world,b);if(b===striker){setTimeout(()=>{placeStriker();draw();},180);}else{turnPocketed++;if(b.gameType==='queen')queenPocketed=true;else players[turn].score+=b.gameColor==='#272629'?1:1;toast(b.gameType==='queen'?'دخلت الملكة!':'قرص في الجيب +1');}break;}}});}
function finishTurn(){if(queenPocketed){players[turn].score+=3;queenPocketed=false;}renderScores();if(coins.every(c=>c.pocketed)){const winner=players.reduce((a,b)=>a.score>=b.score?a:b);gameOver=true;$('hint').textContent='انتهت المباراة — الفائز: '+winner.name+' 🏆';return;}if(turnPocketed===0)turn=(turn+1)%players.length;turnPocketed=0;placeStriker();renderScores();$('hint').textContent='دور '+players[turn].name+' — اسحب القرص للخلف ثم اتركه';if(mode==='bot'&&turn===1&&!gameOver)setTimeout(botShot,700);}
function pointerPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
canvas.addEventListener('pointerdown',e=>{if(!striker||shotMoving||gameOver||(mode==='bot'&&turn===1))return;const p=pointerPos(e);if(Math.hypot(p.x-striker.position.x,p.y-striker.position.y)<58){dragging=true;aim=p;canvas.setPointerCapture(e.pointerId);draw();}});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;aim=pointerPos(e);draw();});
canvas.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;const p=pointerPos(e),dx=striker.position.x-p.x,dy=striker.position.y-p.y,len=Math.hypot(dx,dy);aim=null;if(len<8){draw();return;}const power=Math.min(0.22,len*.0027);Body.setVelocity(striker,{x:dx/len*power*60,y:dy/len*power*60});shotMoving=true;$('hint').textContent='القرص يتحرك...';});
function botShot(){if(gameOver||turn!==1||mode!=='bot')return;const target=coins.find(c=>!c.pocketed&&c.gameType!=='queen')||coins.find(c=>!c.pocketed);if(!target)return;const dx=target.position.x-striker.position.x,dy=target.position.y-striker.position.y,len=Math.hypot(dx,dy)||1;Body.setVelocity(striker,{x:dx/len*7,y:dy/len*7});shotMoving=true;$('hint').textContent='الكمبيوتر يسدد...';}
function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),1300);}
function back(){cancelAnimationFrame(raf);$('game').classList.remove('show');$('setup').classList.add('show');}
$('start').onclick=startGame;$('back').onclick=()=>{if($('game').classList.contains('show'))back();else location.href='/mini-app';};$('reset').onclick=()=>{if(players.length){players.forEach(p=>p.score=0);turn=0;gameOver=false;resetBoard();renderScores();$('hint').textContent='مباراة جديدة — دور '+players[0].name;}};$('new').onclick=()=>{players.forEach(p=>p.score=0);turn=0;gameOver=false;resetBoard();renderScores();$('hint').textContent='بدأت مباراة جديدة';};$('change').onclick=()=>{if(shotMoving)return;turn=(turn+1)%players.length;placeStriker();renderScores();draw();};
if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
</script></body></html>
