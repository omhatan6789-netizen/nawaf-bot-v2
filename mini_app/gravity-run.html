<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#69b5f5"><title>Gravity Run</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#26334f;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}#game{display:block;width:100vw;height:100dvh}.top{position:fixed;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:3;pointer-events:none}.pill{background:#fff;color:#27334d;border:2px solid #111;border-radius:30px;padding:7px 13px;font-weight:900;font-size:13px;box-shadow:0 3px 0 #0004}.exit{pointer-events:auto;border:2px solid #111;background:#fff;color:#333;border-radius:25px;padding:8px 16px;font-weight:950}.bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:12px;right:12px;text-align:center;color:#fff;font-weight:900;text-shadow:0 2px 4px #0009;font-size:13px;pointer-events:none}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1118;z-index:5}.panel{width:min(90vw,370px);max-height:88dvh;overflow:auto;padding:21px;border:3px solid #111;border-radius:24px;background:#fff8d8;color:#242424;text-align:center;box-shadow:0 8px 0 #0005}.panel h1{margin:0 0 8px;font-size:27px}.panel p{font-size:14px;font-weight:700;line-height:1.6}.panel button{width:100%;border:2px solid #111;border-radius:14px;background:#43b96a;color:#fff;font-size:17px;font-weight:950;padding:12px;margin-top:9px;box-shadow:0 4px 0 #17572c}.panel button.alt{background:#258ed0;box-shadow:0 4px 0 #14527a}.panel button.gray{background:#6b7280;box-shadow:0 4px 0 #374151}.counts{display:flex;gap:7px;margin:12px 0}.counts button{margin:0;padding:10px 0;flex:1;background:#fff;color:#222;box-shadow:0 3px 0 #777}.counts button.selected{background:#ffdc64;outline:3px solid #222}.hide{display:none!important}.hint{font-size:12px;color:#555;font-weight:700;margin-top:9px}.modeTitle{font-weight:950;margin:15px 0 6px}</style></head><body><canvas id="game"></canvas><div class="top"><div class="pill" id="stage">🌿 الطبيعة</div><button class="exit" id="exit">خروج</button><div class="pill" id="alive">2/2</div></div><div class="bottom" id="hint">اضغط لقلب الجاذبية • تجنّب الحواجز والمسامير</div>
<div class="overlay" id="intro"><div class="panel"><h1>Gravity Run</h1><p>اختر الطور قبل بدء السباق</p><button id="botMode">🤖 ضد البوت</button><button class="alt" id="onlineMode">🌐 أونلاين</button><div class="hint">بعد اختيار الطور اضغط ابدأ، ولن يبدأ السباق قبلها.</div></div></div>
<div class="overlay hide" id="setup"><div class="panel"><h1 id="setupTitle">ضد البوت</h1><p id="setupDesc">أنت الأحمر والبوت الأزرق</p><div id="countWrap" class="hide"><div class="modeTitle">عدد اللاعبين</div><div class="counts" id="counts"><button data-count="2" class="selected">2</button><button data-count="3">3</button><button data-count="4">4</button><button data-count="5">5</button></div><div id="colorPreview" class="hint">🔴 أحمر　🔵 أزرق</div></div><button id="play">ابدأ السباق</button><button class="gray" id="back">رجوع</button></div></div>
<div class="overlay hide" id="result"><div class="panel"><h1 id="resultTitle">انتهى السباق</h1><p id="resultText"></p><button id="again">العب مرة أخرى</button><button class="gray" id="home">القائمة الرئيسية</button></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');let W=0,H=0,dpr=1,raf=0,run=false,dist=0,last=0,players=[],obstacles=[],stageIndex=0,mode='bot',count=2,finished=false,startedAt=0;
const palette=[{c:'#f0444f',name:'الأحمر'},{c:'#159fe8',name:'الأزرق'},{c:'#39bd68',name:'الأخضر'},{c:'#ffca36',name:'الأصفر'},{c:'#9a68d5',name:'البنفسجي'}];
const stages=[{name:'🌿 الطبيعة',bg:'#e5f6c6',wall:'#9b573e',edge:'#39bf63',dark:'#713f3a',deco:'#c9e99e'},{name:'🏜️ الصحراء',bg:'#fff09e',wall:'#a85a3f',edge:'#ff9f27',dark:'#713f3a',deco:'#ffe17a'},{name:'❄️ الثلج',bg:'#72b9f6',wall:'#48577f',edge:'#8589b6',dark:'#353f62',deco:'#9bd6ff'}];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cvs.width=W*dpr;cvs.height=H*dpr;cvs.style.width=W+'px';cvs.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function show(id){['intro','setup','result'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id))}
function setMode(m){mode=m;document.getElementById('setupTitle').textContent=m==='bot'?'ضد البوت':'لعب أونلاين';document.getElementById('setupDesc').textContent=m==='bot'?'أنت الأحمر 🤜 والبوت الأزرق 🤖':'اختر عدد اللاعبين وألوانهم';document.getElementById('countWrap').classList.toggle('hide',m!=='online');document.getElementById('play').textContent=m==='bot'?'ابدأ اللعب':'معاينة السباق';show('setup')}
function updatePreview(){const names=palette.slice(0,count).map(x=>x.c==='x'?'':x.name);document.getElementById('colorPreview').innerHTML=names.map((n,i)=>'<span style="color:'+palette[i].c+'">●</span> '+n).join('　')}
document.querySelectorAll('#counts button').forEach(b=>b.onclick=()=>{count=Number(b.dataset.count);document.querySelectorAll('#counts button').forEach(x=>x.classList.toggle('selected',x===b));updatePreview()});
function reset(){dist=0;stageIndex=0;finished=false;const n=mode==='bot'?2:count;players=palette.slice(0,n).map((p,i)=>({id:i,x:i%2?1:0,y:H*.49+(i-(n-1)/2)*Math.min(30,H*.035),alive:true,color:p.c,name:p.name,progress:0,ai:i!==0,flip:0,finish:false}));obstacles=[];for(let i=0;i<36;i++)obstacles.push({worldY:1250+i*520,side:i%2,kind:i%9===4?'spike':i%9===7?'crate':'block',gap:i%7===5});document.getElementById('alive').textContent=n+'/'+n;document.getElementById('stage').textContent=stages[0].name}
function drawBackground(st){ctx.fillStyle=st.bg;ctx.fillRect(0,0,W,H);for(let i=0;i<10;i++){const x=(i*113+35)%W,y=(i*167+dist*.16)%H;ctx.fillStyle=st.deco;ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(x,y,12+(i%3)*9,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}ctx.fillStyle=st.wall;ctx.fillRect(0,0,W*.12,H);ctx.fillRect(W*.88,0,W*.12,H);ctx.fillStyle=st.edge;ctx.fillRect(W*.12,0,9,H);ctx.fillRect(W*.88-9,0,9,H);ctx.strokeStyle='#111';ctx.lineWidth=5;ctx.strokeRect(W*.12,0,W*.76,H);for(let y=-20;y<H+30;y+=19)for(const x of [W*.12+3,W*.88-3]){ctx.fillStyle=st.edge;ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle=st.dark;ctx.lineWidth=2;ctx.stroke()}}
function obstacleY(o){return H-(o.worldY-dist)}
function drawObstacle(o,st){const y=obstacleY(o);if(y<-90||y>H+90)return;const x0=W*.12+9,x1=W*.88-9,w=Math.max(42,W*.18),h=o.kind==='spike'?27:Math.max(45,H*.065),x=o.side?x1-w:x0;if(o.gap){ctx.fillStyle=st.dark;ctx.fillRect(o.side?x1-4:x0-4,y-10,6,h+20);return}ctx.fillStyle=o.kind==='crate'?'#ad5b4d':st.dark;ctx.strokeStyle='#080808';ctx.lineWidth=4;ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);if(o.kind==='crate'){ctx.strokeStyle='#733c35';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+4,y+4);ctx.lineTo(x+w-4,y+h-4);ctx.moveTo(x+w-4,y+4);ctx.lineTo(x+4,y+h-4);ctx.stroke()}if(o.kind==='spike'){ctx.fillStyle='#e9f7ff';ctx.beginPath();for(let k=0;k<4;k++){ctx.moveTo(x+k*w/4,y+h);ctx.lineTo(x+(k+.5)*w/4,y);ctx.lineTo(x+(k+1)*w/4,y+h)}ctx.fill();ctx.stroke()}}
function drawCharacter(p){if(!p.alive)return;const x=p.x===0?W*.18:W*.82;ctx.save();ctx.translate(x,p.y);ctx.rotate(p.x===0?Math.PI/2:-Math.PI/2);ctx.lineJoin='round';ctx.lineCap='round';
 // tiny cartoon runner: white face/body, thick dark outline, colored headband and yellow pack
 ctx.fillStyle='#fff';ctx.strokeStyle='#080808';ctx.lineWidth=4;
 ctx.beginPath();ctx.ellipse(0,0,17,19,0,0,Math.PI*2);ctx.fill();ctx.stroke();
 // little yellow backpack / shoes
 ctx.fillStyle='#ffd32e';ctx.beginPath();ctx.moveTo(-13,7);ctx.lineTo(-25,4);ctx.lineTo(-21,15);ctx.lineTo(-9,15);ctx.closePath();ctx.fill();ctx.stroke();
 // arms
 ctx.strokeStyle='#080808';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-7,-9);ctx.lineTo(-16,-15);ctx.moveTo(7,-9);ctx.lineTo(16,-15);ctx.stroke();
 ctx.strokeStyle=p.color;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-16,-15);ctx.lineTo(-10,-10);ctx.moveTo(16,-15);ctx.lineTo(10,-10);ctx.stroke();
 // eyes
 ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-5,-3,2.5,0,Math.PI*2);ctx.arc(5,-3,2.5,0,Math.PI*2);ctx.fill();
 // signature colored band across lower face
 ctx.fillStyle=p.color;ctx.strokeStyle='#080808';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-19,6,38,8,3);ctx.fill();ctx.stroke();
 ctx.restore();ctx.fillStyle='#fff';ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.strokeText(p.name,x,p.y-28);ctx.fillText(p.name,x,p.y-28)}
function nearestObstacle(p){return obstacles.find(o=>Math.abs(obstacleY(o)-p.y)<20&&o.side===p.x&&!o.gap)}
function updateAI(p){const upcoming=obstacles.filter(o=>o.worldY>dist+H*.15&&o.worldY<dist+H*.75).sort((a,b)=>a.worldY-b.worldY)[0];if(upcoming&&upcoming.side===p.x&&upcoming.worldY-dist<H*.68)p.x=1-p.x}
function update(dt){if(performance.now()-startedAt<2200)return;dist+=dt*145;const stageLen=H*2.7;stageIndex=Math.floor(dist/stageLen)%3;document.getElementById('stage').textContent=stages[stageIndex].name;for(const p of players){if(!p.alive||p.finish)continue;if(p.ai)updateAI(p);p.progress=dist;if(nearestObstacle(p))p.alive=false;if(dist>=stageLen*3){p.finish=true;p.alive=false}}
const alive=players.filter(p=>p.alive).length,done=players.filter(p=>p.finish).length;document.getElementById('alive').textContent=alive+'/'+players.length;if(players[0]&&!players[0].alive){endRace();return}if(players.slice(1).every(p=>!p.alive)&&players[0]?.alive){endRace();return}if(done>0){endRace();return}}
function frame(t){if(!run)return;const dt=Math.min((t-last)/1000||0,.04);last=t;drawBackground(stages[stageIndex]);obstacles.forEach(o=>drawObstacle(o,stages[stageIndex]));players.forEach(drawCharacter);if(performance.now()-startedAt<2200){ctx.fillStyle='#fff';ctx.font='1000 64px system-ui';ctx.textAlign='center';ctx.strokeStyle='#111';ctx.lineWidth=6;const n=Math.max(1,3-Math.floor((performance.now()-startedAt)/730));ctx.strokeText(n,W/2,H*.22);ctx.fillText(n,W/2,H*.22)}else{document.getElementById('hint').textContent='اضغط على الشاشة لقلب الجاذبية وتفادي العوائق';update(dt)}if(run)raf=requestAnimationFrame(frame)}
function start(){reset();run=true;startedAt=performance.now();last=startedAt;show('intro');document.getElementById('intro').classList.add('hide');document.getElementById('hint').textContent=mode==='bot'?'أنت الأحمر • البوت أزرق • اضغط لقلب الجاذبية':'طور الأونلاين التجريبي • اضغط لقلب الجاذبية';cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
function endRace(){if(finished)return;finished=true;run=false;const me=players[0],winner=me?.alive?me:(players.find(p=>p.finish)||players.slice(1).find(p=>p.alive));document.getElementById('resultTitle').textContent=winner?'🏆 '+winner.name+' فاز!':'انتهى السباق';document.getElementById('resultText').textContent=me&&!me.alive?(mode==='bot'?'اصطدمت بعائق وخرجت من السباق. حاول تقلب الجاذبية قبل وصول العائق إليك.':'خرجت من السباق بعد الاصطدام بعائق.'):(winner?.id===0?'نجوت وتجاوزت منافسك!':'خرج جميع المنافسين الآخرين.');show('result')}
function flip(){if(!run)return;const p=players[0];if(p?.alive)p.x=1-p.x}
cvs.addEventListener('pointerdown',e=>{e.preventDefault();flip()});document.getElementById('botMode').onclick=()=>setMode('bot');document.getElementById('onlineMode').onclick=()=>setMode('online');document.getElementById('play').onclick=()=>start();document.getElementById('back').onclick=()=>show('intro');document.getElementById('again').onclick=()=>{setMode(mode)};document.getElementById('home').onclick=()=>show('intro');document.getElementById('exit').onclick=()=>{run=false;location.href='/mini-app'};updatePreview();
</script></body></html>
