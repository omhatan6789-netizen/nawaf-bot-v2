<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#70baf6"><title>Gravity Run</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#283451;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh}.top{position:fixed;top:env(safe-area-inset-top,8px);left:9px;right:9px;display:flex;justify-content:space-between;align-items:center;z-index:2;pointer-events:none}.pill{background:#fff;color:#26334d;border:2px solid #111;border-radius:30px;padding:6px 12px;font-weight:950;font-size:12px;box-shadow:0 3px 0 #0004}.exit{pointer-events:auto;border:2px solid #111;background:#fff;color:#333;border-radius:25px;padding:7px 14px;font-weight:950}.bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:8px;right:8px;text-align:center;color:#fff;font-weight:900;text-shadow:0 2px 4px #000;font-size:12px;pointer-events:none}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1118;z-index:5}.panel{width:min(90vw,360px);padding:22px;border:3px solid #111;border-radius:24px;background:#fff8d8;color:#242424;text-align:center;box-shadow:0 8px 0 #0005}.panel h1{margin:0 0 8px;font-size:26px}.panel p{font-size:14px;font-weight:750;line-height:1.6}.panel button{width:100%;border:2px solid #111;border-radius:14px;background:#43b96a;color:#fff;font-size:17px;font-weight:950;padding:12px;margin-top:9px;box-shadow:0 4px 0 #17572c}.panel button.gray{background:#6b7280;box-shadow:0 4px 0 #374151}.hide{display:none!important}</style></head><body><canvas id="game"></canvas><div class="top"><div class="pill" id="stage">🌿 الطبيعة</div><button class="exit" id="exit">خروج</button><div class="pill" id="alive">2/2</div></div><div class="bottom" id="hint">اضغط للقفز والانتقال للجدار المقابل</div><div class="overlay hide" id="result"><div class="panel"><h1 id="resultTitle">انتهى السباق</h1><p id="resultText"></p><button id="again">العب مرة أخرى</button><button class="gray" id="home">القائمة الرئيسية</button></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');let W=0,H=0,dpr=1,raf=0,run=false,dist=0,last=0,players=[],obstacles=[],stageIndex=0,finished=false,startedAt=0;
const palette=[{c:'#f0444f',name:'الأحمر'},{c:'#159fe8',name:'الأزرق'}];
const stages=[{name:'🌿 الطبيعة',bg:'#e5f6c6',wall:'#9b573e',edge:'#39bf63',dark:'#713f3a',deco:'#c9e99e'},{name:'🏜️ الصحراء',bg:'#fff09e',wall:'#a85a3f',edge:'#ff9f27',dark:'#713f3a',deco:'#ffe17a'},{name:'❄️ الثلج',bg:'#72b9f6',wall:'#48577f',edge:'#8589b6',dark:'#353f62',deco:'#9bd6ff'}];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cvs.width=W*dpr;cvs.height=H*dpr;cvs.style.width=W+'px';cvs.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){dist=0;stageIndex=0;finished=false;players=palette.map((p,i)=>({id:i,side:i,from:i,to:i,jump:0,y:H*.58,alive:true,color:p.c,name:p.name,progress:0,ai:i===1,stun:0,knock:0,anim:0,finish:false}));obstacles=[];for(let i=0;i<36;i++){const base=1250+i*520;obstacles.push({worldY:base,side:i%2,kind:i%8===3?'spike':i%8===6?'crate':'ledge',hit:false});if(i%5===2)obstacles.push({worldY:base+210,side:1-(i%2),kind:'pit',hit:false})}document.getElementById('alive').textContent='2/2';document.getElementById('stage').textContent=stages[0].name}
function start(){reset();run=true;startedAt=performance.now();last=startedAt;document.getElementById('result').classList.add('hide');document.getElementById('hint').textContent='اضغط للقفز إلى الجدار المقابل • الصندوق يرجعك للخلف';cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
function showResult(title,msg){if(finished)return;finished=true;run=false;document.getElementById('resultTitle').textContent=title;document.getElementById('resultText').textContent=msg;document.getElementById('result').classList.remove('hide')}
function jump(p){if(!run||!p.alive||p.jump>0||p.stun>0)return;p.from=p.side;p.to=1-p.side;p.jump=1}
function wallX(side){return side===0?W*.095:W*.905}
function playerX(p){const t=p.jump>0?1-p.jump:0;return wallX(p.from)+(wallX(p.to)-wallX(p.from))*t}
function drawBg(st){ctx.fillStyle=st.bg;ctx.fillRect(0,0,W,H);for(let i=0;i<15;i++){let x=(i*137+28)%W,y=(i*181+dist*.22)%H;ctx.globalAlpha=.48;ctx.fillStyle=st.deco;ctx.beginPath();ctx.arc(x,y,13+(i%4)*8,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;const left=W*.045,right=W*.955,roadL=W*.075,roadR=W*.925;ctx.fillStyle=st.wall;ctx.fillRect(0,0,roadL,H);ctx.fillRect(roadR,0,W-roadR,H);ctx.fillStyle=st.edge;ctx.fillRect(roadL-5,0,9,H);ctx.fillRect(roadR-4,0,9,H);ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(roadL,0);ctx.lineTo(roadL,H);ctx.moveTo(roadR,0);ctx.lineTo(roadR,H);ctx.stroke();for(let y=-20;y<H+30;y+=20){for(const x of [roadL,roadR]){ctx.fillStyle=st.edge;ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill()}}}
function oy(o){return H-(o.worldY-dist)}
function drawObstacle(o,st){const y=oy(o);if(y<-90||y>H+90)return;const x=wallX(o.side),dir=o.side===0?1:-1;if(o.kind==='pit'){ctx.fillStyle=st.dark;ctx.fillRect(o.side===0?W*.045:W*.925,y-17,W*.03,36);ctx.fillStyle='#111';ctx.fillRect(o.side===0?W*.073:W*.925,y-18,7,38);return}if(o.kind==='ledge'){ctx.fillStyle=st.edge;ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x,y-7,dir*W*.19,15,5);ctx.fill();ctx.stroke();return}const w=Math.min(W*.16,78),h=o.kind==='spike'?27:40,bx=o.side===0?W*.075:W*.925-w;ctx.fillStyle=o.kind==='crate'?'#b56550':st.dark;ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.fillRect(bx,y-h/2,w,h);ctx.strokeRect(bx,y-h/2,w,h);if(o.kind==='crate'){ctx.strokeStyle='#754236';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx+5,y-h/2+4);ctx.lineTo(bx+w-5,y+h/2-4);ctx.moveTo(bx+w-5,y-h/2+4);ctx.lineTo(bx+5,y+h/2-4);ctx.stroke()}else{ctx.fillStyle='#f4fbff';ctx.beginPath();for(let k=0;k<4;k++){ctx.moveTo(bx+k*w/4,y+h/2);ctx.lineTo(bx+(k+.5)*w/4,y-h/2);ctx.lineTo(bx+(k+1)*w/4,y+h/2)}ctx.fill();ctx.stroke()}}
function drawRunner(p){if(!p.alive)return;const x=playerX(p),air=p.jump>0,arc=air?Math.sin((1-p.jump)*Math.PI)*W*.19:0,y=p.y-arc;ctx.save();ctx.translate(x,y);const face=p.side===0?1:-1;ctx.scale(face,1);ctx.lineCap='round';ctx.lineJoin='round';const swing=Math.sin(p.anim*13)*7;
 // backpack
 ctx.fillStyle='#ffd332';ctx.strokeStyle='#101010';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-17,0,13,19,4);ctx.fill();ctx.stroke();
 // body and head remain upright; no upside-down rotation
 ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,-2,13,17,0,0,Math.PI*2);ctx.fill();ctx.stroke();
 // arms
 ctx.strokeStyle='#101010';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-7,4);ctx.lineTo(-13,12+swing*.25);ctx.moveTo(7,4);ctx.lineTo(13,12-swing*.25);ctx.stroke();
 ctx.strokeStyle=p.color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-13,12+swing*.25);ctx.lineTo(-16,14+swing*.25);ctx.moveTo(13,12-swing*.25);ctx.lineTo(16,14-swing*.25);ctx.stroke();
 // animated legs and shoes
 ctx.strokeStyle='#101010';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-5,12);ctx.lineTo(-8+swing,23);ctx.moveTo(5,12);ctx.lineTo(8-swing,23);ctx.stroke();
 ctx.strokeStyle=p.color;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-8+swing,23);ctx.lineTo(-14+swing,23);ctx.moveTo(8-swing,23);ctx.lineTo(14-swing,23);ctx.stroke();
 // eyes
 ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-4,-5,2,0,Math.PI*2);ctx.arc(4,-5,2,0,Math.PI*2);ctx.fill();
 // headband is always above the face
 ctx.fillStyle=p.color;ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-14,-17,28,6,3);ctx.fill();ctx.stroke();
 ctx.restore();ctx.textAlign='center';ctx.font='900 11px system-ui';ctx.lineWidth=3;ctx.strokeStyle='#222';ctx.strokeText(p.name,x,y-31);ctx.fillStyle='#fff';ctx.fillText(p.name,x,y-31)}
function updatePlayer(p,dt){if(!p.alive)return;p.anim+=dt;if(p.stun>0){p.stun-=dt;return}if(p.knock>0){p.knock-=dt;dist=Math.max(0,dist-dt*260);return}if(p.jump>0){p.jump=Math.max(0,p.jump-dt*2.5);if(p.jump===0)p.side=p.to}if(p.ai&&p.jump===0){const next=obstacles.filter(o=>o.worldY>dist+H*.35&&o.worldY<dist+H*.8&&o.side===p.side).sort((a,b)=>a.worldY-b.worldY)[0];if(next&&next.worldY-dist<H*.68)jump(p)}const target=obstacles.find(o=>!o.hit&&o.side===p.side&&Math.abs(oy(o)-p.y)<23);if(target){target.hit=true;if(target.kind==='pit'){p.alive=false}else if(target.kind==='spike'){p.knock=1.1;p.stun=.3}else{p.knock=.65;p.stun=.18}}if(p.y<-20||p.y>H+20)p.alive=false}
function update(dt){if(performance.now()-startedAt<1900)return;dist+=dt*155;const stageLen=H*2.55;stageIndex=Math.min(2,Math.floor(dist/stageLen));document.getElementById('stage').textContent=stages[stageIndex].name;players.forEach(p=>updatePlayer(p,dt));const alive=players.filter(p=>p.alive).length;document.getElementById('alive').textContent=alive+'/2';if(!players[0].alive){showResult('💥 خرجت من السباق','سقطت في حفرة أو اصطدمت بمسامير. جرّب القفز في الوقت المناسب.');return}if(!players[1].alive){showResult('🏆 فزت!','اللاعب الأزرق سقط، وأنت ما زلت في السباق.');return}if(dist>=stageLen*3){showResult('🏆 وصلت للنهاية!','أنهيت الطبيعة والصحراء والثلج قبل منافسك.');return}}
function frame(t){if(!run)return;const dt=Math.min((t-last)/1000||0,.04);last=t;drawBg(stages[stageIndex]);obstacles.forEach(o=>drawObstacle(o,stages[stageIndex]));players.forEach(drawRunner);if(performance.now()-startedAt<1900){const n=Math.max(1,3-Math.floor((performance.now()-startedAt)/630));ctx.textAlign='center';ctx.font='1000 62px system-ui';ctx.lineWidth=6;ctx.strokeStyle='#111';ctx.strokeText(n,W/2,H*.22);ctx.fillStyle='#fff';ctx.fillText(n,W/2,H*.22)}else update(dt);if(run)raf=requestAnimationFrame(frame)}
cvs.addEventListener('pointerdown',e=>{e.preventDefault();jump(players[0])});document.getElementById('exit').onclick=()=>{run=false;location.href='/mini-app'};document.getElementById('again').onclick=start;document.getElementById('home').onclick=()=>{run=false;location.href='/mini-app'};start();
</script></body></html>
