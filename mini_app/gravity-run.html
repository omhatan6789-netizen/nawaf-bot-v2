*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#26334f;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}#game{display:block;width:100vw;height:100dvh}.top{position:fixed;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:3;pointer-events:none}.pill{background:#fff;color:#27334d;border:2px solid #111;border-radius:30px;padding:7px 13px;font-weight:900;font-size:13px;box-shadow:0 3px 0 #0004}.exit{pointer-events:auto;border:2px solid #111;background:#fff;color:#333;border-radius:25px;padding:8px 16px;font-weight:950}.bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:12px;right:12px;text-align:center;color:#fff;font-weight:900;text-shadow:0 2px 4px #0009;font-size:13px;pointer-events:none}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1118;z-index:5}.panel{width:min(88vw,360px);padding:22px;border:3px solid #111;border-radius:24px;background:#fff8d8;color:#242424;text-align:center;box-shadow:0 8px 0 #0005}.panel h1{margin:0 0 8px;font-size:27px}.panel p{font-size:14px;font-weight:700;line-height:1.6}.panel button{width:100%;border:2px solid #111;border-radius:14px;background:#43b96a;color:#fff;font-size:18px;font-weight:950;padding:13px;margin-top:9px;box-shadow:0 4px 0 #17572c}.hide{display:none!important}</style></head><body><canvas id="game"></canvas><div class="top"><div class="pill" id="stage">🌿 الغابة</div><button class="exit" id="exit">خروج</button><div class="pill" id="alive">5/5</div></div><div class="bottom">اضغط لقلب الجاذبية • تجنّب الحواجز والحفر</div><div class="overlay" id="intro"><div class="panel"><h1>Gravity Run</h1><p>نسخة معاينة بتصميم مستوحى مباشرة من الفيديوهات المرفقة.<br>اقلب الجاذبية بين الجدارين وتجنب العوائق.</p><button id="start">ابدأ اللعب</button></div></div><div class="overlay hide" id="result"><div class="panel"><h1 id="resultTitle">انتهى السباق</h1><p id="resultText"></p><button id="again">العب مرة أخرى</button><button id="home" style="background:#4a6a91">العودة للألعاب</button></div></div><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');let W=0,H=0,dpr=1,raf=0,run=false,world=0,dist=0,last=0,players=[],obstacles=[],stageIndex=0,score=0;
const sprite=new Image();sprite.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAAA7CAYAAADLjIzcAAAGDklEQVR42u1b70tbVxh+ktRVnCNhDY0J0tIv/VaokzapFNrVH13bSLrU9EuLxgptKMF9tLJRmAyiHy1hRMEYy/qluruKbWFNLQjSxjrJYH+AbIhpoZOIWbIIdB/03p7749ycq7k2ah4Qk/vjeM/7Pu/zvu85V4N/ZHkNexhG7HEUDVA0wB7HvnwP+KjzKvXc4aMVqGq9t7sNsJp6ST03m1r/3epvxZ+Gqt0XAlLv93kvos97EfVm00cjTHC7mwE85s/VAOk0AKCx2omWmSnEF7MAgMmpJJ6PhnKOcTn0cOcaQA3PIneZruP8lTDaa1Dn+Qblrhu7Kwu8fTcv+glFYlRNeRa5i+RgO46vJZnHzySiePXkQWEy4O27eerxYNtNDI8+lgvoBIdBAFWtVTl1iBRibrgDAGD39eDUpWv6MkAtA6jBZnWgM+CHzerAscu3cOSMVzmLTHDIJKKKTMgkouD8ldRnSA13IDnYvjMKocSvYc36IT3u87jh87hlGUgaFnkxQCYRRSYR3fT9Po9b+HyrsTrn9XdbG0XfyUnVm03o815E79ICepcWMFTthDc29zHMJkdxYvk5mwaoVXWbpbsSwgP9CA+Ij4UiMXQG/GyaMjkqfG6qPY/GjfQrjH//KjjiuVf2d6obQCoknwI3mhrQGdB+n3TyPLrLjBgvMSC+mEXJh3+B0gJvhmxWh+p5lhRHYrzEwJYGOX8lAAhxEy63qA4czKSFe7YTqeEOnKi14fsf+0VsbZmZkoVBsPkh4i/Wn9For2ETQX5Sb9bceLPmFk1Y6bp8IjryjOm6zoBfFqrxxSxucU9xP5GgdqTMWYDzV6LC8BgVho+FCcmIljazLt4lxc9or5F5TQlkugOAO+9X0TIzBQA4efuQcHz5oBPTpXV0A0hLUqnH9fRwsO0m7MeaNI3Fp72m2vOyzlMJ0mpQZoDp0jrYfT0iFtCMwHd3ubyhpPC0dHjl5JeaDDBU7URjOi38DFU70V1mFJ5vzGKhCiA1BMi8ShYRJCPyzQyb1QGb1YHwQL+oMNoMXv/8j/B5ZPx3KrsVDZAcbJcJS7jcIkyY14B8ih+Z8vrGZhAe6BcVXLSahMVQ8cWswFQy9qkGIFdsQpGYaPJ66AGVmgzCpxVkCZyzFK43mzBdWocWhlqAVRu0tMepv0ZUi6HuMiOalxYUz528fQicgkGZGKA0ie30PCuaXS5N19OW12QGIEWPzwA/fH4dOwlS1W8IdGnLAmT8fYoyF4DmeoCHtAJsCHThtLOK3QCZRFSkurQ0qDfUulG1OoPv+ACga3AM5a4bqnsQxlwrK1L6axVEPbxvOXshbwJsVGsxvbE5WS9AY0a+4LoSzMtahFrcM2UBkmZKtN8KE2xWh8zLwbabsFkdTDtHSqvGfCvMg3UfwSB9Q4QXPWmcfdH7tywcfvrvF6pIzp+rkT2cFnryQkxjQ73ZJOr7peOzMlRWCB0548XsBCd/WH8l5L75NBlCKHG5pxjZcBT5vD6PG9nNaAAAVLXeE3WDWsG3p/nIAkrel3qWrPWB9Q2Q7LcR5r+zj9ozb/TNx9eSmJxKwpx6rRqD9WYTLGcvoM60qpvXQ5EYVtaSQGwOpt8C+CP9GWYnOKEp+upCk2K5q0kDckEa87xWDFU7Ve/TqgHblXWY9wZfPXkgWifgY03weFqfAqkh0IWvjx/CtE6sYjKAdJ+g3mxa9zilG9tqG3z4aAWWDzqF5atp6Id9LJ4nJy8InEaPk/SnbYUDwMr+AwCwba/QaNoe93ncaExr9zpZoHhjc7p6VDPj9F6dIbszNc8XrAHIZWSl9Hc/kRB5WIo771cRX8zC7uvRnKIKhgG20x6qd8dLDGiqPZ+T+kpvZxQCmDTg1KVreDQ5itXUSzhei const stages=[{name:'🌿 الطبيعة',bg:'#e5f6c6',wall:'#9b573e',edge:'#39bf63',dark:'#713f3a',deco:'#c9e99e'},{name:'🏜️ الصحراء',bg:'#fff09e',wall:'#a85a3f',edge:'#ff9f27',dark:'#713f3a',deco:'#ffe17a'},{name:'❄️ الثلج',bg:'#72b9f6',wall:'#48577f',edge:'#8589b6',dark:'#353f62',deco:'#9bd6ff'}];
const colors=['#ef5057','#159fe8','#3bbd68','#ffca36','#9a68d5'];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cvs.width=W*dpr;cvs.height=H*dpr;cvs.style.width=W+'px';cvs.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){dist=0;score=0;stageIndex=0;players=colors.map((c,i)=>({id:i,x:i%2?1:0,y:H*.48+(i-2)*Math.min(48,H*.06),alive:true,color:c,hue:[0,205,115,55,285][i],progress:0,flip:0,trail:[]}));obstacles=[];for(let i=0;i<90;i++)obstacles.push({worldY:260+i*205,side:i%2,kind:i%8===3?'crate':i%8===5?'spike':'block',gap:i%11===8})}
function drawScallop(x,y,side,st){ctx.fillStyle=st.edge;ctx.strokeStyle='#161616';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y);for(let i=0;i<Math.ceil(H/18)+2;i++){let yy=y+i*18;ctx.arc(x+(side? -5:5),yy+8,9,-Math.PI/2,Math.PI/2,side);};ctx.stroke();ctx.fill()}
function drawBackground(st){ctx.fillStyle=st.bg;ctx.fillRect(0,0,W,H);for(let i=0;i<8;i++){let x=((i*113+35)%W),y=((i*167+dist*.18)%H);ctx.fillStyle=st.deco;ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(x,y,12+(i%3)*8,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
ctx.fillStyle=st.wall;ctx.fillRect(0,0,W*.12,H);ctx.fillRect(W*.88,0,W*.12,H);ctx.fillStyle=st.edge;ctx.fillRect(W*.12,0,9,H);ctx.fillRect(W*.88-9,0,9,H);ctx.strokeStyle='#111';ctx.lineWidth=5;ctx.strokeRect(W*.12,0, W*.76,H);for(let y=-20;y<H+30;y+=19){for(const x of [W*.12+3,W*.88-3]){ctx.fillStyle=st.edge;ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle=st.dark;ctx.lineWidth=2;ctx.stroke()}}}
function obstacleY(o){return H-(o.worldY-dist)}function drawObstacle(o,st){const x0=W*.12+10,x1=W*.88-10;const y=obstacleY(o);if(y<-100||y>H+100)return;const w=Math.max(42,W*.18),h=o.kind==='spike'?25:Math.max(48,H*.07);let x=o.side?x1-w:x0;if(o.gap){ctx.fillStyle=st.dark;ctx.fillRect(o.side?x1-5:x0-5,y-12,7,h+24);return}ctx.fillStyle=o.kind==='crate'?'#ad5b4d':st.dark;ctx.strokeStyle='#090909';ctx.lineWidth=4;ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);if(o.kind==='crate'){ctx.strokeStyle='#733c35';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+5,y+5);ctx.lineTo(x+w-5,y+h-5);ctx.moveTo(x+w-5,y+5);ctx.lineTo(x+5,y+h-5);ctx.stroke()}else if(o.kind==='spike'){ctx.fillStyle='#d9f3ff';ctx.beginPath();for(let k=0;k<4;k++){ctx.moveTo(x+k*w/4,y+h);ctx.lineTo(x+(k+.5)*w/4,y);ctx.lineTo(x+(k+1)*w/4,y+h)}ctx.fill();ctx.stroke()}}
function drawPlayer(p){if(!p.alive)return;const x=p.x===0?W*.17:W*.83;ctx.save();ctx.translate(x,p.y);ctx.rotate(p.x===0?Math.PI/2:-Math.PI/2);ctx.shadowColor='#0005';ctx.shadowBlur=3;ctx.filter='hue-rotate('+p.hue+'deg)';ctx.drawImage(sprite,-21,-20,42,40);ctx.filter='none';ctx.restore();ctx.fillStyle=p.color;ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(['أحمر','أزرق','أخضر','أصفر','بنفسجي'][p.id],x,p.y-28)}
function update(dt){dist+=dt*155;stageIndex=Math.floor(dist/(H*2.7))%3;document.getElementById('stage').textContent=stages[stageIndex].name;for(const p of players){if(!p.alive)continue;p.progress=dist+(2-p.id)*30;const near=obstacles.find(o=>Math.abs(obstacleY(o)-p.y)<(o.kind==='spike'?22:34)&&o.side===p.x);if(near){p.alive=false}}
document.getElementById('alive').textContent=players.filter(p=>p.alive).length+'/5';if(players.filter(p=>p.alive).length<=1){endRace();}}
function frame(t){if(!run)return;const dt=Math.min((t-last)/1000||0,.04);last=t;const st=stages[stageIndex];drawBackground(st);obstacles.forEach(o=>drawObstacle(o,st));players.forEach(drawPlayer);update(dt);raf=requestAnimationFrame(frame)}
function start(){reset();run=true;last=performance.now();document.getElementById('intro').classList.add('hide');document.getElementById('result').classList.add('hide');cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
function endRace(){run=false;const alive=players.filter(p=>p.alive);document.getElementById('resultTitle').textContent=alive.length?'🏆 فائز السباق':'انتهى السباق';document.getElementById('resultText').textContent=alive.length?('الفائز: '+['الأحمر','الأزرق','الأخضر','الأصفر','البنفسجي'][alive[0].id]):'الجميع خسر';document.getElementById('result').classList.remove('hide')}
function flip(){if(!run)return;const p=players[0];p.x=1-p.x;p.flip++;}
cvs.addEventListener('pointerdown',e=>{e.preventDefault();flip()});document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;document.getElementById('exit').onclick=()=>{run=false;location.href='/mini-app'};document.getElementById('home').onclick=()=>location.href='/mini-app';
</script></body></html>
